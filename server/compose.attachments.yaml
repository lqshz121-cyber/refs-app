services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
    volumes:
      - attachment_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set refs http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing --with-lock refs/refs-evidence
        mc version enable refs/refs-evidence
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  clamav:
    image: clamav/clamav:1.4.3
    ports:
      - "${CLAMAV_PORT}:3310"
    volumes:
      - attachment_clamav_data:/var/lib/clamav

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: refs_kernel_test
      POSTGRES_USER: refs_migrator
      POSTGRES_PASSWORD: refs_migrator_test_K8r3w5T1z9Hp
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refs_migrator -d refs_kernel_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - attachment_pg_data:/var/lib/postgresql/data
      - ./runtime/docker-init.sql:/docker-entrypoint-initdb.d/010-runtime-role.sql:ro

  scanner-bridge:
    build:
      context: .
      dockerfile: scanner-sidecar/Dockerfile
    depends_on:
      - minio
      - clamav
    environment:
      SCANNER_BEARER_TOKEN: ${SCANNER_BEARER_TOKEN}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: refs-evidence
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SCANNER_TLS_KEY: /run/secrets/scanner-key.pem
      SCANNER_TLS_CERT: /run/secrets/scanner-cert.pem
      REFS_ALLOW_INSECURE_TEST_ENDPOINTS: "1"
      NODE_ENV: test
    ports:
      - "${SCANNER_PORT}:8443"
    volumes:
      - "${SCANNER_TLS_KEY_FILE:-./scanner-sidecar/scanner-key.pem}:/run/secrets/scanner-key.pem:ro"
      - "${SCANNER_TLS_CERT_FILE:-./scanner-sidecar/scanner-cert.pem}:/run/secrets/scanner-cert.pem:ro"

volumes:
  attachment_minio_data:
  attachment_clamav_data:
  attachment_pg_data:
