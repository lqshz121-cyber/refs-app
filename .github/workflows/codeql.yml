# X05: CodeQL must produce a check on every pull request so it can become a required check.
#
# The previous version was workflow_dispatch only, with this rationale: GitHub Advanced Security is
# required for code scanning on a private repository, and making a job that cannot run into a
# required check would block every PR. That rationale is sound, so it is preserved rather than
# discarded -- but "cannot be required" and "does not run" are different problems, and only the
# second one had to be fixed here.
#
# The job now runs on pull_request and detects up front whether code scanning is actually
# available. When it is not, the job reports that clearly and succeeds, so the check exists and is
# green without pretending an analysis happened. When GHAS is enabled the analysis runs for real
# and a failure is a real failure. Owner action to make it required is therefore safe either way.
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: codeql-analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Detect whether code scanning is available
        id: capability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A repository without GHAS returns 403 here. Treat that as "unavailable", not as a
          # failure, so the check is present and honest rather than red for a reason no PR author
          # can fix.
          code=$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1" \
                   --silent --include 2>/dev/null | head -1 | grep -oE '[0-9]{3}' | head -1 || true)
          if [ "$code" = "403" ] || [ -z "$code" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Code scanning is not available for this repository (HTTP ${code:-unknown})."
            echo "Skipping analysis. Enable GitHub Advanced Security to turn this into a real gate."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@v3
        if: steps.capability.outputs.available == 'true'
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        if: steps.capability.outputs.available == 'true'
        with:
          category: "/language:${{ matrix.language }}"
      - name: Record that analysis was skipped
        if: steps.capability.outputs.available != 'true'
        run: echo "CODEQL_SKIPPED=code scanning unavailable" >> "$GITHUB_STEP_SUMMARY"
