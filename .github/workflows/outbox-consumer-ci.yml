name: Outbox Consumer Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: refs_outbox_consumer_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: server
      - run: node --test tests/outbox-consumer.test.mjs outbox-consumer/postgres.test.mjs
        working-directory: server
        env:
          OUTBOX_CONSUMER_TEST_ADMIN_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/refs_outbox_consumer_test
