name: Accounting Kernel Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies exactly
        run: npm ci
      - name: Install kernel dependencies exactly
        working-directory: server
        run: npm ci
      - name: TypeScript domain gate
        run: npm run typecheck
      - name: Frontend build
        run: npm run build
      - name: Frontend SSR gate
        run: npm run test:ssr
      - name: AP and AR workflow gate
        run: npm run test:ap-ar
      - name: Authoritative Payables responsive gate
        run: npm run test:payables-responsive
      - name: Authoritative API client gate
        run: npm run test:api-client
      - name: Current actor access UI gate
        run: npm run test:authoritative-full-shell
      - name: Auto reconciliation fail-closed gate
        run: npm run test:autorecon
      - name: Frontend audit gate
        run: npm run test:audit
      - name: Database dictionary least-privilege gate
        working-directory: server
        run: npm run test:database-dictionary
      - name: Complete root release suite gate
        run: npm test
      - name: Accounting kernel static and unit gate
        working-directory: server
        run: npm test

  # R05: the release gates, each on its own fully migrated database (tools/gate-runner.mjs), plus
  # the migration ledger idempotency check. Failure semantics: red when any gate step fails, when
  # a gate skips every test (a gate may not pass by skipping), when a second `db:up` on an already
  # migrated database applies anything or exits non-zero, or when the fresh ledger head is not the
  # manifest head. Never softened with continue-on-error.
  core-gates:
    name: core-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REFS_PG_REQUIRED: '1'
      # Local-only test credentials, identical to server/compose.yaml and runtime/docker-init.sql.
      # Production runtime validation rejects these defaults.
      DATABASE_URL: postgresql://refs_runtime:refs_runtime_test_N7v2p9Q4x6Lm@127.0.0.1:55432/refs_kernel_test
      MIGRATION_DATABASE_URL: postgresql://refs_migrator:refs_migrator_test_K8r3w5T1z9Hp@127.0.0.1:55432/refs_kernel_test
      CONTEXT_ISSUER_DATABASE_URL: postgresql://refs_context_issuer:refs_issuer_test_P6m4s8V2q7Jc@127.0.0.1:55432/refs_kernel_test
      GRANT_SYNC_DATABASE_URL: postgresql://refs_grant_sync:refs_grant_sync_test_R9k5d3W8y2Fn@127.0.0.1:55432/refs_kernel_test
    steps:
      - uses: actions/checkout@v4
        with:
          # gate:security's secret scan diffs the pull request range, which needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install kernel dependencies exactly
        working-directory: server
        run: npm ci
      - name: Start a fresh local-only PostgreSQL 16
        working-directory: server
        env:
          # Debian image (not alpine) so CPD-8 can install plpgsql_check from the image's PGDG apt source.
          POSTGRES_IMAGE: postgres:16
        run: docker compose -p refs_core_gates -f compose.yaml up -d --wait
      - name: Install plpgsql_check for CPD-8 (static planning of every PL/pgSQL statement)
        working-directory: server
        run: docker compose -p refs_core_gates -f compose.yaml exec -T postgres sh -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-plpgsql-check'
      - name: Migrate a fresh database to the manifest head
        working-directory: server
        run: npm run db:up
      - name: A second db:up must be a no-op on an already migrated database
        working-directory: server
        run: npm run verify:migration-idempotent
      - name: Release gates, one isolated database per gate
        working-directory: server
        env:
          SECRET_SCAN_RANGE: origin/${{ github.base_ref || 'main' }}...HEAD
          # CPD-8 fails instead of skipping when the extension is missing here.
          REFS_REQUIRE_PLPGSQL_CHECK: '1'
        run: npm run gate:isolated -- --out out/gates
      - name: Upload per-gate JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-gates-json
          path: server/out/gates/
          if-no-files-found: error
      - name: Stop PostgreSQL
        if: always()
        working-directory: server
        run: docker compose -p refs_core_gates -f compose.yaml down -v

  postgres-required:
    name: PostgreSQL ${{ matrix.postgres }} required gate
    runs-on: ubuntu-latest
    # PostgreSQL 15 can exceed 30 minutes for the 225+ test fresh gate under
    # runner variance; retain time for the mandatory restore drill.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16', '18']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install kernel dependencies exactly
        working-directory: server
        run: npm ci
      - name: Verify PostgreSQL checkout provenance
        working-directory: server
        run: npm run verify:postgres-ci-checkout
      - name: Run fresh zero-skip PostgreSQL kernel and accounting settings gates
        working-directory: server
        env:
          POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
        run: npm run test:postgres:fresh
      - name: Run isolated backup and restore drill
        working-directory: server
        env:
          POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
        run: npm run test:backup:restore

  postgres-business-closures:
    name: PostgreSQL business-closure fixture gate
    runs-on: ubuntu-latest
    # The fixture suite starts a fresh, owned database for every accounting
    # closure. Keep it separate from the version matrix so each closure has a
    # bounded, reviewable receipt instead of being hidden in a broad unit run.
    # 24 serial fixtures each have a 90-second bounded test window plus fresh
    # database startup and cleanup. Leave enough headroom for runner variance;
    # the per-fixture watchdog still bounds a stalled closure.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install kernel dependencies exactly
        working-directory: server
        run: npm ci
      - name: Verify PostgreSQL checkout provenance
        working-directory: server
        run: npm run verify:postgres-ci-checkout
      - name: Run every isolated PostgreSQL accounting closure
        working-directory: server
        env:
          POSTGRES_IMAGE: postgres:16-alpine
        run: npm run test:postgres:fixtures:closure

  attachment-containers:
    name: Versioned object storage and malware scan gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install kernel dependencies exactly
        working-directory: server
        run: npm ci
      - name: Run real MinIO versioning and ClamAV gate
        working-directory: server
        run: npm run test:attachments:containers
