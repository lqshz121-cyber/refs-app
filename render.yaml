services:
  # Secrets are intentionally not committed. Provision every sync:false value in the
  # staging environment before first deploy; the API fails closed when any is absent.
  - type: web
    name: refs-accounting-api-staging
    runtime: node
    rootDir: server
    buildCommand: npm ci
    preDeployCommand: npm run db:up
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: REFS_HTTP_HOST
        value: 0.0.0.0
      # Provider-signed delivery keeps immutable raw request/response/package
      # bytes. This is a total request-body limit, not a per-field limit.
      - key: REFS_HTTP_MAX_BODY_BYTES
        value: "10485760"
      - key: REFS_PG_REQUIRED
        value: "1"
      # Non-secret Stage 1 scope coordinates. Keeping these in the Blueprint
      # prevents a later sync from silently disabling the authenticated
      # one-click reader grant. Identity is still derived only from the
      # caller's verified OIDC token; database credentials remain secrets.
      - key: REFS_DEPLOYMENT_ENV
        value: staging
      - key: REFS_STAGE1_BOOTSTRAP_CONFIRM
        value: STAGE1_AUTHORITATIVE_ONLY
      - key: REFS_STAGE1_SELF_GRANT_ENABLED
        value: STAGE1_AUTHORITATIVE_ONLY
      - key: REFS_STAGE1_TENANT_ID
        value: 6fb25daf-0799-4805-bede-be54230da33c
      - key: REFS_STAGE1_ENTITY_ID
        value: ca8d23c7-0ea6-4860-8e3e-caf9a3e22ce3
      # Stage 1 exposes authenticated accounting reads and the unsigned WBS
      # pilot only. Provider-backed attachment and signed-ingest dependencies
      # are released separately through render.integrations.yaml; keeping both
      # modes disabled here leaves their write paths fail-closed without making
      # the Stage 1 API depend on storage/scanner/keyring secrets it does not own.
      - key: REFS_ATTACHMENT_MODE
        value: DISABLED
      - key: REFS_WBS_INGEST_MODE
        value: DISABLED
      - key: REFS_WBS_LIVE_PILOT_MODE
        value: ENABLED
      # Explicitly authorized staging-only bridge: sanitized live-pilot
      # Payables become test-only Drafts and pass through six isolated actors.
      # This mode never claims Provider signature, Object Lock, or admission.
      - key: REFS_WBS_TEST_IMPORT_MODE
        value: ENABLED
      - key: REFS_WBS_TEST_IMPORT_TENANT_ID
        value: 6fb25daf-0799-4805-bede-be54230da33c
      - key: REFS_WBS_TEST_IMPORT_ENTITY_ID
        value: ca8d23c7-0ea6-4860-8e3e-caf9a3e22ce3
      - key: REFS_WBS_TEST_IMPORT_COMPANY_CODE
        value: WBPA
      - key: REFS_WBS_TEST_IMPORT_IMPORTER_ACTOR_ID
        value: wbs-test-importer
      - key: REFS_WBS_TEST_IMPORT_MAKER_ACTOR_ID
        value: wbs-test-maker
      - key: REFS_WBS_TEST_IMPORT_SUBMITTER_ACTOR_ID
        value: wbs-test-submitter
      - key: REFS_WBS_TEST_IMPORT_REVIEWER_ACTOR_ID
        value: wbs-test-reviewer
      - key: REFS_WBS_TEST_IMPORT_APPROVER_ACTOR_ID
        value: wbs-test-approver
      - key: REFS_WBS_TEST_IMPORT_POSTER_ACTOR_ID
        value: wbs-test-poster
      # Isolated AI accounting runner. Keep disabled until the exact OIDC caller
      # is entered in Render; it remains restricted to the fixed test scope.
      - key: REFS_CONTROLLED_TEST_AI_WORKFLOW_MODE
        value: DISABLED
      - key: REFS_CONTROLLED_TEST_AI_CALLER_ACTOR_ID
        sync: false
      - key: REFS_CONTROLLED_TEST_AI_SOURCE_MAKER_ACTOR_ID
        value: refs-controlled-ai-source
      - key: REFS_CONTROLLED_TEST_AI_PROPOSER_ACTOR_ID
        value: refs-controlled-ai-proposer
      - key: REFS_CONTROLLED_TEST_AI_DRAFT_MAKER_ACTOR_ID
        value: refs-controlled-ai-draft
      - key: REFS_CONTROLLED_TEST_AI_SUBMITTER_ACTOR_ID
        value: refs-controlled-ai-submitter
      - key: REFS_CONTROLLED_TEST_AI_REVIEWER_ACTOR_ID
        value: refs-controlled-ai-reviewer
      - key: REFS_CONTROLLED_TEST_AI_APPROVER_ACTOR_ID
        value: refs-controlled-ai-approver
      - key: REFS_CONTROLLED_TEST_AI_POSTER_ACTOR_ID
        value: refs-controlled-ai-poster
      # The unsigned pilot is enabled only on this authoritative staging API.
      # Credentials remain server-side Render secrets and signed admission
      # stays independently disabled until provider trust is delivered.
      - key: WBS_CF_ACCESS_CLIENT_ID
        sync: false
      - key: WBS_CF_ACCESS_CLIENT_SECRET
        sync: false
      - key: WBS_REFS_AUTH
        sync: false
      - key: WBS_SNAPSHOT_ED25519_PUBLIC_KEYS
        sync: false
      - key: WBS_PROVIDER_SIGNED_TRUST
        sync: false
      - key: WBS_PROVIDER_SIGNED_SERVICE_ACTOR_ID
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: VIRUS_SCANNER_ENDPOINT
        sync: false
      - key: VIRUS_SCANNER_TOKEN
        sync: false
      - key: VIRUS_SCANNER_CA_PEM
        sync: false
      - key: VIRUS_SCANNER_SERVER_NAME
        sync: false
      - key: ATTACHMENT_SCANNER_ACTOR_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: CONTEXT_ISSUER_DATABASE_URL
        sync: false
      - key: GRANT_SYNC_DATABASE_URL
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URI
        sync: false
      - key: REFS_HTTP_ALLOWED_ORIGINS
        sync: false
  - type: web
    name: refs-app
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    # Publish the static client only with the API release after staging smoke.
    autoDeployTrigger: off
    envVars:
      # Public deployment coordinates only. OIDC tokens and database credentials
      # never enter the static build; the browser obtains a PKCE access token.
      - key: REFS_PUBLIC_ACCOUNTING_API_BASE_URL
        sync: false
      - key: REFS_WBS_TEST_IMPORT_MODE
        value: ENABLED
      - key: REFS_PUBLIC_ENTITY_ID
        sync: false
      - key: REFS_PUBLIC_PERIOD_ID
        sync: false
      - key: REFS_PUBLIC_CASH_ACCOUNT_CODE
        sync: false
      - key: REFS_PUBLIC_OIDC_ISSUER
        sync: false
      - key: REFS_PUBLIC_OIDC_AUTHORIZATION_ENDPOINT
        sync: false
      - key: REFS_PUBLIC_OIDC_TOKEN_ENDPOINT
        sync: false
      - key: REFS_PUBLIC_OIDC_REDIRECT_URI
        sync: false
      - key: REFS_PUBLIC_OIDC_CLIENT_ID
        sync: false
      - key: REFS_PUBLIC_OIDC_AUDIENCE
        sync: false
      - key: REFS_PUBLIC_OIDC_SCOPE
        value: openid profile
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The deployment-time API adapter must never be served stale: a stale
      # adapter can point a newly deployed UI at the wrong authoritative API.
      # The runtime lock installs the mode slot before the adapter runs. A stale
      # lock served beside a fresh adapter is a deployment that disagrees with
      # itself, so it is never cached either.
      - path: /refs-runtime-lock.js
        name: Cache-Control
        value: no-store
      - path: /refs-runtime-config.js
        name: Cache-Control
        value: no-store
      - path: /refs-build.js
        name: Cache-Control
        value: no-store
      - path: /index.html
        name: Cache-Control
        value: no-store
      # Render evaluates response headers against the requested path before
      # applying the SPA rewrite, so /index.html alone does not protect the
      # authoritative entry document requested at the site root.
      - path: /
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https:; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; form-action 'self'"
