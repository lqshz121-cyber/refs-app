services:
  # Production accounting API. This Blueprint intentionally declares no database,
  # tenant, entity, actor, or domain value. Operators must bind the independently
  # approved production resources through sync:false settings before deployment.
  - type: web
    name: refs-accounting-api-production
    runtime: node
    rootDir: server
    buildCommand: npm ci
    preDeployCommand: npm run db:up
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: REFS_DEPLOYMENT_ENV
        value: production
      - key: REFS_HTTP_HOST
        value: 0.0.0.0
      - key: REFS_HTTP_MAX_BODY_BYTES
        value: "10485760"
      - key: REFS_PG_REQUIRED
        value: "1"
      - key: REFS_PG_MIGRATION_STATEMENT_TIMEOUT_MS
        value: "600000"
      - key: REFS_ATTACHMENT_MODE
        value: DISABLED
      - key: REFS_WBS_INGEST_MODE
        value: DISABLED
      - key: REFS_WBS_LIVE_PILOT_MODE
        value: DISABLED
      - key: REFS_WBS_TEST_IMPORT_MODE
        value: DISABLED
      - key: REFS_CONTROLLED_TEST_AI_WORKFLOW_MODE
        value: DISABLED
      - key: REFS_CONTROLLED_DEMO_MODE
        value: DISABLED
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: CONTEXT_ISSUER_DATABASE_URL
        sync: false
      - key: GRANT_SYNC_DATABASE_URL
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URI
        sync: false
      - key: REFS_HTTP_ALLOWED_ORIGINS
        sync: false

  # Transactional-outbox dispatcher for the production API above. It inherits
  # only that API's production database connections; scope, actor, and delivery
  # credentials remain independently reviewed secrets.
  - type: worker
    name: refs-outbox-dispatch-production
    runtime: node
    rootDir: server
    buildCommand: npm ci
    preDeployCommand: npm run preflight:outbox-dispatch-release
    startCommand: npm run start:outbox-dispatch
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: REFS_PG_REQUIRED
        value: "1"
      - key: DATABASE_URL
        fromService:
          type: web
          name: refs-accounting-api-production
          envVarKey: DATABASE_URL
      - key: MIGRATION_DATABASE_URL
        fromService:
          type: web
          name: refs-accounting-api-production
          envVarKey: MIGRATION_DATABASE_URL
      - key: CONTEXT_ISSUER_DATABASE_URL
        fromService:
          type: web
          name: refs-accounting-api-production
          envVarKey: CONTEXT_ISSUER_DATABASE_URL
      - key: GRANT_SYNC_DATABASE_URL
        fromService:
          type: web
          name: refs-accounting-api-production
          envVarKey: GRANT_SYNC_DATABASE_URL
      - key: OUTBOX_DISPATCH_ACTOR_ID
        sync: false
      - key: OUTBOX_DISPATCH_SCOPES
        sync: false
      - key: OUTBOX_PUBLISH_URL
        sync: false
      - key: OUTBOX_PUBLISH_TOKEN
        sync: false
      - key: OUTBOX_DISPATCH_BATCH
        value: "100"
      - key: OUTBOX_DISPATCH_INTERVAL_MS
        value: "5000"
      - key: OUTBOX_DISPATCH_CONCURRENCY
        value: "2"
      - key: OUTBOX_DISPATCH_LEASE_SECONDS
        value: "300"
      - key: OUTBOX_DISPATCH_MAX_ATTEMPTS
        value: "8"
      - key: OUTBOX_DISPATCH_RETRY_BASE_SECONDS
        value: "5"
      - key: OUTBOX_PUBLISH_TIMEOUT_MS
        value: "10000"
      - key: OUTBOX_DISPATCH_HEALTH_PORT
        value: "10002"
      - key: OUTBOX_DISPATCH_HEALTH_FRESHNESS_MS
        value: "30000"
      - key: OUTBOX_DISPATCH_MAX_CONSECUTIVE_ERRORS
        value: "6"

  # Production browser client. Every coordinate is public configuration, but it
  # remains environment-specific and must be entered through reviewed settings.
  - type: web
    name: refs-app-production
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeployTrigger: off
    envVars:
      - key: REFS_DEPLOYMENT_ENV
        value: production
      - key: REFS_WBS_TEST_IMPORT_MODE
        value: DISABLED
      - key: REFS_CONTROLLED_TEST_AI_WORKFLOW_MODE
        value: DISABLED
      - key: REFS_PUBLIC_ACCOUNTING_API_BASE_URL
        sync: false
      - key: REFS_PUBLIC_ENTITY_ID
        sync: false
      - key: REFS_PUBLIC_PERIOD_ID
        sync: false
      - key: REFS_PUBLIC_CASH_ACCOUNT_CODE
        sync: false
      - key: REFS_PUBLIC_OIDC_ISSUER
        sync: false
      - key: REFS_PUBLIC_OIDC_AUTHORIZATION_ENDPOINT
        sync: false
      - key: REFS_PUBLIC_OIDC_TOKEN_ENDPOINT
        sync: false
      - key: REFS_PUBLIC_OIDC_REDIRECT_URI
        sync: false
      - key: REFS_PUBLIC_OIDC_CLIENT_ID
        sync: false
      - key: REFS_PUBLIC_OIDC_AUDIENCE
        sync: false
      - key: REFS_PUBLIC_OIDC_SCOPE
        value: openid profile
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /refs-runtime-lock.js
        name: Cache-Control
        value: no-store
      - path: /refs-runtime-config.js
        name: Cache-Control
        value: no-store
      - path: /refs-build.js
        name: Cache-Control
        value: no-store
      - path: /index.html
        name: Cache-Control
        value: no-store
      - path: /
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https:; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; form-action 'self'"
