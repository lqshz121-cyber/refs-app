# Independent production consumer only; applying this manifest creates billable
# resources and needs the separately approved production scope and release SHA.
databases:
  - name: refs-outbox-consumer-postgres-production
    databaseName: refs_outbox_consumer_production
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
services:
  - type: web
    name: refs-outbox-consumer-production
    runtime: node
    region: oregon
    plan: starter
    numInstances: 1
    rootDir: server
    buildCommand: npm ci
    startCommand: node outbox-consumer/start.mjs
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: OUTBOX_CONSUMER_DATABASE_NAME
        value: refs_outbox_consumer_production
      - key: OUTBOX_CONSUMER_DATABASE_URL
        sync: false
      - key: OUTBOX_CONSUMER_TOKEN
        sync: false
      - key: OUTBOX_CONSUMER_TENANT_ID
        sync: false
      - key: OUTBOX_CONSUMER_ENTITY_ID
        sync: false
