/* API-backed accounting workbenches adopt the demonstrated product hierarchy:
   a short reading rail, compact fact cards, then a contained evidence table.
   These selectors only arrange server-returned facts; they never provide demo
   rows, browser persistence, or accounting actions. */
.authoritative-coa-workbench,.authoritative-general-ledger{min-width:0;}
.authoritative-ledger-reading-rail{margin:0 0 14px;}
.authoritative-ledger-reading-rail span{background:var(--qb-inset);}
.authoritative-coa-workbench .journal-evidence-header,.authoritative-general-ledger .journal-evidence-header{position:relative;overflow:hidden;margin:0 0 12px;padding:20px;border:var(--qb-hair) solid var(--qb-divider);border-radius:var(--qb-r-card);background:linear-gradient(135deg,var(--qb-surface) 0%,var(--qb-inset) 100%);box-shadow:var(--qb-shadow-card);}
.authoritative-coa-workbench .journal-evidence-header::after,.authoritative-general-ledger .journal-evidence-header::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--qb-accent);}
.authoritative-coa-workbench .journal-evidence-header>*,.authoritative-general-ledger .journal-evidence-header>*{position:relative;}
.authoritative-ledger-toolbar{margin:0 0 12px;padding:14px 16px;border:var(--qb-hair) solid var(--qb-divider);border-radius:var(--qb-r-card);background:var(--qb-surface);box-shadow:var(--qb-shadow-card);}
.authoritative-coa-summary>span,.authoritative-register-scope>span{min-height:94px;box-shadow:var(--qb-shadow-card);}
.authoritative-coa-summary>span:first-child,.authoritative-register-scope>span:first-child{border-top:3px solid var(--qb-brand);}
.authoritative-coa-summary>span:nth-child(2),.authoritative-register-scope>span:nth-child(2){border-top:3px solid var(--qb-accent);}
.authoritative-coa-summary>span:nth-child(3),.authoritative-register-scope>span:nth-child(3){border-top:3px solid var(--qb-warn);}
.authoritative-coa-summary>span:nth-child(4),.authoritative-register-scope>span:nth-child(4){border-top:3px solid var(--qb-text-muted);}
.authoritative-coa-table,.authoritative-register-table,.authoritative-general-ledger-table{box-shadow:var(--qb-shadow-card);}
.authoritative-coa-table tbody tr:hover,.authoritative-register-table tbody tr:hover,.authoritative-general-ledger-table tbody tr:hover{background:var(--qb-inset);}
.authoritative-general-ledger .authoritative-filter-bar{margin:0 0 12px;padding:14px 16px;border:var(--qb-hair) solid var(--qb-divider);border-radius:var(--qb-r-card);background:var(--qb-surface);box-shadow:var(--qb-shadow-card);}
.authoritative-gl-amount-card{border:var(--qb-hair) solid var(--qb-divider);box-shadow:var(--qb-shadow-card);}
.authoritative-gl-amount-card>div{padding:4px 6px;}
@media (max-width:1024px){.authoritative-coa-summary,.authoritative-register-scope{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:600px){.authoritative-coa-summary,.authoritative-register-scope,.authoritative-gl-amount-card,.authoritative-gl-id-grid{grid-template-columns:minmax(0,1fr);}.authoritative-coa-filter .result-count{align-self:flex-start;margin-left:0;}.authoritative-coa-filter .btn,.authoritative-register-filter .btn,.authoritative-coa-pagination .btn{width:100%;}.authoritative-coa-page-size{width:100%;}.authoritative-register-back{align-items:flex-start;flex-direction:column;gap:8px;}.authoritative-coa-pagination{align-items:stretch;flex-direction:column;}.authoritative-coa-pagination span{margin-right:0;}}
.tbl,.mini-table,.stmt-tbl,.je-lines{width:100%; border-collapse:separate; border-spacing:0; font-size:14px;}
.tbl th{
  position:sticky; top:0; z-index:2; height:40px; padding:8px 12px;
  background:var(--qb-surface); color:var(--qb-text-strong);
  border-bottom:1px solid var(--qb-border-alt);
  font:600 14px/1.3 var(--qb-sans); text-align:left; text-transform:none; letter-spacing:0;
  white-space:nowrap; word-break:keep-all; user-select:none; backdrop-filter:none;
  /* A sticky cell paints its border under the scrolled row in some engines;
     the 1px shadow guarantees the header edge survives the scroll. It is the
     measured 1px offset, not a soft drop shadow. */
  box-shadow:0 1px 0 0 var(--qb-border-alt);
}
.tbl td{
  height:44px; padding:9px 12px; border-top:1px solid var(--qb-border-alt);
  color:var(--qb-text); vertical-align:middle; font-size:14px;
}
.tbl td:first-child,.tbl th:first-child{padding-left:16px;}
.tbl td:last-child,.tbl th:last-child{padding-right:16px;}
.tbl-dense td{height:36px; padding:5px 12px!important;}
.ta-r{text-align:right; font-variant-numeric:tabular-nums;}
.tbl th.ta-r,.tbl td.ta-r{text-align:right;}
.th-sort{
  appearance:none; border:0; background:transparent; color:inherit; font:inherit;
  letter-spacing:inherit; padding:0; cursor:pointer; text-align:inherit;
}
.th-sort:hover{color:var(--qb-link);}
.th-sort:focus-visible{outline:2px solid var(--qb-accent); outline-offset:3px;}
.sort-ind{color:var(--qb-accent);}
.tbl tbody tr{transition:background-color var(--qb-dur-1) var(--qb-ease-out),box-shadow var(--qb-dur-1) var(--qb-ease-out);}
.tr-click{cursor:pointer;}
/* Pointer hover and keyboard position are two different facts and must not look
   the same (round 3). Hover is the quiet canvas tint QuickBooks uses. The
   keyboard row is the one the Enter key will open, so it carries the accent
   tint plus a 3px inset marker - visible without colour, and it cannot be
   confused with the row the mouse happens to be resting over. */
.tbl tbody tr:hover,.tr-click:hover{background:var(--qb-canvas); box-shadow:none;}
.tbl tbody tr.tr-kb,.tbl tbody tr.tr-kb:hover{
  background:var(--qb-accent-tint);
  box-shadow:inset 3px 0 0 0 var(--qb-accent);
}
.tr-hi{background:var(--qb-canvas); box-shadow:none;}
.sec-row td{background:var(--qb-inset)!important; color:var(--qb-text-strong);
  font:600 12px/1.4 var(--qb-sans); letter-spacing:.06em; text-transform:uppercase;}
.sub-row td{border-top:1px solid var(--qb-border); background:var(--qb-inset); font-weight:600;}
.grand-row td{border-top:2px solid var(--qb-border); font-weight:700; font-size:15px; color:var(--qb-text-strong);}
.mini-table,.mini-list{font-size:13px; margin:8px 0;}
.mini-table td{padding:5px 8px; border-top:var(--qb-hair) solid var(--qb-divider); font-variant-numeric:tabular-nums;}
.mini-table td:nth-child(n+2){text-align:right;}
.mini-list{display:flex; flex-direction:column; gap:6px; color:var(--qb-text-muted);}
.grid-bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:42px;
  padding:5px 0; margin:0 0 6px; border-bottom:var(--qb-hair) solid var(--qb-divider);
}
.grid-search{width:min(320px,40vw); min-width:180px;}
.grid-pager{display:flex; align-items:center; gap:12px; justify-content:flex-end; flex-wrap:wrap; margin-top:10px;}
.bank-pagination{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; color:var(--qb-text-muted); font-size:12px;}
.tb-tot{display:flex; gap:22px; align-items:center; justify-content:flex-end; flex-wrap:wrap; padding:12px 14px; font-size:14px;}

/* ============================ 9. STATES ================================== */
/* One empty / loading / error language across all ten workspaces: a centered
   glyph in a light gray circle, a 16/600 headline, 14/400 muted body. The
   glyph is a self-authored inline SVG data URI - no third-party icon asset. */
.empty,.empty-state,.bank-queue-empty,.ap-aging-empty,.report-entity-required{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:40px 24px; background:var(--qb-surface);
  border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-card);
  color:var(--qb-text-muted); font-size:14px; line-height:1.5; text-align:center;
}
.empty::before,.empty-state::before,.bank-queue-empty::before,.ap-aging-empty::before{
  content:''; flex:0 0 auto; width:48px; height:48px; margin-bottom:4px;
  border-radius:var(--qb-r-pill); background:var(--qb-inset) no-repeat center/22px 22px;
  border:var(--qb-hair) solid var(--qb-divider);
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234C555B' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 4.5h9l5 5V19a.5.5 0 0 1-.5.5h-13A.5.5 0 0 1 5 19z'/%3E%3Cpath d='M14 4.5V10h5'/%3E%3Cpath d='M8.5 13.5h7M8.5 16.5h4.5'/%3E%3C/svg%3E");
}
.empty b,.empty-state b,.bank-queue-empty b,.ap-aging-empty b{
  color:var(--qb-text-strong); font:600 16px/1.4 var(--qb-sans);
}
.empty .link,.empty-state .link,.empty a,.empty-state a{color:var(--qb-link); font-weight:500;}
.report-entity-required::before{display:none;}
.empty-big{padding:64px 24px; text-align:center; color:var(--qb-text-muted); border:0; background:transparent; align-items:center;}
.err-box{
  display:flex; flex-direction:column; gap:4px; margin:12px 0; padding:11px 14px;
  background:var(--qb-bad-bg); border:1px solid var(--qb-bad-line);
  border-radius:var(--qb-r-card); color:var(--qb-bad); font-size:13px;
}
.report-entity-required{border-color:var(--qb-warn-line); background:var(--qb-warn-bg); color:var(--qb-warn);}
/* StateBlock is the only renderer of the four states. Its optional action row
   holds real navigation only - a state block never carries a dead control. */
.state-block-acts{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px;}
.state-error .state-block-acts{justify-content:flex-start;}
.state-loading{opacity:.9;}
.state-blocked{border-color:var(--qb-warn-line); background:var(--qb-warn-bg); color:var(--qb-warn);}
.state-blocked b{color:var(--qb-text-strong);}
/* ---- Cleared: an empty work queue is an outcome, not a blank page (round 3).
   Used only where the queue genuinely holds finite work that has been finished.
   It is a statement about the queue, never a claim that any period is closed,
   reconciled, approved or posted, and it carries no control. -------------- */
.state-cleared{border-color:var(--qb-ok-line); background:var(--qb-ok-bg); color:var(--qb-text);}
.state-cleared b{color:var(--qb-text-strong);}
.state-cleared::before{
  border-color:var(--qb-ok-line); background-color:var(--qb-surface);
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230F6B45' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 12.6l4.2 4.2L19 7'/%3E%3C/svg%3E");
}
/* ---- Skeletons (round 3). A skeleton block occupies exactly the geometry of
   the content it stands in for - same row height, same column widths, same
   header - so the layout does not jump when the read resolves. The sweep is
   opacity/position only and is removed entirely under prefers-reduced-motion. */
.skel,.skel-cell{
  border-radius:var(--qb-r-chip); background-color:var(--qb-skel);
  background-image:linear-gradient(90deg,var(--qb-skel) 0%,var(--qb-skel-hi) 50%,var(--qb-skel) 100%);
  background-size:220% 100%; background-repeat:no-repeat;
  animation:skelSweep 1.4s var(--qb-ease-out) infinite;
}
@keyframes skelSweep{from{background-position:120% 0;} to{background-position:-120% 0;}}
.skel-table{width:100%;}
.skel-table .skel-head{
  display:flex; gap:12px; align-items:center; height:40px; padding:8px 16px;
  border-bottom:1px solid var(--qb-border-alt);
}
.skel-table .skel-row{
  display:flex; gap:12px; align-items:center; height:44px; padding:9px 16px;
  border-top:1px solid var(--qb-border-alt);
}
.skel-table .skel-row:first-of-type{border-top:0;}
.skel-cell{flex:1 1 0; min-width:0; height:11px;}
.skel-head .skel-cell{height:9px; opacity:.85;}
.skel-cell.skel-num{flex:0 0 84px;}
.skel-cell.skel-wide{flex:2 1 0;}
/* A capability that can never execute here is a statement, not a control:
   a non-focusable chip carrying its own reason, never a <button>. */
.unavailable-chip{
  display:inline-flex; align-items:baseline; flex-wrap:wrap; gap:6px 8px;
  padding:6px 10px; border:var(--qb-hair) dashed var(--qb-border);
  border-radius:var(--qb-r-control); background:transparent;
  color:var(--qb-text-muted); font-size:12px; cursor:default;
}
.unavailable-name{font-weight:600; color:var(--qb-text-strong); font-size:12px;}
.unavailable-why{font-size:11px; color:var(--qb-text-muted);}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:60;
  padding:11px 20px; background:var(--qb-text-strong); color:#FFF;
  border-radius:var(--qb-r-control); box-shadow:var(--qb-shadow-strong); font-size:14px;
}
.toast-bad{background:var(--qb-bad);} .toast-warn{background:var(--qb-warn);}


/* ============================ 10. LAYOUT ================================= */
.split{display:grid; grid-template-columns:minmax(280px,340px) minmax(0,1fr); gap:16px; align-items:start;}
.split.two{grid-template-columns:repeat(2,minmax(0,1fr));}
.split-left{overflow:hidden;}
.split-head{padding:12px 14px; border-bottom:var(--qb-hair) solid var(--qb-divider); align-items:center;}
.split-right{padding:20px; min-height:360px; min-width:0;}
.two-col{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
.qbo-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:26px;}
.qbo-card{padding:24px; min-width:0; position:relative; overflow:hidden; background:var(--qb-surface)!important;}
.qbo-card::after{display:none;}
.qbo-card h4{margin:0 0 6px; color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.04em; text-transform:uppercase;}
.qbo-sub{margin-bottom:10px; color:var(--qb-text-muted); font-size:14px; line-height:1.5;}
.qbo-bars{display:flex; align-items:flex-end; gap:6px; height:64px; margin-top:8px;}
.qbo-bar{flex:1; min-height:4px; border-radius:3px 3px 0 0; background:var(--qb-brand);}
.qbo-bar.neg{background:var(--qb-bad);}
.donut{width:96px; height:96px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
.donut-wrap{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
.exp-compose{display:flex; flex-direction:column; gap:2px; min-width:0;}
.exp-bar{height:14px; margin:8px 0 12px;}
.pl-spark{width:100%;}
.acct-cell{display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-width:120px;}
.acct-cell-name{line-height:1.35; overflow-wrap:anywhere; white-space:normal;}
.legend{display:flex; flex-direction:column; gap:5px; font-size:12px; min-width:0;}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px;}
.bank-row,.balance-row{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:var(--qb-hair) solid var(--qb-divider); font-size:14px;}
.bank-row:last-child,.balance-row:last-child{border-bottom:0;}
.split-bar{display:flex; height:10px; border-radius:var(--qb-r-pill); overflow:hidden; margin:10px 0 6px;}
.todo-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px;}
.todo-card,.todo-item{display:flex; flex-direction:column; align-items:center; gap:10px; padding:24px 16px;
  background:var(--qb-surface); border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-card);}
.todo-n{display:grid; place-items:center; width:48px; height:48px; border-radius:var(--qb-r-pill);
  font:600 24px/1 var(--qb-sans); font-variant-numeric:tabular-nums;}
.todo-label,.todo-l{color:var(--qb-text-muted); font-size:13px; line-height:1.45; text-align:center;}
/* ---- Queue tiles: what is left, and what is already done (round 3) ----------
   `.todo-n` previously had no tone rules at all, so a queue with work left and
   a queue that was clear rendered as the same plain numeral. Now the count
   carries a tint AND the tile carries a meter of the work already completed,
   because "3 remaining" is discouraging where "3 remaining of 41" is progress.
   Every figure below is derived from records already on screen - no tile
   renders a meter it cannot compute. ----------------------------------------- */
.todo-n{background:var(--qb-inset); color:var(--qb-text-strong); border:1px solid var(--qb-border-soft);}
.todo-n.warn{background:var(--qb-warn-bg); color:var(--qb-warn); border-color:var(--qb-warn-line);}
.todo-n.ok{background:var(--qb-ok-bg); color:var(--qb-ok); border-color:var(--qb-ok-line);}
.todo-item.is-clear .todo-n{font-size:22px;}
.todo-meter{
  width:100%; height:6px; margin-top:2px; border-radius:var(--qb-r-pill);
  background:var(--qb-divider); overflow:hidden;
}
.todo-meter>span{
  display:block; height:100%; border-radius:inherit; background:var(--qb-ok);
  transition:width var(--qb-dur-2) var(--qb-ease-out);
}
.todo-done{
  color:var(--qb-text-muted); font-size:12px; line-height:1.4; text-align:center;
  font-variant-numeric:tabular-nums;
}
.todo-item.is-clear .todo-done{color:var(--qb-ok); font-weight:600;}
.appr-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:11px 16px; margin-bottom:8px; font-size:14px; min-width:0;}
.appr-row>span:first-child{min-width:0; overflow-wrap:anywhere;}
.appr-tl{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
.appr-step{display:flex; align-items:center; gap:10px; color:var(--qb-text-muted); font-size:14px; flex-wrap:wrap;}
.appr-step.appr-done{color:var(--qb-text);}
.appr-dot{width:10px; height:10px; border-radius:50%; background:var(--qb-border); flex:none;}
.appr-done .appr-dot{background:var(--qb-ok);}
.close-prog{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
.close-bar{flex:1 1 200px; height:8px; max-width:400px; background:var(--qb-divider); border-radius:var(--qb-r-pill); overflow:hidden;}
.close-fill{height:100%; background:var(--qb-ok);}
.pickup-sum{display:flex; gap:22px; margin:12px 0; font-size:14px; flex-wrap:wrap;}
.sod-list{color:var(--qb-text); font-size:14px; line-height:1.9;}
.integration-hub,.ar-workspace,.bill-payments-workspace,.ap-aging-shell,.authoritative-app,
.wbs-accounting-action-queue,.wbs-accounting-analysis-report,.wbs-e2e-flow-evidence,
.ai-review-outcome-trace,.ai-rent-roll-review,.qbo-transaction-report,.report-replacement-view,
.expense-shell-panel,.exc-detail,.source-doc-shell{min-width:0;}
.ai-report-note{margin:10px 0; color:var(--qb-text-muted); font-size:12px;}
.evidence-id-list{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; padding:0; list-style:none;
  color:var(--qb-text-muted); font-size:12px; font-variant-numeric:tabular-nums;}

/* ============================ 11. OVERLAYS =============================== */
.drawer-scrim,.pal-scrim,.newmenu-scrim{position:fixed; inset:0; background:rgba(33,38,42,.32);}
.drawer-scrim{display:flex; justify-content:flex-end; z-index:40;}
.drawer{
  display:flex; flex-direction:column; height:100%; max-width:100vw;
  background:var(--qb-surface); border-left:var(--qb-hair) solid var(--qb-divider);
  border-radius:0; box-shadow:var(--qb-shadow-strong); animation:slideIn var(--qb-dur-2) var(--qb-ease-out);
}
@keyframes slideIn{from{transform:translateX(24px); opacity:.6;} to{transform:none; opacity:1;}}
.drawer-head{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px; border-bottom:var(--qb-hair) solid var(--qb-divider);}
.drawer-body{flex:1; padding:20px; overflow:auto;}
.drawer-foot{display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;
  padding:14px 20px; border-top:var(--qb-hair) solid var(--qb-divider);}
.x{border:0; background:transparent; color:var(--qb-text-muted); font-size:22px; cursor:pointer; line-height:1;}
.pal-scrim{display:flex; justify-content:center; align-items:flex-start; padding:14vh 16px 0; z-index:70;}
.pal{width:480px; max-width:100%; background:var(--qb-surface); border:var(--qb-hair) solid var(--qb-divider);
  border-radius:var(--qb-r-panel); box-shadow:var(--qb-shadow-strong); overflow:hidden;}
.pal input{width:100%; border:0; border-bottom:var(--qb-hair) solid var(--qb-divider); border-radius:0;
  background:transparent; padding:16px 18px; font-size:15px;}
.pal-list{max-height:340px; overflow:auto;}
.pal-list button{display:flex; justify-content:space-between; gap:12px; width:100%; border:0;
  background:transparent; color:var(--qb-text); text-align:left; padding:10px 18px; cursor:pointer; font-size:14px;}
.pal-list button:hover{background:var(--qb-canvas);}
.newmenu-scrim{z-index:60;}
.newmenu{
  position:absolute; left:calc(var(--nav-w) + 8px); top:64px; z-index:61;
  display:flex; gap:32px; flex-wrap:wrap; max-width:calc(100vw - 32px);
  padding:18px 22px; background:var(--qb-surface);
  border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-panel); box-shadow:var(--qb-shadow-strong);
}
.newmenu h5{margin:0 0 8px; color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.07em; text-transform:uppercase;}
.newmenu button{display:block; width:100%; border:0; background:none; color:var(--qb-link);
  font:500 14px/1.6 var(--qb-sans); padding:4px 0; text-align:left; cursor:pointer;}
.newmenu button:hover{text-decoration:underline;}

/* ============================ 12. LOGIN ================================== */
.login-wrap,.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--qb-canvas);}
.login-card{display:flex; flex-direction:column; gap:12px; width:420px; max-width:100%; padding:32px 34px;}
.login-logo{color:var(--qb-accent); font:600 28px/1.2 var(--qb-sans);}
.login-sub{margin-bottom:6px; color:var(--qb-text-muted); font-size:14px;}
.login-label{color:var(--qb-text-muted); font-size:12px;}
.login-btn{margin-top:6px; width:100%;}
.login-note{color:var(--qb-text-muted); font-size:12px; line-height:1.6;}

/* ============================ 13. JOURNAL ENTRY ========================== */
.je-list{max-height:64vh; overflow:auto;}
.je-item{padding:11px 14px; border-top:var(--qb-hair) solid var(--qb-divider); cursor:pointer;}
.je-item:hover{background:var(--qb-canvas);}
.je-item-on{background:var(--qb-accent-tint); box-shadow:inset 3px 0 0 var(--qb-accent);}
.je-item-top{display:flex; justify-content:space-between; gap:8px; font-size:13px; font-weight:600;}
.je-item-desc{margin:3px 0; color:var(--qb-text-muted); font-size:12px;}
.je-item-amt{font-size:12px; font-variant-numeric:tabular-nums;}
.je-head,.qbe-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:10px; flex-wrap:wrap;}
.je-num,.qbe-title{color:var(--qb-text-strong); font:600 20px/1.3 var(--qb-sans); letter-spacing:-.01em;}
.je-meta,.qbe-meta{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:14px; color:var(--qb-text-muted); font-size:13px;}
.je-lines input,.je-lines select,.qbe-grid select,.qbe-grid input{
  width:100%; min-height:32px; padding:0 8px; border:1px solid var(--qb-border);
  border-radius:var(--qb-r-control); background:var(--qb-surface); color:var(--qb-text); font-size:13px;
}
.je-lines tfoot td{border-top:1px solid var(--qb-border); padding-top:10px; font-weight:600;}
.je-actions,.qbe-actionbar,.qbe-action-context{display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap; min-width:0;}
.qbe-below{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:10px 0;}
.qbe-totals{display:flex; gap:20px; align-items:center; flex-wrap:wrap; font-size:14px; font-variant-numeric:tabular-nums;}
.qbe-totals .bal-bad{color:var(--qb-bad); font-weight:700;} .qbe-totals .bal-ok{color:var(--qb-ok); font-weight:700;}
.qbe-memo{margin:12px 0 6px;}
.qbe-memo label{display:block; margin-bottom:4px; color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.05em; text-transform:uppercase;}
.qbe-footbar{
  position:sticky; bottom:0; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  margin-top:14px; padding-top:14px; border-top:var(--qb-hair) solid var(--qb-divider); background:var(--qb-surface);
}
.qbe-document{padding:0 20px 18px; overflow:hidden;}
.qbe-document .qbe-head{margin:0 -20px 14px; padding:18px 20px 14px; border-bottom:var(--qb-hair) solid var(--qb-divider); background:var(--qb-inset);}
.qbe-document .je-lines{border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-control); overflow:hidden;}
.qbe-document .je-lines th{background:var(--qb-inset)!important;}
.qbe-document .je-lines td{height:44px;}
.qbe-document .qbe-below{margin:0; padding:11px 12px; border:var(--qb-hair) solid var(--qb-divider); border-top:0; background:var(--qb-inset);}
.qbe-document .qbe-memo{margin-top:16px; padding:12px 14px; border-left:3px solid var(--qb-accent); background:var(--qb-inset);}
.qbe-document .qbe-footbar{margin:18px -20px -18px; padding:13px 20px; background:var(--qb-inset); border-top:var(--qb-hair) solid var(--qb-divider);}
/* Journal entry queue: fixed widths, table-local scroll, wrapping description. */
.table-journal-entries{overflow-x:auto; scrollbar-gutter:stable;}
.table-journal-entries .tbl{min-width:1120px; table-layout:fixed;}
.table-journal-entries th,.table-journal-entries td{overflow:hidden;}
.table-journal-entries th:nth-child(1),.table-journal-entries td:nth-child(1),
.table-journal-entries th:nth-child(2),.table-journal-entries td:nth-child(2),
.table-journal-entries th:nth-child(4),.table-journal-entries td:nth-child(4),
.table-journal-entries th:nth-child(6),.table-journal-entries td:nth-child(6),
.table-journal-entries th:nth-child(7),.table-journal-entries td:nth-child(7){white-space:nowrap; word-break:keep-all; text-overflow:ellipsis;}
.table-journal-entries td:nth-child(3),.table-journal-entries td:nth-child(5){display:table-cell; white-space:normal; word-break:normal; overflow-wrap:break-word; line-height:1.35;}

/* ============================ 14. STATEMENTS / GL ======================== */
.stmt{padding:8px 20px; max-width:560px;}
.stmt-wide{max-width:960px; padding:24px 30px;}
.stmt-h{margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--qb-border);
  color:var(--qb-text-strong); font:600 18px/1.3 var(--qb-sans);}
.stmt-sec{margin:16px 0 6px; padding-bottom:5px; border-bottom:1px solid var(--qb-border-alt);
  color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.07em; text-transform:uppercase;}
.stmt-row{display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:var(--qb-hair) solid var(--qb-divider); min-width:0;}
.stmt-row>span{min-width:0; overflow-wrap:anywhere;}
.stmt-row.tot{font-weight:600; border-bottom:0;}
.stmt-row:hover{background:var(--qb-canvas);}
.stmt-drill-row{cursor:default;}
.report-drill{
  display:inline-flex; align-items:center; justify-content:flex-end; gap:7px; min-width:110px;
  padding:2px 4px; border:0; border-bottom:1px solid transparent; background:transparent;
  color:var(--qb-link); font:inherit; cursor:pointer;
}
.report-drill .num{color:var(--qb-link); font-weight:500;}
.report-drill>span:last-child,.rep-arrow,.drill-caret{opacity:.6; font-size:16px; line-height:1;}
.report-drill:hover{border-bottom-color:var(--qb-link); background:var(--qb-canvas);}
.report-drill:hover>span:last-child{opacity:1;}
.report-drill.total .num{font-weight:700;}
.report-drill-hint,.drill-target{color:var(--qb-text-muted); font-size:12px;}
/* A source label can open its retained evidence.  It must still look like the
   same quiet status pill as a non-drillable source: the browser button border
   was creating the square right/bottom edge visible in the GL table. */
.source-drill{display:inline-flex; align-items:center; max-width:100%; padding:0; border:0;
  outline:0; background:transparent; box-shadow:none; color:inherit; font:inherit; line-height:inherit; cursor:pointer;}
.source-drill:hover .badge,.source-drill:focus-visible .badge{filter:brightness(.96);}
.report-drill-panel{margin-top:18px; padding:16px 18px; border-left:3px solid var(--qb-accent);}
.report-drill-panel .sec-title{margin-top:0;}
.report-drill-panel .tr-click{cursor:pointer;}
.report-drill-panel .tr-click td:first-child{color:var(--qb-link); font-weight:500;}
/* Trial Balance has four accounting columns, not a Journal Entries wide-table
   schema.  It fills the report canvas at desktop size and only scrolls when a
   genuinely narrow viewport cannot keep the Account/Debit/Credit/Balance set legible. */
.trial-balance-table .tbl{min-width:640px; width:100%; table-layout:fixed;}
.reports-workbench-table .tbl{min-width:760px;}
.trial-balance-table,.reports-workbench-table{overflow-x:auto;}
/* A table rendered without an explicit wrapper still scrolls inside its own
   region rather than pushing the page sideways. */
.je-lines-scroll,section:has(>table.tbl){overflow-x:auto; max-width:100%; scrollbar-gutter:stable;}
.je-lines-scroll:focus-visible,section:has(>table.tbl):focus-visible{outline:2px solid var(--qb-accent); outline-offset:2px;}
.je-lines-scroll .tbl{min-width:900px;}

/* ============================ 15. EVIDENCE TRACE ========================= */
.trace-panel{margin:0 0 14px; padding:16px 18px; border-left:3px solid var(--qb-accent);}
.trace-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px;}
.trace-chain,.src-chain,.source-doc-trace{display:flex; align-items:center; flex-wrap:wrap; gap:7px;
  margin:10px 0; color:var(--qb-text-muted); font-size:12px;}
.trace-chain i,.src-chain i{color:var(--qb-text-faint); font-style:normal;}
.trace-chain strong{color:var(--qb-accent);}
.trace-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;
  padding:10px 0; border-top:var(--qb-hair) solid var(--qb-divider);}
.trace-grid span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;}
.trace-grid i{display:block; margin-bottom:2px; color:var(--qb-text-muted);
  font:600 11px/1.3 var(--qb-sans); font-style:normal; letter-spacing:.06em; text-transform:uppercase;}
.trace-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.src-card{padding:14px 18px; margin:12px 0;}
.source-doc-shell,.source-doc-panel{padding:16px 18px; margin:12px 0;}
.source-doc-hero{align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:12px;}
.source-doc-meta{color:var(--qb-text-muted); font-size:12px;}
.bank-source,.exc-detail{color:var(--qb-text-muted); font-size:13px;}

/* ============================ 16. RECONCILIATION ========================= */
.recon-model{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(200px,240px); gap:16px; margin-bottom:20px; align-items:start;}
.recon-col{padding:16px 18px; min-width:0;}
.recon-title{margin-bottom:10px;}
.recon-diff{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:20px; border-radius:var(--qb-r-card); font-size:14px; text-align:center;}
.recon-diff.ok{background:var(--qb-ok-bg); border:1px solid var(--qb-ok-line); color:var(--qb-ok);}
.recon-diff.bad{background:var(--qb-bad-bg); border:1px solid var(--qb-bad-line); color:var(--qb-bad);}
.recon-diff-n{font:600 24px/1.2 var(--qb-sans); font-variant-numeric:tabular-nums;}

/* ============================ 17. BANK WORKSPACE ========================= */
.bank-workbench{max-width:var(--content-max); min-width:0;}
.bank-health{display:grid; grid-template-columns:30px minmax(0,1fr) auto; align-items:center; gap:12px;
  margin:4px 0 14px; padding:11px 14px; background:var(--qb-warn-bg);
  border:1px solid var(--qb-warn-line); border-radius:var(--qb-r-card); color:var(--qb-text-strong);}
.bank-health p{margin:2px 0 0; color:var(--qb-text-muted); font-size:12px;}
.bank-health-icon{display:grid; place-items:center; width:24px; height:24px; border-radius:50%;
  background:var(--qb-warn); color:#FFF; font-weight:700;}
.bank-account-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; margin-bottom:14px; overflow:visible;}
.acct-cards{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.acct-card,.bank-account-card{
  appearance:none; text-align:left; color:inherit; font:inherit;
  padding:14px; min-width:0; cursor:pointer; border-radius:var(--qb-r-card);
}
.acct-card{min-width:280px;}
.acct-card.acct-on,.bank-account-card.acct-on{border:2px solid var(--qb-accent); box-shadow:none;}
.acct-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:2px; min-width:0;}
.bank-account-card .acct-head span{display:flex; flex-direction:column; gap:3px; min-width:0;}
.acct-card small,.bank-account-card small{color:var(--qb-text-muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.acct-bal{display:flex; gap:18px; margin-top:12px; flex-wrap:wrap;}
.acct-bal span{display:flex; flex-direction:column; font-size:14px; font-variant-numeric:tabular-nums;}
.acct-bal i{color:var(--qb-text-muted); font:500 11px/1.3 var(--qb-sans); font-style:normal; letter-spacing:.05em; text-transform:uppercase;}
.acct-review{margin-top:10px; padding-top:9px; border-top:var(--qb-hair) solid var(--qb-divider); color:var(--qb-accent); font-size:12px; font-weight:500;}
.bank-queue-card{overflow:hidden;}
.bank-toolbar{margin:0; padding:12px 14px; background:var(--qb-inset); border:0; border-bottom:var(--qb-hair) solid var(--qb-divider); border-radius:0;}
.bank-toolbar select{padding:0 28px 0 10px;}
.bank-search{min-width:260px;}
.bank-account-summary{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; min-width:0;}
.bank-table{overflow-x:auto;}
.bank-table .table-wrap{margin:0; border:0; border-radius:0; box-shadow:none; min-width:880px;}
.bank-table .tbl{width:100%;min-width:880px;table-layout:fixed}
.bank-table .tbl th:nth-child(1){width:104px}
.bank-table .tbl th:nth-child(2){width:21%}
.bank-table .tbl th:nth-child(3){width:124px}
.bank-table .tbl th:nth-child(4){width:27%}
.bank-table .tbl th:nth-child(5){width:190px}
.bank-table .tbl th:nth-child(6){width:112px}
.bank-table .tbl td{vertical-align:top; overflow-wrap:anywhere;}
.bank-row-primary,.bank-amount,.bank-evidence-stack,.bank-status-stack{
  display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0;
}
.bank-row-primary b,.bank-evidence-stack b{font-size:14px; font-weight:600; line-height:1.35; color:var(--qb-text-strong);}
.bank-row-primary span,.bank-evidence-stack span,.bank-amount span,.bank-status-stack span{color:var(--qb-text-muted); font-size:12px; line-height:1.35;}
.bank-row-primary small,.bank-evidence-stack small,.bank-status-stack small{color:var(--qb-text-muted); font-size:11px; line-height:1.35;}
.bank-amount{align-items:flex-end; white-space:nowrap;}
.bank-amount .num{font-size:14px; font-weight:600; color:var(--qb-text-strong);}
.bank-status-stack .badge{max-width:100%; white-space:normal; text-align:left; line-height:1.3;}
.bank-desc,.bank-suggestion{display:flex; flex-direction:column; gap:3px; min-width:0;}
.bank-desc b,.bank-suggestion b{font-size:14px; font-weight:500;}
.bank-desc span,.bank-suggestion span{color:var(--qb-text-muted); font-size:11px;}
.bank-suggestion i{font-style:normal; font-weight:600;}
.confidence-good{color:var(--qb-ok);} .confidence-low{color:var(--qb-warn);}
.bank-party{white-space:nowrap;}
.bank-footer{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:10px 14px; border-top:var(--qb-hair) solid var(--qb-divider); color:var(--qb-text-muted); font-size:12px;}
.bank-footer button{border:0; background:transparent; color:var(--qb-link); font-weight:500; cursor:pointer; margin-left:14px;}
.bank-footer button:hover{text-decoration:underline;}
.bank-queue-empty{margin:16px; border-style:dashed;}

/* ============================ 18. REPORTS ================================ */
.reports-library{min-width:0;}
.reports-library .kpi-row{gap:10px; margin-bottom:24px;}
.reports-library .kpi{min-height:98px; padding:15px 17px;}
.reports-library .sec-title{padding-bottom:8px; border-bottom:var(--qb-hair) solid var(--qb-divider);}
.report-period-chip{display:flex; flex-direction:column; gap:3px; min-width:190px; padding:10px 13px;}
.report-period-chip span{color:var(--qb-text-muted); font:600 11px/1.3 var(--qb-sans); letter-spacing:.07em; text-transform:uppercase;}
.report-period-chip b{color:var(--qb-text-strong); font-size:14px;}
.report-period-chip small{color:var(--qb-text-muted); font-size:12px;}
.authoritative-report-finder{display:grid; gap:12px;}
.authoritative-report-finder label{display:grid; gap:6px; max-width:520px; color:var(--qb-text-strong); font-weight:600;}
.authoritative-report-finder input{width:100%;}
.authoritative-report-shortcuts{display:grid; grid-template-columns:minmax(180px,.72fr) minmax(0,2.28fr); gap:14px; align-items:start; margin:0 0 14px; padding:14px; border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-card); background:var(--qb-inset);}
.authoritative-report-shortcuts p{margin:5px 0 0;}
.authoritative-report-shortcut-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
.authoritative-report-shortcut{display:grid; gap:3px; min-height:60px; padding:10px 12px; text-align:left; color:var(--qb-text-strong); background:var(--qb-surface); border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-control); cursor:pointer;}
.authoritative-report-shortcut:hover{border-color:var(--qb-accent); background:var(--qb-canvas);}
.authoritative-report-shortcut.is-current{border:2px solid var(--qb-accent); background:var(--qb-accent-tint); padding:9px 11px;}
.authoritative-report-shortcut span{font-weight:600; line-height:1.3;}
.authoritative-report-shortcut small{color:var(--qb-text-muted); font-size:11px; line-height:1.35;}
.authoritative-report-shortcut:focus-visible{outline:2px solid var(--qb-accent); outline-offset:2px;}
.authoritative-property-report-directory{margin-top:14px;}
.rep-grid,.rep-grid-featured{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px;}
.rep-card{display:flex; align-items:center; justify-content:space-between; gap:10px;
  min-width:0; min-height:66px; padding:12px 14px; border-radius:var(--qb-r-card);
  background:var(--qb-surface); border:var(--qb-hair) solid var(--qb-divider); cursor:pointer;}
.rep-main{display:flex; flex-direction:column; gap:3px; min-width:0;}
.rep-name,.rep-table-name{min-width:0; max-width:100%; color:var(--qb-text-strong); font:500 14px/1.4 var(--qb-sans);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rep-desc{color:var(--qb-text-muted); font-size:12px; overflow-wrap:anywhere;}
.rep-tag{display:flex; align-items:center; gap:5px; flex:0 0 auto; min-width:0;}
.rep-tag .badge{max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rep-card:hover{background:var(--qb-canvas); border-color:var(--qb-border);}
.rep-card.rep-on{background:var(--qb-accent-tint); border:2px solid var(--qb-accent);}
.report-workbench{margin:14px 0; padding:16px;}
.authoritative-cwip-table .tbl{min-width:900px; table-layout:fixed;}
.authoritative-property-table .tbl{min-width:900px; table-layout:fixed;}
.authoritative-cwip-table th:nth-child(n+2):nth-child(-n+5){width:12%;}
.authoritative-cwip-table th:nth-child(6){width:22%;}
.authoritative-cwip-detail .qbo-toolgrid{margin:16px 0;}
.authoritative-cwip-mapping{margin:16px 0;}
/* QuickBooks Online shows the report figures first and keeps supporting
   material out of the reading path. On GL these three control-evidence panels
   sat between the tabs and the statement and pushed the first data row to
   y=1774 in a 679px viewport - about 2.6 screens of scrolling before a single
   number. They are collapsed by default: nothing is removed, and one click
   still opens the full retained evidence. */
.gl-evidence-fold{margin:10px 0 14px; border:var(--qb-hair) solid var(--qb-divider);
  border-radius:var(--qb-r-card); background:var(--qb-surface);}
.gl-evidence-fold>summary{cursor:pointer; list-style:none; padding:10px 14px;
  font:500 13px/1.4 var(--qb-sans); color:var(--qb-text-strong);
  display:flex; align-items:center; gap:8px;}
.gl-evidence-fold>summary::-webkit-details-marker{display:none;}
.gl-evidence-fold>summary::before{content:"\25B8"; color:var(--qb-text-muted); transition:transform .16s ease;}
.gl-evidence-fold[open]>summary::before{transform:rotate(90deg);}
.gl-evidence-fold>summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.gl-evidence-fold>.report-workbench{margin:0 12px 12px; border:0;}
@media(prefers-reduced-motion:reduce){.gl-evidence-fold>summary::before{transition:none;}}
.report-workbench-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:12px; min-width:0;}
.report-preview-meta{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; justify-content:flex-end; min-width:0;}
.report-preview-meta span{display:flex; align-items:baseline; gap:5px; padding:6px 10px;
  border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-control); background:var(--qb-inset); white-space:nowrap;}
.report-preview-meta i{font-style:normal; font-size:12px; color:var(--qb-text-muted);}
.report-preview-meta b{font-size:14px; font-variant-numeric:tabular-nums;}
.report-preview-head{margin-bottom:12px; flex-wrap:wrap; gap:12px;}
.report-preview-titlewrap{min-width:0; flex:1 1 320px;}
.report-preview-crumb{color:var(--qb-text-muted); font-size:12px; margin-bottom:4px;}
.report-open-link{color:var(--qb-link); font-weight:500;}
.report-shelf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;}
.report-shelf-spacer{flex:1 1 20px;}
.report-shelf-note{color:var(--qb-text-muted); font-size:12px;}
.qbo-report-centerbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;}
.qbo-report-search{display:flex; align-items:center; min-width:220px; flex:1 1 260px;}
.qbo-report-search input{width:100%;}
.qbo-report-centerbar>button{min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong); font:500 14px/1 var(--qb-sans); cursor:pointer;}
.qbo-report-centerbar>button:hover{border-color:var(--qb-accent);}
.qbo-report-promo{display:flex;flex-direction:column;gap:7px;padding:16px;margin:12px 0;}
.qbo-report-promo>span{color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.06em;}
.qbo-report-promo>p{margin:0; color:var(--qb-text-muted);}
.report-summary-link{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0;border:0;background:transparent;color:var(--qb-link);font:600 14px/1 var(--qb-sans);cursor:pointer;}
.report-summary-link:hover{text-decoration:underline;color:var(--qb-link);}
.report-summary-link:focus-visible{outline:2px solid var(--qb-accent);outline-offset:3px;border-radius:3px;}
.qbo-report-promo .qbo-toolgrid{margin:0;}
.qbo-report-builder{display:flex; flex-direction:column; gap:12px; margin-bottom:14px; min-width:0;}
.qbo-report-controls{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; padding:12px 14px; align-items:end;}
/* The read-only capability note is one long sentence. Left in a 160px grid
   cell it wrapped to ~200px tall, inflated its whole row, and every sibling
   - pinned by align-items:end - sank to the bottom of that row, leaving a
   large empty band above the controls and pushing the report two screens
   down. It now takes its own full-width row on a single line. */
/* Measured in a live QuickBooks Online Profit and Loss (1440x679): the scope
   row is ONE row 56px tall with 12px/400 labels, and the actions sit outside
   it. REFS previously put seven selects, a segmented control, three buttons
   and the capability note in one auto-fit grid, which stacked to 187px. The
   scope selects keep the grid; the actions take their own row underneath. */
.qbo-report-actions{grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center;
  gap:8px; min-width:0; padding-top:2px;}
.qbo-report-actions>button{flex:0 0 auto; min-width:0;}
.qbo-report-actions>.qbo-segment{flex:0 0 auto; width:auto;}
.qbo-report-actions>.unavailable-chip{flex:1 1 260px; min-width:0; align-items:center;
  padding:5px 10px; gap:4px 8px;}
.qbo-report-controls>label{font-weight:400;}
/* QBO states report identity inside the report surface, centred: report name
   20px/500, period 14px/500, then the basis line. Measured on a live P&L. */
.qbo-report-title{text-align:center; margin:14px 0 12px; min-width:0;}
.qbo-report-title-main{font:500 20px/1.3 var(--qb-sans); color:var(--qb-text-strong);}
.qbo-report-title-period{font:500 14px/1.4 var(--qb-sans); color:var(--qb-text); margin-top:2px;}
.qbo-report-title-basis{font:400 12px/1.5 var(--qb-sans); color:var(--qb-text-muted); margin-top:4px;}
.qbo-report-controls>.unavailable-chip .unavailable-why{flex:1 1 auto; min-width:0;}
.qbo-report-controls>label{display:flex; flex-direction:column; gap:5px; min-width:0;
  color:var(--qb-text-muted); font:500 12px/1.3 var(--qb-sans);}
.qbo-report-controls select,.qbo-report-controls>button,.qbo-report-controls .qbo-segment{width:100%; min-width:0; min-height:var(--qb-control-h);}
.qbo-report-controls>button{align-self:end; padding:0 10px; border:1px solid var(--qb-border);
  border-radius:var(--qb-r-control); background:var(--qb-surface); color:var(--qb-text-strong);
  font:500 14px/1.2 var(--qb-sans); white-space:normal; cursor:pointer;}
.qbo-report-controls .qbo-segment{display:inline-flex; align-self:end;}
.qbo-report-controls .qbo-segment button{flex:1 1 0; min-width:0; padding:0 6px; white-space:normal; font-size:14px;}
.qbo-report-toolpanel{padding:14px;}
.qbo-report-toolpanel>div:first-child{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.qbo-report-toolpanel>div:first-child span{color:var(--qb-text-muted); font-size:13px;}

/* ============================ 19. DASHBOARD ==============================
   Home rhythm, docs/QB-SHELL-STRUCTURE.md section 2:
   greeting -> feature chips -> create actions -> section heading -> cards. */
/* 19.1 greeting row: the title is centered in the content column, secondary
   workspace links sit right. The left cell is an equal-width spacer so the
   greeting is centered against the page, not against the remaining space. */
.qbo-home-hero{
  display:grid; align-items:start; gap:16px; margin:2px 0 26px; padding:0;
  grid-template-columns:minmax(0,1fr) auto;
  background:transparent; border:0; border-radius:0;
}
.qb-greet-spacer{display:none;}
.qb-greet{min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:6px;}
.qbo-home-hero p,.qb-greet-sub{
  margin:0; max-width:70ch; color:var(--qb-text-muted);
  font-size:14px; line-height:1.5; text-align:left;
}
/* Secondary workspace links: quiet by design so the greeting stays dominant. */
.qbo-home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;align-content:start;min-width:0;justify-self:end;}
.qbo-home-actions .btn{width:100%;justify-content:center;min-height:32px;padding:0 8px;
  border:0;background:transparent;color:var(--qb-link);font:500 13px/1.2 var(--qb-sans);}
.qbo-home-actions .btn:hover{background:var(--qb-canvas);border:0;color:var(--qb-link);}
.qbo-home-actions .btn:last-child{grid-column:1/-1;}
/* 19.2 feature chips: 48px pills with a dark circular icon badge.
   They wrap rather than scroll behind chevrons - see docs round-2 notes. */
.qbo-quicklinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 26px;min-width:0;}
/* The five feature chips only spanned the left ~70% of the canvas, leaving a
   large empty band to their right on wide screens. They now grow to share the
   row, so the strip reads as one deliberate band instead of trailing space.
   The flex declaration above is asserted by verify-dashboard-quicklinks-layout. */
.qbo-quicklinks button{flex:1 1 auto; justify-content:flex-start;}
.qbo-quicklinks button{appearance:none;display:inline-flex;align-items:center;gap:12px;
  min-height:var(--qb-chip-h);height:var(--qb-chip-h);padding:8px 18px 8px 8px;
  border:var(--qb-hair) solid var(--qb-chip-border);
  border-radius:var(--qb-r-pill);background:var(--qb-surface);color:var(--qb-text-strong);
  font:600 14px/1.2 var(--qb-sans);cursor:pointer;white-space:nowrap;
  transition:border-color var(--qb-dur-1) var(--qb-ease-out),background-color var(--qb-dur-1) var(--qb-ease-out);}
.qbo-quicklinks button:hover{border-color:var(--qb-chip-border);background:var(--qb-canvas);}
.qbo-quicklinks button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.qbo-quicklinks i{display:grid;place-items:center;flex:0 0 auto;width:32px;height:32px;
  border-radius:var(--qb-r-pill);background:var(--qb-badge-ink);color:var(--qb-badge-glyph);
  font-style:normal;font-size:15px;line-height:1;}
.qbo-quicklinks i svg{display:block;width:18px;height:18px;}
/* 19.3 create actions: a row of outlined pills, nothing filled. */
.qb-actionhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px;}
.qb-actionrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 28px;min-width:0;}
.qb-actionrow .btn{min-height:var(--qb-pill-h);padding:0 20px;
  border:var(--qb-hair) solid var(--qb-chip-border);border-radius:var(--qb-r-pill);
  background:var(--qb-surface);color:var(--qb-text);font:600 14px/1 var(--qb-sans);}
.qb-actionrow .btn:hover{background:var(--qb-canvas);border-color:var(--qb-chip-border);color:var(--qb-text-strong);}
.qb-home-section{margin:0 0 10px;}

/* ============================ 20. EXPENSES =============================== */
.expense-toolbar{gap:10px;}
.expense-toolbar label{flex:0 1 auto; min-width:0;}
.expense-toolbar label>span{color:var(--qb-text-muted); font-size:12px; white-space:nowrap;}
.expense-shell-panel{margin:0 0 12px; padding:14px 16px;}
.expense-shell-panel>div:first-child{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
.expense-shell-panel>div:first-child b{color:var(--qb-text-strong); font-size:14px;}
.expense-shell-panel>div:first-child span{color:var(--qb-text-muted); font-size:13px;}
.expense-filter-evidence{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin-bottom:12px;}
.expense-filter-evidence label{display:flex; align-items:center; gap:8px; min-width:0; color:var(--qb-text-muted); font-size:13px;}
.expense-filter-evidence input[type=date],.expense-filter-evidence select{flex:1 1 auto; min-width:0;}
.expense-shell-actions{display:flex; gap:8px; flex-wrap:wrap;}
.expense-shell-actions>button{min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong); font:500 14px/1 var(--qb-sans); cursor:pointer;}
.expense-shell-actions>button:hover{border-color:var(--qb-accent);}
.ap-aging-head{align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:12px;}
.ap-aging-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; padding:0; border:0; background:transparent;}


/* ===========================================================================
   21. RESPONSIVE - one consolidated ladder: 1440 / 1280 / 1024 / 768 / 430 / 360
   Rule: the page never scrolls sideways. Wide tables scroll inside their own
   container; toolbars reflow into grids; nothing is clipped or unreachable.
   ========================================================================== */
.content>*{min-width:0; max-width:100%;}
@media(min-width:1800px){:root{--content-max:1680px;}}
@media(max-width:1440px){
  .content{padding:24px 28px 56px;}
  .top-right>.muted{display:none;}
  .topbar>.sw:first-of-type{flex-basis:220px; min-width:160px; max-width:280px;}
  .cmdk{flex-basis:160px; min-width:140px; max-width:160px;}
  .demo-label-full{display:none;}
  .demo-label-short{display:inline;}
  .user-chip{flex:0 0 154px; min-width:154px;}
  .user-nm{max-width:52px;}
  .user-name-full{display:none;}
  .user-name-short{display:inline;}
  .user-nm .muted{display:none;}
}
@media(max-width:1280px){
  :root{--qb-navpanel-w:210px; --qb-greet-side:200px;}
  .content{padding:22px 24px 52px;}
  /* A two-level navigation is useful on a full desktop, but it must never
     consume the report canvas in a narrow split window.  Use the existing
     accessible drawer contract before cards begin competing for space. */
  .sidebar{position:fixed; top:0; left:0; z-index:32; transform:translateX(-100%);
    width:min(88vw,320px); flex-basis:min(88vw,320px);
    transition:transform var(--qb-dur-2) var(--qb-ease-out); box-shadow:var(--qb-shadow-strong);}
  .sidebar.mobile-open{transform:translateX(0);}
  .main{margin:6px;}
  .mobile-nav-close{display:inline-flex; align-items:center; justify-content:center; align-self:flex-end;
    margin:10px 12px 0; min-height:var(--qb-control-h-sm); padding:0 12px;
    border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
    background:var(--qb-surface); color:var(--qb-text-strong); font:500 13px/1 var(--qb-sans); cursor:pointer;}
  .mobile-nav-btn{display:inline-grid; place-items:center; flex:0 0 auto;
    width:var(--qb-control-h); height:var(--qb-control-h);
    border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
    background:var(--qb-surface); color:var(--qb-text-strong); font-size:17px; cursor:pointer;}
  .cmdk{display:none;}
  .topbar>.sw:first-of-type{flex:1 1 auto; max-width:none;}
  .top-right{gap:8px;}
  .top-right .icon-btn:nth-of-type(1),.top-right .icon-btn:nth-of-type(2){display:none;}
  .demo-label-full{display:none;}
  .demo-label-short{display:inline;}
  .user-chip{flex:0 1 154px; max-width:154px; min-width:120px; overflow:hidden;}
  .user-nm{min-width:0; max-width:108px; overflow:hidden; text-overflow:ellipsis;}
  .user-nm .muted{display:none;}
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));}
  .qbo-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .todo-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .recon-model{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .recon-diff{grid-column:1/-1;}
  .split{grid-template-columns:minmax(240px,300px) minmax(0,1fr);}
  .bank-toolbar{flex-wrap:wrap;}
  .bank-search{flex:1 1 300px;}
  .bank-result-count{flex:1 1 100%; margin-left:0;}
  .bank-account-summary{align-items:flex-start;}
  .bank-summary-metrics{flex-wrap:wrap;}
  .bank-footer{align-items:flex-start; flex-direction:column;}
  .bank-table .table-wrap,.bank-table .tbl{min-width:820px}
  .table-journal-entries .tbl{min-width:1020px;}
}
@media(max-width:1024px){
  /* Tablet: the rail goes off-canvas and gains a reachable open/close pair. */
  .sidebar{position:fixed; top:0; left:0; z-index:32; transform:translateX(-100%);
    width:min(88vw,320px); flex-basis:min(88vw,320px);
    transition:transform var(--qb-dur-2) var(--qb-ease-out); box-shadow:var(--qb-shadow-strong);}
  .sidebar.mobile-open{transform:translateX(0);}
  .main{margin:6px;}
  .mobile-nav-close{
    display:inline-flex; align-items:center; justify-content:center; align-self:flex-end;
    margin:10px 12px 0; min-height:var(--qb-control-h-sm); padding:0 12px;
    border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
    background:var(--qb-surface); color:var(--qb-text-strong); font:500 13px/1 var(--qb-sans); cursor:pointer;
  }
  .mobile-nav-btn{
    display:inline-grid; place-items:center; flex:0 0 auto;
    width:var(--qb-control-h); height:var(--qb-control-h);
    border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
    background:var(--qb-surface); color:var(--qb-text-strong); font-size:17px; cursor:pointer;
  }
  .mobile-nav-scrim{display:block; position:fixed; inset:0; z-index:31; border:0;
    background:rgba(33,38,42,.40); cursor:default;}
  .split,.split.two,.two-col,.recon-model{grid-template-columns:minmax(0,1fr);}
  .recon-diff{grid-column:auto;}
  .sticky-card{position:static;}
  .stmt-wide{max-width:100%; padding:20px;}
  .newmenu{left:16px; right:16px; top:70px;}
  /* Below the tablet break the greeting stacks and the rail is off-canvas. */
  .qbo-home-hero{grid-template-columns:minmax(0,1fr); gap:12px;}
  .qb-greet-spacer{display:none;}
  .qbo-home-actions{justify-self:center;}
}
/* The authoritative drawer state machine enters off-canvas mode only at
   <=1024px. Keep the production rail anchored at every wider breakpoint so a
   generic 1280px demo rule can never visually hide an otherwise focusable
   navigation tree. */
@media(min-width:1025px){
  .authoritative-app .sidebar{position:sticky; top:0; left:auto; transform:none; width:var(--nav-w); flex:0 0 var(--nav-w); box-shadow:none;}
  .authoritative-app .mobile-nav-btn,.authoritative-app .mobile-nav-scrim{display:none;}
  .authoritative-app .main{margin-left:0;}
}
@media(max-width:768px){
  .topbar{padding:0 14px; gap:8px;}
  .authoritative-entity-chip{flex:1 1 auto; min-width:0; max-width:none;}
  .authoritative-top-actions{gap:6px;}
  .authoritative-mode-chip{display:none;}
  .authoritative-signout{padding:0 8px;}
  .authoritative-page-header{align-items:flex-start; flex-direction:column; gap:10px;}
  .authoritative-overview-hero{align-items:flex-start; flex-direction:column; gap:12px;}
  .authoritative-overview-hero-status{align-items:flex-start;}
  .authoritative-overview-summary{grid-template-columns:minmax(0,1fr); gap:12px;}
  .authoritative-overview-workspace-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .authoritative-overview-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .authoritative-unavailable-scope{grid-template-columns:minmax(0,1fr);}
  .topbar>.sw:first-of-type{min-width:0!important; flex:1 1 auto;}
  .top-right{margin-left:auto; gap:6px;}
  .period-chip,.top-right>.muted,.user-nm{display:none;}
  .demo-label-short{display:none;}
  .demo-label-xs{display:inline;}
  .content{padding:18px 16px 44px;}
  .page-h{font-size:24px;}
  .page-top,.accounting-page-head,.report-workbench-head,.card-head,.gl-drill-head,
  .source-doc-hero,.ap-aging-head,.report-preview-head,.qbe-head,.trace-head{
    align-items:flex-start; flex-direction:column; gap:12px;
  }
  .accounting-page-head .row-acts{align-self:stretch; flex-wrap:wrap;}
  .report-period-chip{width:100%;}
  .result-count,.bank-result-count{margin-left:0;}
  .accounting-filter-bar,.expense-filter-evidence,.qbo-report-controls{grid-template-columns:minmax(0,1fr);}
  .accounting-filter-bar label,.accounting-filter-bar select{width:100%;}
  .kpi-row,.qbo-grid,.rep-grid,.rep-grid-featured,.todo-grid,.kv-grid,.qbo-toolgrid,
  .qbo-drill-summary,.gl-overview-strip,.detail-grid,.bank-account-strip{grid-template-columns:minmax(0,1fr);}
  .gl-overview-strip{grid-template-columns:repeat(7,minmax(164px,1fr));overflow-x:auto;}
  .trace-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .trace-grid span{white-space:normal; overflow-wrap:anywhere;}
  .tabs,.seg,.je-queue-chips,.bank-queue-tabs{max-width:100%; overflow-x:auto;}
  .qbo-report-previewbar>button{flex:1 1 auto;}
  .bank-queue-tabs{margin:12px 12px 0;}
  .qb-greeting{font-size:27px; line-height:34px;}
  .qbo-home-actions{width:100%; justify-self:stretch;}
  .qbo-quicklinks button{flex:1 1 auto; justify-content:flex-start;}
  .drawer{width:100vw!important;}
  .badge{max-width:100%; overflow:hidden; text-overflow:ellipsis;}
  .stmt-row{min-width:0;}
  .stmt-row>span{min-width:0; overflow-wrap:anywhere;}
  .acct-card{min-width:0; width:100%;}
  .acct-cards{flex-direction:column;}
  .filter-bar,.expense-toolbar,.filterbar,.bank-toolbar{align-items:stretch; flex-direction:column;}
  .filter-bar label,.expense-toolbar label,.filterbar label{width:100%;}

body.dark{background:var(--qb-canvas); color:var(--qb-text);}

body.dark .nav-group-h:hover{background:var(--qb-raised);}
/* Selected navigation, dark. The rail's current group is identified by the
   filled brand square behind its glyph - #3FA982 on the #12181D rail is 6.14:1,
   so it carries the state on its own.
   The panel's current page could not: --qb-raised on the --qb-surface panel is
   1.16:1, which is the same nothing the hover tint gives, so "which page am I
   on" was unreadable and the row was indistinguishable from a hovered one.
   It now carries the accent tint plus a 3px accent marker - --qb-accent on the
   panel is 9.62:1 - which is the same mark the keyboard table row uses. */

body.dark .nav-group-h.rail-on .rail-label{color:var(--qb-text-strong); font-weight:700;}

   Elevation stays tight and hover is a background tint only - no lift. */

   after the dark section, so they won the cascade in both themes and painted a
   white segmented control and a light grey count pill into the middle of a dark
   page. Every value is now the token that already has a dark pairing, so the
   next component added here inherits the correct colour instead of repeating
   the bug. */
