<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>REFS · WanBridge Real Estate Financial System</title>
<style>
/* ===========================================================================
   REFS UI SYSTEM - single authoritative layer
   Primitives measured from a live QuickBooks Online session on 2026-08-05 and
   recorded in docs/QB-DESIGN-TOKENS.md. This is an independent implementation:
   no QuickBooks CSS, markup, icon or font asset is copied, and the proprietary
   "Avenir Next forINTUIT" face is deliberately NOT referenced.
   Every legacy token name below is an alias onto this one system, so no page
   keeps a private palette. Do not append a new override layer - edit here.
   ========================================================================== */
:root{
  /* neutrals */
  --qb-canvas:#F4F5F8;
  --qb-surface:#FFFFFF;
  --qb-raised:#FFFFFF;
  --qb-inset:#F7F8FA;
  --qb-text:#393A3D;
  --qb-text-strong:#21262A;
  --qb-text-muted:#4C555B;
  --qb-text-faint:#676F74;
  /* four distinct borders, as QB uses them */
  --qb-border:#C3CED5;       /* default control border */
  --qb-border-soft:#D4D7DC;  /* card border */
  --qb-border-alt:#DDDDDD;   /* table rules */
  --qb-divider:#E2E9ED;      /* panel dividers + segmented track */
  /* brand: --qb-brand is a fill, --qb-accent is ink/border on canvas */
  --qb-brand:#003E31;
  --qb-brand-fg:#FFFFFF;
  --qb-brand-hover:#002B22;
  --qb-accent:#003E31;
  --qb-accent-tint:#EDF2F0;
  --qb-link:#205EA3;
  --qb-info:#0097E6;
  /* status: text colors meet 4.5:1 on their own tint */
  --qb-ok:#0F6B45;      --qb-ok-bg:#E3F1E9;   --qb-ok-line:#9CC9B4;
  --qb-warn:#7A5200;    --qb-warn-bg:#FBF0D9; --qb-warn-line:#DFC48A;
  --qb-bad:#A82727;     --qb-bad-bg:#FBE8E8;  --qb-bad-line:#E0A9A9;
  /* radii - measured frequency: 6 control / 8 card / 9999 pill / 4 chip / 12 panel */
  --qb-r-control:6px;
  --qb-r-card:8px;
  --qb-r-pill:9999px;
  --qb-r-chip:4px;
  --qb-r-panel:12px;
  /* elevation - tight and low; borders do the separation work */
  --qb-shadow-card:0 1px 4px rgba(76,85,91,.20);
  --qb-shadow-strong:0 1px 4px rgba(33,38,42,.60);
  --qb-shadow-stick:-2px 0 2px rgba(0,0,0,.15);
  /* metrics */
  --qb-control-h:36px;
  --qb-control-h-sm:30px;
  --qb-focus-ring:0 0 0 3px rgba(0,62,49,.22);
  --qb-sans:"Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --qb-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --nav-w:264px;
  --content-max:1560px;
  --gap:16px;

  /* ---- compatibility aliases: legacy names resolve to the system above ---- */
  --bg-canvas:var(--qb-canvas);
  --bg-surface:var(--qb-surface);
  --bg-elev:var(--qb-inset);
  --text-1:var(--qb-text-strong);
  --text-2:var(--qb-text-muted);
  --text-3:var(--qb-text-faint);
  --brand:var(--qb-accent);
  --brand-ink:var(--qb-accent);
  --accent:var(--qb-accent);
  --ok:var(--qb-ok);
  --warn:var(--qb-warn);
  --bad:var(--qb-bad);
  --divider:var(--qb-border-soft);
  --shadow:none;
  --shadow-lg:var(--qb-shadow-card);
  --radius:var(--qb-r-card);
  --sans:var(--qb-sans);
  --mono:var(--qb-mono);
  --focus-ring:var(--qb-focus-ring);
}
/* Dark-mode parity: every token above is redefined, nothing falls through. */
body.dark{
  --qb-canvas:#0F1418;
  --qb-surface:#171D22;
  --qb-raised:#1E252B;
  --qb-inset:#1B2227;
  --qb-text:#D7DDE1;
  --qb-text-strong:#F1F4F6;
  --qb-text-muted:#9EAAB1;
  --qb-text-faint:#8B979E;
  --qb-border:#404C55;
  --qb-border-soft:#36424A;
  --qb-border-alt:#2F3A41;
  --qb-divider:#28323A;
  --qb-brand:#3FA982;
  --qb-brand-fg:#05231A;
  --qb-brand-hover:#4FBE94;
  --qb-accent:#7BD4AF;
  --qb-accent-tint:#14302A;
  --qb-link:#8DBBEC;
  --qb-ok:#79D3A6;      --qb-ok-bg:#123326;   --qb-ok-line:#2C6449;
  --qb-warn:#E8BE72;    --qb-warn-bg:#3A2C0F; --qb-warn-line:#6E5A28;
  --qb-bad:#F0999C;     --qb-bad-bg:#3B1E20;  --qb-bad-line:#6D3A3D;
  --qb-shadow-card:0 1px 4px rgba(0,0,0,.55);
  --qb-shadow-strong:0 2px 8px rgba(0,0,0,.70);
  --qb-shadow-stick:-2px 0 2px rgba(0,0,0,.45);
  --qb-focus-ring:0 0 0 3px rgba(123,212,175,.28);
}


/* ============================ 1. BASE ==================================== */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--qb-sans);
  background:var(--qb-canvas);
  color:var(--qb-text);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,h5{color:var(--qb-text-strong); font-weight:600; margin:0;}
h3{font-size:20px;} h4{font-size:16px; margin:16px 0 6px;} h5{font-size:14px;}
p{margin:0 0 10px;}
a,.link{color:var(--qb-link); font-weight:500; text-decoration:none;}
a:hover,.link:hover{text-decoration:underline;}
code,.mono{font-family:var(--qb-mono); font-size:12px; background:var(--qb-inset);
  padding:1px 5px; border-radius:var(--qb-r-chip); color:var(--qb-text-strong);}
img,svg,canvas{max-width:100%;}
/* One visible focus treatment everywhere: 2px brand outline, small offset. */
:focus{outline:none;}
:focus-visible{outline:2px solid var(--qb-accent); outline-offset:1px; border-radius:var(--qb-r-chip);}
::selection{background:var(--qb-accent-tint); color:var(--qb-text-strong);}
*{scrollbar-width:thin; scrollbar-color:var(--qb-border) transparent;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--qb-border); border-radius:5px; border:2px solid transparent; background-clip:content-box;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important;}}
.muted{color:var(--qb-text-muted);}
.sm{font-size:12px;}
.warn-txt{color:var(--qb-warn); font-weight:600;}
.ok-txt{color:var(--qb-ok); font-weight:600;}
.bad{color:var(--qb-bad);}
.ok{color:var(--qb-ok);}
.cell-main{font-weight:500; color:var(--qb-text-strong); line-height:1.4;}
.num{font-family:var(--qb-sans); font-variant-numeric:tabular-nums lining-nums; white-space:nowrap;}
.num-neg{color:var(--qb-bad);} .num-bold{font-weight:600; color:var(--qb-text-strong);}
.bal{font-weight:600; font-size:13px;} .bal-ok{color:var(--qb-ok);} .bal-bad{color:var(--qb-bad);}
.acct-code{font-variant-numeric:tabular-nums; color:var(--qb-text-muted); font-size:12px; margin-right:4px;}
.row-acts{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.stack{display:flex; flex-direction:column; gap:8px; min-width:0;}

/* ============================ 2. APP SHELL =============================== */
.app{display:flex; min-height:100vh; background:var(--qb-canvas);}
.main{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--qb-canvas);}
.content{width:100%; max-width:var(--content-max); margin:0 auto; padding:24px 32px 64px; min-width:0;}
.full-bleed{max-width:none; min-width:0;}
.focused{max-width:1280px; margin:0 auto; min-width:0;}

/* ---- Sidebar: light rail, colored circular icon badges, chevron groups ---- */
.sidebar{
  width:var(--nav-w); flex:0 0 var(--nav-w);
  background:var(--qb-surface); border-right:1px solid var(--qb-border-soft);
  position:sticky; top:0; height:100vh; overflow:hidden auto;
  display:flex; flex-direction:column; padding:0 0 16px;
}
.sidebar .brand{
  display:flex; align-items:center; gap:8px; min-height:58px; flex:0 0 auto;
  padding:0 18px; margin:0; border-bottom:1px solid var(--qb-divider);
  color:var(--qb-text-strong); font-size:17px; font-weight:600; letter-spacing:-.01em;
}
.brand .logo{color:var(--qb-accent); font-size:19px; line-height:1;}
.sidebar .brand-sub{margin-left:auto; color:var(--qb-text-muted); font-size:11px; font-weight:500;}
.new-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  flex:0 0 auto; width:calc(100% - 32px); margin:14px 16px 10px;
  min-height:var(--qb-control-h); padding:0 14px;
  background:var(--qb-brand); color:var(--qb-brand-fg); border:0;
  border-radius:var(--qb-r-control); font:500 16px/1 var(--qb-sans); cursor:pointer;
}
.new-btn:hover{background:var(--qb-brand-hover);}
.sidebar nav{flex:1 1 auto; min-height:0; overflow:hidden auto; padding:2px 0 16px; scrollbar-gutter:stable;}
.nav-group{margin:0;}
.nav-group-t{display:none;}
.nav-group-h,.nav-item{
  display:flex; align-items:center; gap:10px;
  width:calc(100% - 16px); margin:1px 8px; padding:7px 10px;
  min-height:36px; border:0; border-radius:var(--qb-r-control);
  background:transparent; color:var(--qb-text); font:500 14px/1.3 var(--qb-sans);
  text-align:left; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.nav-group-h{color:var(--qb-text-strong); font-weight:500;}
.nav-group-h:hover,.nav-item:hover{background:var(--qb-canvas);}
.nav-group-h:focus-visible,.nav-item:focus-visible{outline:2px solid var(--qb-accent); outline-offset:-2px;}
/* colored circular icon badge per group */
.nav-group-h .nav-ic{
  display:inline-grid; place-items:center; flex:0 0 auto;
  width:24px; height:24px; border-radius:var(--qb-r-pill);
  background:var(--qb-accent-tint); color:var(--qb-accent);
  font-size:12px; line-height:1; opacity:1;
}
.nav-group:nth-of-type(6n+1) .nav-group-h .nav-ic{background:#E2EEE9; color:#00543F;}
.nav-group:nth-of-type(6n+2) .nav-group-h .nav-ic{background:#E4ECF5; color:#1C4E82;}
.nav-group:nth-of-type(6n+3) .nav-group-h .nav-ic{background:#EDE8F4; color:#553C7B;}
.nav-group:nth-of-type(6n+4) .nav-group-h .nav-ic{background:#F5EBDD; color:#7A5200;}
.nav-group:nth-of-type(6n+5) .nav-group-h .nav-ic{background:#E7EFF0; color:#1F5560;}
.nav-group:nth-of-type(6n+6) .nav-group-h .nav-ic{background:#F3E8EA; color:#7C3540;}
.nav-caret{margin-left:auto; flex:0 0 auto; color:var(--qb-text-muted); font-size:10px; line-height:1;}
.nav-group-items{display:block; padding:0 0 4px;}
.nav-item{font-size:13.5px; min-height:32px;}
.nav-sub{padding-left:44px!important;}
.nav-item.nav-on{
  background:var(--qb-divider); color:var(--qb-text-strong); font-weight:600;
  box-shadow:inset 3px 0 0 var(--qb-accent);
}
.nav-group-h[aria-current="page"]{background:var(--qb-divider); color:var(--qb-text-strong); font-weight:600;}
.mobile-nav-btn,.mobile-nav-scrim,.mobile-nav-close{display:none;}

/* ---- Topbar ---- */
.topbar{
  position:sticky; top:0; z-index:20; flex:0 0 auto;
  display:flex; align-items:center; flex-wrap:nowrap; gap:10px; min-width:0;
  height:58px; padding:0 24px;
  background:var(--qb-surface); border-bottom:1px solid var(--qb-border-soft);
}
.topbar>.sw:first-of-type{flex:1 1 340px; min-width:200px; max-width:420px; overflow:hidden;}
.topbar>.sw:first-of-type select{width:100%; min-width:0; text-overflow:ellipsis;}
.sw{display:flex; align-items:center; gap:6px; min-width:0; color:var(--qb-text-muted); font-size:12px;}
.topbar select,.cmdk,.icon-btn,.user-chip,.period-chip{
  background:var(--qb-surface); border:1px solid var(--qb-border); color:var(--qb-text);
}
.topbar select{height:var(--qb-control-h); padding:0 10px; border-radius:var(--qb-r-control); font-size:13px; font-weight:500;}
.cmdk{
  flex:0 1 240px; min-width:150px; height:var(--qb-control-h);
  padding:0 12px; border-radius:var(--qb-r-control); text-align:left;
  color:var(--qb-text-muted); font-size:13px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cmdk:hover{border-color:var(--qb-accent); color:var(--qb-text);}
.top-right{margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:10px; min-width:0; white-space:nowrap;}
.top-right>.sw{display:inline-flex; flex:0 0 auto; align-items:center; white-space:nowrap; word-break:keep-all;}
.icon-btn{
  display:inline-grid; place-items:center; flex:0 0 auto;
  width:var(--qb-control-h); height:var(--qb-control-h);
  border-radius:var(--qb-r-pill); cursor:pointer; font-size:14px; line-height:1;
}
.icon-btn:hover{background:var(--qb-canvas);}
.period-chip{
  display:inline-flex; align-items:center; flex:0 0 auto; gap:7px;
  height:var(--qb-control-h); padding:0 10px; border-radius:var(--qb-r-pill);
  white-space:nowrap; word-break:keep-all;
}
.period-label{color:var(--qb-text-muted); font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;}
.period-chip b{color:var(--qb-text-strong); font-size:12px; white-space:nowrap;}
.period-chip .badge{padding:2px 7px;}
.user-chip{
  display:flex; align-items:center; flex:0 0 auto; gap:8px;
  height:var(--qb-control-h); padding:0 10px 0 3px; border-radius:var(--qb-r-pill); white-space:nowrap;
}
.user-av{
  display:grid; place-items:center; width:28px; height:28px; border-radius:var(--qb-r-pill);
  background:var(--qb-brand); color:var(--qb-brand-fg); font-weight:600; font-size:13px;
}
.user-nm{font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis;}
.user-nm,.brand,.new-btn,.nav-item,.nav-group-h,.btn,.grid-tool,.badge{white-space:nowrap; word-break:keep-all;}

/* ============================ 3. PAGE HIERARCHY ========================== */
.page-h{
  margin:0 0 16px; color:var(--qb-text-strong); background:none; -webkit-text-fill-color:currentColor;
  font-size:28px; line-height:1.2; font-weight:400; letter-spacing:-.015em;
}
.page-eyebrow,.eyebrow,.qbo-eyebrow,.trace-eyebrow{
  margin:0 0 5px; color:var(--qb-text-muted);
  font:600 12px/1.2 var(--qb-sans); letter-spacing:.09em; text-transform:uppercase;
}
.page-subtitle{margin:6px 0 0; color:var(--qb-text-muted); font-size:14px; line-height:1.5; max-width:78ch;}
.page-top,.accounting-page-head{
  display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
  margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--qb-divider);
}
.page-top{padding-bottom:0; border-bottom:0;}
.accounting-page-head>div{min-width:0;}
.accounting-page-head .row-acts{align-self:center; flex:0 0 auto;}
.reports-head{align-items:center;} .reports-head .page-h{margin:0;}
.sec-title{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:26px 0 12px;}
.sec-title h3{font-size:20px; font-weight:600; margin:0;}
.card-h,.card-head,.recon-title,.bank-summary-title,.split-head,.drawer-title{
  color:var(--qb-text-strong); font:600 14px/1.4 var(--qb-sans);
}
.card-head,.split-head,.gl-drill-head,.source-doc-hero,.ap-aging-head,.report-preview-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px; min-width:0;
}
.card-h{margin-bottom:8px;}
.gl-drill-head{margin:0 0 14px; padding-bottom:14px; border-bottom:1px solid var(--qb-divider); align-items:center;}
.gl-drill-head>div{min-width:0;}
.gl-drill-crumb{color:var(--qb-text-muted); font-size:12px; font-weight:500; margin-bottom:2px;}
.gl-drill-account{color:var(--qb-text-muted); font-size:12px; margin-top:3px;}
.gl-drill-count{color:var(--qb-text-muted); font-size:12px;}
.gl-drill-actions,.src-actions,.qbe-action-buttons,.qbo-report-row-actions,.source-doc-hero-actions{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0;
}
/* Full-page Back: one affordance, one look, everywhere. */
.crumb,.qbo-report-back>button,.report-preview-crumb{min-width:0;}
.crumb{
  display:inline-flex; align-items:center; gap:7px; min-height:var(--qb-control-h);
  margin:0 0 12px; padding:0 12px 0 8px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-accent);
  font:500 14px/1 var(--qb-sans); text-decoration:none!important; cursor:pointer;
}
.crumb:hover{background:var(--qb-canvas); border-color:var(--qb-accent);}
.crumb-icon{
  display:inline-grid; place-items:center; width:20px; height:20px; flex:0 0 auto;
  border-radius:var(--qb-r-pill); background:var(--qb-accent-tint); color:var(--qb-accent);
  font:400 19px/1 Arial,sans-serif;
}
.qbo-report-back{display:flex; align-items:center; gap:10px; min-width:0; margin-bottom:4px;}
.qbo-report-back>button{
  flex:0 0 auto; min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-accent); font:500 14px/1 var(--qb-sans); cursor:pointer;
}
.qbo-report-back>button:hover{background:var(--qb-canvas); border-color:var(--qb-accent);}
.qbo-report-back>span{min-width:0; color:var(--qb-text-muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}


/* ============================ 4. BUTTONS ================================= */
/* Measured: 36px tall, 16px/500 type, radius 6. Primary is a filled brand
   surface reserved for true primary actions; secondary is a 2px outline. */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong);
  font:500 16px/1 var(--qb-sans); cursor:pointer; box-shadow:none;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.btn:hover{background:var(--qb-canvas); border-color:var(--qb-accent);}
.btn:focus-visible{outline:2px solid var(--qb-accent); outline-offset:1px;}
.btn-primary{background:var(--qb-brand); color:var(--qb-brand-fg); border:0; padding:0 14px;}
.btn-primary:hover{background:var(--qb-brand-hover); color:var(--qb-brand-fg); filter:none;}
.btn-secondary{background:transparent; color:var(--qb-accent); border:2px solid var(--qb-accent); padding:0 10px;}
.btn-secondary:hover{background:var(--qb-accent-tint); color:var(--qb-accent);}
.btn-ghost{background:transparent; color:var(--qb-accent); border-color:var(--qb-border);}
.btn-ghost:hover{background:var(--qb-accent-tint);}
.btn-danger{background:var(--qb-bad); color:#FFF; border-color:var(--qb-bad);}
.btn-danger:hover{background:var(--qb-bad); filter:brightness(.92);}
/* Dense in-row action: still a 30px target, but does not out-shout 14px cells. */
.btn-sm{min-height:var(--qb-control-h-sm); padding:0 9px; font-size:13px; font-weight:500;}
.link-btn,.text-btn,.x-sm{
  border:0; background:transparent; padding:0; cursor:pointer;
  color:var(--qb-link); font:500 13px/1.4 var(--qb-sans);
}
.link-btn:hover,.text-btn:hover{text-decoration:underline;}
.x-sm{color:var(--qb-bad); font-size:16px;}
/* One read-only/disabled treatment: reduced contrast, no hover, not-allowed. */
.btn:disabled,.btn[aria-disabled="true"],
button:disabled,[aria-disabled="true"],
.grid-tool:disabled,.qbo-quicklinks button:disabled,
.qbo-report-controls>button:disabled,.qbo-report-previewbar>button:disabled,
.bank-queue-tabs button:disabled,.seg button:disabled{
  background:var(--qb-inset); color:var(--qb-text-faint); border-color:var(--qb-border-soft);
  cursor:not-allowed; box-shadow:none; opacity:1; filter:none;
}
.btn-primary:disabled,.btn-primary[aria-disabled="true"]{background:var(--qb-inset); color:var(--qb-text-faint); border:1px solid var(--qb-border-soft);}
.btn-secondary:disabled,.btn-secondary[aria-disabled="true"]{border:2px solid var(--qb-border-soft); background:transparent;}
button:disabled:hover,[aria-disabled="true"]:hover{background:var(--qb-inset); border-color:var(--qb-border-soft); text-decoration:none;}
input:disabled,select:disabled,textarea:disabled,input[readonly],textarea[readonly],.ro-box{
  background:var(--qb-inset); color:var(--qb-text-muted); cursor:not-allowed;
}
.ro-box{cursor:default;}

/* ---- Segmented control: white item on an #E2E9ED track ---- */
/* Used for queue/tab switching. Counts render inside the label: "Pending (12)". */
.tabs,.seg,.je-queue-chips,.bank-queue-tabs,.qbo-report-tabs,.qbo-segment{
  display:inline-flex; align-items:center; gap:2px; min-width:0; max-width:100%;
  padding:2px; margin:0 0 16px; border:0;
  background:var(--qb-divider); border-radius:var(--qb-r-control);
  overflow:auto hidden; scrollbar-width:none;
}
.tabs::-webkit-scrollbar,.seg::-webkit-scrollbar,.je-queue-chips::-webkit-scrollbar,
.bank-queue-tabs::-webkit-scrollbar{height:0;}
.tab,.seg>button,.je-queue-chips>button,.bank-queue-tabs>button,
.qbo-report-tabs>button,.qbo-segment>button{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  flex:0 0 auto; min-height:32px; padding:0 16px; border:0;
  background:transparent; color:var(--qb-text-muted);
  font:400 16px/1 var(--qb-sans); border-radius:5px; cursor:pointer; white-space:nowrap;
  transition:background .12s ease,color .12s ease;
}
.tab:hover,.seg>button:hover,.je-queue-chips>button:hover,.bank-queue-tabs>button:hover,
.qbo-report-tabs>button:hover{color:var(--qb-text-strong);}
.tab.tab-on,.tab-on,.seg>button[aria-selected="true"],.seg>button.on,
.je-queue-chips>button.on,.bank-queue-tabs>button.active,
.qbo-report-tabs>button.on,.qbo-segment>button.on{
  background:var(--qb-surface); color:var(--qb-text-strong); border:0;
  box-shadow:var(--qb-shadow-card);
}
/* On a segmented track a disabled item must stay flat: a raised white item
   reads as "selected", which would make an unavailable option look chosen. */
.tab:disabled,.seg>button:disabled,.je-queue-chips>button:disabled,
.bank-queue-tabs>button:disabled,.qbo-report-tabs>button:disabled,.qbo-segment>button:disabled{
  background:transparent; color:var(--qb-text-faint); border:0; box-shadow:none; cursor:not-allowed;
}
/* Report preview bar is an action toolbar, not a queue switcher. */
.qbo-report-previewbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; min-width:0;}
.qbo-report-previewbar>button{
  min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong);
  font:500 14px/1 var(--qb-sans); cursor:pointer; white-space:nowrap;
}
.qbo-report-previewbar>button:hover:not(:disabled){border-color:var(--qb-accent);}
.qbo-report-previewbar>button.on{border:2px solid var(--qb-accent); background:var(--qb-accent-tint); color:var(--qb-accent);}
.bank-queue-tabs{padding:2px; margin:14px 16px 0;}
/* Count pill */
.badge-count,.bank-queue-tabs button span,.je-queue-chips button span{
  display:inline-grid; place-items:center; min-width:20px; height:18px; padding:0 7px;
  border-radius:var(--qb-r-pill); background:var(--qb-divider); color:var(--qb-text-muted);
  font:500 11px/1 var(--qb-sans);
}
.bank-queue-tabs button.active span,.je-queue-chips button.on span{background:var(--qb-accent-tint); color:var(--qb-accent);}
/* Legacy chip filters keep a single calm look rather than a filled brand pill. */
.chips{display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px;}
.chip,.step-chip,.mo-chip,.report-shelf-chip,.grid-tool,.ck{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:var(--qb-control-h-sm); padding:0 10px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-muted);
  font:500 13px/1 var(--qb-sans); cursor:pointer; white-space:nowrap;
}
.chip:hover,.step-chip:hover,.mo-chip:hover,.grid-tool:hover{border-color:var(--qb-accent); color:var(--qb-text-strong);}
.chip-on,.step-chip.step-on,.mo-chip.mo-on,.report-shelf-chip-on{
  background:var(--qb-accent-tint); border:2px solid var(--qb-accent); color:var(--qb-accent); font-weight:600;
}
.step-chip.step-done{color:var(--qb-ok); border-color:var(--qb-ok-line); background:var(--qb-ok-bg);}
.ck{cursor:default; min-height:auto; padding:6px 12px; font-size:12px;}
.ck.ok{color:var(--qb-ok); border-color:var(--qb-ok-line); background:var(--qb-ok-bg);}
.ck.warn{color:var(--qb-warn); border-color:var(--qb-warn-line); background:var(--qb-warn-bg);}
.ck.bad{color:var(--qb-bad); border-color:var(--qb-bad-line); background:var(--qb-bad-bg);}
.check-band{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.stepper{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.mo-chips{display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap;}
.mo-chip{position:relative; width:36px; padding:0; justify-content:center;}
.mo-dot{position:absolute; top:3px; right:3px; width:5px; height:5px; border-radius:50%; background:var(--qb-ok);}

/* ============================ 5. FORM CONTROLS =========================== */
input,select,textarea{font-family:inherit;}
select,input[type=text],input[type=search],input[type=date],input[type=number],input:not([type]),
.grid-search,.field input,.field select,.desc-in,.desc-line,.date-in,.input,
.filter-bar select,.bank-search,.expense-search,.je-search,.qbo-report-search input,
.qbo-report-controls select,.filterbar input,.filterbar select{
  min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text); font-size:14px; line-height:1.4;
}
textarea,.input[rows],.field textarea,.ro-box{
  padding:9px 12px; border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text); font:400 14px/1.5 var(--qb-sans); width:100%;
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--qb-accent); outline-offset:0; border-color:var(--qb-accent);
}
select{padding-right:28px; cursor:pointer;}
.field{margin:14px 0; min-width:0;}
.field label{display:block; margin-bottom:5px; color:var(--qb-text-muted); font:500 12px/1.4 var(--qb-sans);}
.field input,.field select,.field textarea{width:100%;}
.req{color:var(--qb-bad); margin-left:3px;}
.field-msg{margin-top:4px; color:var(--qb-text-muted); font-size:12px;}
.field-msg.err,.err{color:var(--qb-bad);}
.field-err input,.field-err select{border-color:var(--qb-bad);}
.ro-box{min-height:var(--qb-control-h);}
.num-in{text-align:right; font-variant-numeric:tabular-nums;}
.desc-in,.desc-line{width:100%; max-width:420px;}
.date-in{max-width:150px;}
.dim-picks{display:flex; gap:6px; flex-wrap:wrap;}
.dim-picks select{min-height:var(--qb-control-h-sm); font-size:12px; padding:0 6px; max-width:120px;}
/* Search fields carry a trailing glyph, matching the measured pattern. */
.expense-search,.je-search,.bank-search{
  display:inline-flex; flex-direction:row-reverse; align-items:center; gap:8px;
  min-width:220px; flex:1 1 260px; max-width:420px; padding:0 12px;
}
.expense-search input,.je-search input,.bank-search input{
  flex:1 1 auto; min-width:0; width:100%; border:0; outline:0; background:transparent;
  font:inherit; color:inherit; min-height:auto; padding:0;
}
.expense-search>span,.je-search>span,.bank-search>span,.bank-search-glyph{
  flex:0 0 auto; color:var(--qb-text-muted); font-size:15px; line-height:1;
}

/* ---- Filter / toolbar rows: responsive grids, never a wrapping mess ---- */
.filter-bar,.expense-toolbar,.filterbar,.je-filter-bar,.bank-toolbar,
.fixed-assets-filter,.loan-select,.filter-row,.pickup-bar,.ap-aging-kpis{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:0;
  margin:0 0 14px; padding:10px 14px;
  background:var(--qb-surface); border:1px solid var(--qb-border-soft);
  border-radius:var(--qb-r-card); box-sizing:border-box;
}
.filter-bar label,.expense-toolbar label,.filterbar label,.fixed-assets-filter label{
  display:flex; align-items:center; gap:8px; min-width:0;
  color:var(--qb-text-muted); font:500 13px/1.3 var(--qb-sans);
}
.filter-label,.filter-row span,.filter-bar>span:not(.badge):not(.result-count){color:var(--qb-text-muted); font-size:13px;}
.accounting-filter-bar{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); align-items:center;
  column-gap:14px; row-gap:10px; position:relative; margin-bottom:10px; box-shadow:none;
}
.accounting-filter-bar label{display:flex; align-items:center; gap:7px; min-width:0; font-size:13px;}
.accounting-filter-bar select{min-width:0; width:100%;}
.result-count,.bank-result-count,.grid-count{
  margin-left:auto; color:var(--qb-text-muted); font-size:12px; white-space:nowrap;
}
.result-count b,.bank-result-count b,.grid-count b{color:var(--qb-text-strong); font-size:14px;}
.je-queue-chips{margin:0;}

/* ============================ 6. SURFACES ================================ */
/* 8px radius, 1px #D4D7DC, no shadow, and no hover lift anywhere. */
.card,.kpi,.qbo-card,.acct-card,.recon-col,.appr-row,.login-card,.stmt,.stmt-wide,
.split-left,.split-right,.trace-panel,.src-card,.qbe-document,.report-drill-panel,
.report-workbench,.qbo-home-hero,.qbo-report-promo,.qbo-report-controls,.qbo-report-toolpanel,
.bank-queue-card,.expense-shell-panel,.source-doc-panel,.source-doc-shell,.sticky-card,
.report-period-chip,.qbe,.integration-hub-card{
  background:var(--qb-surface); border:1px solid var(--qb-border-soft);
  border-radius:var(--qb-r-card); box-shadow:none; backdrop-filter:none;
}
.card{padding:18px;}
.card:hover,.kpi:hover,.qbo-card:hover,.acct-card:hover,.card-hover:hover,.todo-item:hover{
  transform:none; box-shadow:none;
}
.card-hover,.todo-item{cursor:pointer;}
.card-hover:hover,.todo-item:hover,.acct-card:hover,.qbo-card:hover{background:var(--qb-inset); border-color:var(--qb-border);}
.card-hover:focus-visible{outline:2px solid var(--qb-accent); outline-offset:2px;}
.sticky-card{padding:16px; position:sticky; top:74px;}
.kpi-row{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
.kpi{padding:16px 18px; min-width:0;}
.kpi-label{color:var(--qb-text-muted); font:500 12px/1.4 var(--qb-sans);}
.kpi-value,.qbo-big{
  margin-top:4px; color:var(--qb-text-strong); background:none; -webkit-text-fill-color:currentColor;
  font:600 20px/1.25 var(--qb-sans); font-variant-numeric:tabular-nums; letter-spacing:-.01em;
  overflow-wrap:anywhere;
}
.kpi-sub{margin-top:3px; color:var(--qb-text-muted); font-size:12px;}
.kpi.ok .kpi-value{color:var(--qb-ok);} .kpi.warn .kpi-value{color:var(--qb-warn);} .kpi.bad .kpi-value{color:var(--qb-bad);}
.kv{display:flex; align-items:baseline; justify-content:space-between; gap:16px;
  padding:8px 0; border-bottom:1px solid var(--qb-divider); font-size:14px; min-width:0;}
.kv span{color:var(--qb-text-muted); flex:0 0 auto;}
.kv b{text-align:right; overflow-wrap:anywhere;}
.kv.tot{font-weight:600; border-bottom:0; border-top:1px solid var(--qb-border); margin-top:4px; padding-top:10px;}
/* Label/value metric grids - one shared pattern for every workspace. */
.kv-grid,.qbo-drill-summary,.gl-overview-strip,.detail-grid,
.source-doc-kv,.source-doc-panel-grid,.bank-summary-metrics,.qbo-insight-metrics,.src-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin:12px 0; min-width:0;
}
.qbo-toolgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0;min-width:0;}
.qbo-toolgrid>span,.qbo-toolgrid>div{display:flex;flex-direction:column;gap:5px;min-width:0;
  padding:10px 12px;background:var(--qb-inset);
  border:1px solid var(--qb-border-soft);border-radius:var(--qb-r-card);}
.kv-grid>div,.qbo-drill-summary>span,.gl-overview-strip>span,
.detail-grid>div,.detail-grid>span,.source-doc-kv>div,.source-doc-panel-grid>div,
.bank-summary-metrics>span,.qbo-insight-metrics>span,.src-grid span{
  display:flex; flex-direction:column; gap:5px; min-width:0;
  padding:10px 12px; background:var(--qb-inset);
  border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-card);
}
.kv-grid span,.qbo-toolgrid i,.qbo-drill-summary i,.gl-overview-strip i,.src-grid i,
.detail-grid i,.source-doc-kv span,.bank-summary-metrics i,.qbo-insight-metrics i{
  color:var(--qb-text-muted); font:500 12px/1.3 var(--qb-sans); font-style:normal;
}
.kv-grid b,.qbo-toolgrid b,.qbo-drill-summary b,.gl-overview-strip b,.src-grid b,
.detail-grid b,.source-doc-kv b,.bank-summary-metrics b,.qbo-insight-metrics b{
  color:var(--qb-text-strong); font-size:14px; font-weight:600; overflow-wrap:anywhere;
}

/* ============================ 7. BADGES ================================== */
.badge{
  display:inline-flex; align-items:center; gap:6px; max-width:100%;
  padding:2px 8px; border-radius:var(--qb-r-pill);
  font:500 11px/1.5 var(--qb-sans); letter-spacing:.01em; text-transform:none;
  overflow:hidden; text-overflow:ellipsis;
}
.badge::before{content:''; flex:0 0 auto; width:6px; height:6px; border-radius:50%; background:currentColor;}
.badge-muted{background:var(--qb-divider); color:var(--qb-text-muted);}
.badge-ok{background:var(--qb-ok-bg); color:var(--qb-ok);}
.badge-warn{background:var(--qb-warn-bg); color:var(--qb-warn);}
.badge-bad{background:var(--qb-bad-bg); color:var(--qb-bad);}

/* ============================ 8. TABLES ================================== */
/* Headers 14/600 sticky; numerics right-aligned; the wrapper scrolls, never the page. */
.table-wrap{
  background:var(--qb-surface); border:1px solid var(--qb-border-soft);
  border-radius:var(--qb-r-card); box-shadow:none;
  overflow:auto; max-width:100%; margin-bottom:8px; scrollbar-gutter:stable;
  /* Table-local scrolling keeps the sticky header stable and stops the page
     from scrolling sideways. Short tables are unaffected by a max-height. */
  max-height:min(74vh,880px);
}
.table-wrap:focus-visible{outline:2px solid var(--qb-accent); outline-offset:2px;}
.tbl,.mini-table,.stmt-tbl,.je-lines{width:100%; border-collapse:separate; border-spacing:0; font-size:14px;}
.tbl th{
  position:sticky; top:0; z-index:2; height:40px; padding:8px 12px;
  background:var(--qb-surface); color:var(--qb-text-strong);
  border-bottom:1px solid var(--qb-border-alt);
  font:600 14px/1.3 var(--qb-sans); text-align:left; text-transform:none; letter-spacing:0;
  white-space:nowrap; word-break:keep-all; user-select:none; backdrop-filter:none;
}
.tbl td{
  height:44px; padding:9px 12px; border-top:1px solid var(--qb-border-alt);
  color:var(--qb-text); vertical-align:middle; font-size:14px;
}
.tbl td:first-child,.tbl th:first-child{padding-left:16px;}
.tbl td:last-child,.tbl th:last-child{padding-right:16px;}
.tbl-dense td{height:36px; padding:5px 12px!important;}
.ta-r{text-align:right; font-variant-numeric:tabular-nums;}
.tbl th.ta-r,.tbl td.ta-r{text-align:right;}
.th-sort{
  appearance:none; border:0; background:transparent; color:inherit; font:inherit;
  letter-spacing:inherit; padding:0; cursor:pointer; text-align:inherit;
}
.th-sort:hover{color:var(--qb-link);}
.th-sort:focus-visible{outline:2px solid var(--qb-accent); outline-offset:3px;}
.sort-ind{color:var(--qb-accent);}
.tbl tbody tr{transition:background .1s ease;}
.tr-click{cursor:pointer;}
.tbl tbody tr:hover,.tr-click:hover,.tr-hi{background:var(--qb-canvas); box-shadow:none;}
.sec-row td{background:var(--qb-inset)!important; color:var(--qb-text-strong);
  font:600 12px/1.4 var(--qb-sans); letter-spacing:.06em; text-transform:uppercase;}
.sub-row td{border-top:1px solid var(--qb-border); background:var(--qb-inset); font-weight:600;}
.grand-row td{border-top:2px solid var(--qb-border); font-weight:700; font-size:15px; color:var(--qb-text-strong);}
.mini-table,.mini-list{font-size:13px; margin:8px 0;}
.mini-table td{padding:5px 8px; border-top:1px solid var(--qb-divider); font-variant-numeric:tabular-nums;}
.mini-table td:nth-child(n+2){text-align:right;}
.mini-list{display:flex; flex-direction:column; gap:6px; color:var(--qb-text-muted);}
.grid-bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:42px;
  padding:5px 0; margin:0 0 6px; border-bottom:1px solid var(--qb-divider);
}
.grid-search{width:min(320px,40vw); min-width:180px;}
.grid-pager{display:flex; align-items:center; gap:12px; justify-content:flex-end; flex-wrap:wrap; margin-top:10px;}
.bank-pagination{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; color:var(--qb-text-muted); font-size:12px;}
.tb-tot{display:flex; gap:22px; align-items:center; justify-content:flex-end; flex-wrap:wrap; padding:12px 14px; font-size:14px;}

/* ============================ 9. STATES ================================== */
/* One empty / loading / error language across all ten workspaces. */
.empty,.empty-state,.bank-queue-empty,.ap-aging-empty,.report-entity-required{
  display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  padding:22px 24px; background:var(--qb-surface);
  border:1px dashed var(--qb-border); border-radius:var(--qb-r-card);
  color:var(--qb-text-muted); font-size:14px; text-align:left;
}
.empty-big{padding:64px 24px; text-align:center; color:var(--qb-text-muted); border:0; background:transparent; align-items:center;}
.err-box{
  display:flex; flex-direction:column; gap:4px; margin:12px 0; padding:11px 14px;
  background:var(--qb-bad-bg); border:1px solid var(--qb-bad-line);
  border-radius:var(--qb-r-card); color:var(--qb-bad); font-size:13px;
}
.report-entity-required{border-color:var(--qb-warn-line); background:var(--qb-warn-bg); color:var(--qb-warn);}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:60;
  padding:11px 20px; background:var(--qb-text-strong); color:#FFF;
  border-radius:var(--qb-r-control); box-shadow:var(--qb-shadow-strong); font-size:14px;
}
.toast-bad{background:var(--qb-bad);} .toast-warn{background:var(--qb-warn);}


/* ============================ 10. LAYOUT ================================= */
.split{display:grid; grid-template-columns:minmax(280px,340px) minmax(0,1fr); gap:16px; align-items:start;}
.split.two{grid-template-columns:repeat(2,minmax(0,1fr));}
.split-left{overflow:hidden;}
.split-head{padding:12px 14px; border-bottom:1px solid var(--qb-divider); align-items:center;}
.split-right{padding:20px; min-height:360px; min-width:0;}
.two-col{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
.qbo-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:20px;}
.qbo-card{padding:17px 18px; min-width:0; position:relative; overflow:hidden; background:var(--qb-surface)!important;}
.qbo-card::after{display:none;}
.qbo-card h4{margin:0 0 4px; color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.06em; text-transform:uppercase;}
.qbo-sub{margin-bottom:10px; color:var(--qb-text-muted); font-size:12px;}
.qbo-bars{display:flex; align-items:flex-end; gap:6px; height:64px; margin-top:8px;}
.qbo-bar{flex:1; min-height:4px; border-radius:3px 3px 0 0; background:var(--qb-brand);}
.qbo-bar.neg{background:var(--qb-bad);}
.donut{width:96px; height:96px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
.donut-wrap{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
.legend{display:flex; flex-direction:column; gap:5px; font-size:12px; min-width:0;}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px;}
.bank-row,.balance-row{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--qb-divider); font-size:14px;}
.bank-row:last-child,.balance-row:last-child{border-bottom:0;}
.split-bar{display:flex; height:10px; border-radius:var(--qb-r-pill); overflow:hidden; margin:10px 0 6px;}
.todo-grid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px;}
.todo-card,.todo-item{display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 12px;
  background:var(--qb-surface); border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-card);}
.todo-n{display:grid; place-items:center; width:48px; height:48px; border-radius:var(--qb-r-pill);
  font:600 24px/1 var(--qb-sans); font-variant-numeric:tabular-nums;}
.todo-label,.todo-l{color:var(--qb-text-muted); font-size:12px; text-align:center;}
.appr-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:11px 16px; margin-bottom:8px; font-size:14px; min-width:0;}
.appr-row>span:first-child{min-width:0; overflow-wrap:anywhere;}
.appr-tl{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
.appr-step{display:flex; align-items:center; gap:10px; color:var(--qb-text-muted); font-size:14px; flex-wrap:wrap;}
.appr-step.appr-done{color:var(--qb-text);}
.appr-dot{width:10px; height:10px; border-radius:50%; background:var(--qb-border); flex:none;}
.appr-done .appr-dot{background:var(--qb-ok);}
.close-prog{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
.close-bar{flex:1 1 200px; height:8px; max-width:400px; background:var(--qb-divider); border-radius:var(--qb-r-pill); overflow:hidden;}
.close-fill{height:100%; background:var(--qb-ok);}
.pickup-sum{display:flex; gap:22px; margin:12px 0; font-size:14px; flex-wrap:wrap;}
.sod-list{color:var(--qb-text); font-size:14px; line-height:1.9;}
.integration-hub,.ar-workspace,.bill-payments-workspace,.ap-aging-shell,.authoritative-app,
.wbs-accounting-action-queue,.wbs-accounting-analysis-report,.wbs-e2e-flow-evidence,
.ai-review-outcome-trace,.ai-rent-roll-review,.qbo-transaction-report,.report-replacement-view,
.expense-shell-panel,.exc-detail,.source-doc-shell{min-width:0;}
.ai-report-note{margin:10px 0; color:var(--qb-text-muted); font-size:12px;}
.evidence-id-list{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; padding:0; list-style:none;
  color:var(--qb-text-muted); font-size:12px; font-variant-numeric:tabular-nums;}

/* ============================ 11. OVERLAYS =============================== */
.drawer-scrim,.pal-scrim,.newmenu-scrim{position:fixed; inset:0; background:rgba(33,38,42,.32);}
.drawer-scrim{display:flex; justify-content:flex-end; z-index:40;}
.drawer{
  display:flex; flex-direction:column; height:100%; max-width:100vw;
  background:var(--qb-surface); border-left:1px solid var(--qb-border-soft);
  border-radius:0; box-shadow:var(--qb-shadow-strong); animation:slideIn .18s ease;
}
@keyframes slideIn{from{transform:translateX(24px); opacity:.6;} to{transform:none; opacity:1;}}
.drawer-head{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px; border-bottom:1px solid var(--qb-divider);}
.drawer-body{flex:1; padding:20px; overflow:auto;}
.drawer-foot{display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;
  padding:14px 20px; border-top:1px solid var(--qb-divider);}
.x{border:0; background:transparent; color:var(--qb-text-muted); font-size:22px; cursor:pointer; line-height:1;}
.pal-scrim{display:flex; justify-content:center; align-items:flex-start; padding:14vh 16px 0; z-index:70;}
.pal{width:480px; max-width:100%; background:var(--qb-surface); border:1px solid var(--qb-border-soft);
  border-radius:var(--qb-r-panel); box-shadow:var(--qb-shadow-strong); overflow:hidden;}
.pal input{width:100%; border:0; border-bottom:1px solid var(--qb-divider); border-radius:0;
  background:transparent; padding:16px 18px; font-size:15px;}
.pal-list{max-height:340px; overflow:auto;}
.pal-list button{display:flex; justify-content:space-between; gap:12px; width:100%; border:0;
  background:transparent; color:var(--qb-text); text-align:left; padding:10px 18px; cursor:pointer; font-size:14px;}
.pal-list button:hover{background:var(--qb-canvas);}
.newmenu-scrim{z-index:60;}
.newmenu{
  position:absolute; left:calc(var(--nav-w) + 8px); top:64px; z-index:61;
  display:flex; gap:32px; flex-wrap:wrap; max-width:calc(100vw - 32px);
  padding:18px 22px; background:var(--qb-surface);
  border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-panel); box-shadow:var(--qb-shadow-strong);
}
.newmenu h5{margin:0 0 8px; color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.07em; text-transform:uppercase;}
.newmenu button{display:block; width:100%; border:0; background:none; color:var(--qb-link);
  font:500 14px/1.6 var(--qb-sans); padding:4px 0; text-align:left; cursor:pointer;}
.newmenu button:hover{text-decoration:underline;}

/* ============================ 12. LOGIN ================================== */
.login-wrap,.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--qb-canvas);}
.login-card{display:flex; flex-direction:column; gap:12px; width:420px; max-width:100%; padding:32px 34px;}
.login-logo{color:var(--qb-accent); font:600 28px/1.2 var(--qb-sans);}
.login-sub{margin-bottom:6px; color:var(--qb-text-muted); font-size:14px;}
.login-label{color:var(--qb-text-muted); font-size:12px;}
.login-btn{margin-top:6px; width:100%;}
.login-note{color:var(--qb-text-muted); font-size:12px; line-height:1.6;}

/* ============================ 13. JOURNAL ENTRY ========================== */
.je-list{max-height:64vh; overflow:auto;}
.je-item{padding:11px 14px; border-top:1px solid var(--qb-divider); cursor:pointer;}
.je-item:hover{background:var(--qb-canvas);}
.je-item-on{background:var(--qb-accent-tint); box-shadow:inset 3px 0 0 var(--qb-accent);}
.je-item-top{display:flex; justify-content:space-between; gap:8px; font-size:13px; font-weight:600;}
.je-item-desc{margin:3px 0; color:var(--qb-text-muted); font-size:12px;}
.je-item-amt{font-size:12px; font-variant-numeric:tabular-nums;}
.je-head,.qbe-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:10px; flex-wrap:wrap;}
.je-num,.qbe-title{color:var(--qb-text-strong); font:600 20px/1.3 var(--qb-sans); letter-spacing:-.01em;}
.je-meta,.qbe-meta{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:14px; color:var(--qb-text-muted); font-size:13px;}
.je-lines input,.je-lines select,.qbe-grid select,.qbe-grid input{
  width:100%; min-height:32px; padding:0 8px; border:1px solid var(--qb-border);
  border-radius:var(--qb-r-control); background:var(--qb-surface); color:var(--qb-text); font-size:13px;
}
.je-lines tfoot td{border-top:1px solid var(--qb-border); padding-top:10px; font-weight:600;}
.je-actions,.qbe-actionbar,.qbe-action-context{display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap; min-width:0;}
.qbe-below{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:10px 0;}
.qbe-totals{display:flex; gap:20px; align-items:center; flex-wrap:wrap; font-size:14px; font-variant-numeric:tabular-nums;}
.qbe-totals .bal-bad{color:var(--qb-bad); font-weight:700;} .qbe-totals .bal-ok{color:var(--qb-ok); font-weight:700;}
.qbe-memo{margin:12px 0 6px;}
.qbe-memo label{display:block; margin-bottom:4px; color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.05em; text-transform:uppercase;}
.qbe-footbar{
  position:sticky; bottom:0; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  margin-top:14px; padding-top:14px; border-top:1px solid var(--qb-divider); background:var(--qb-surface);
}
.qbe-document{padding:0 20px 18px; overflow:hidden;}
.qbe-document .qbe-head{margin:0 -20px 14px; padding:18px 20px 14px; border-bottom:1px solid var(--qb-divider); background:var(--qb-inset);}
.qbe-document .je-lines{border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-control); overflow:hidden;}
.qbe-document .je-lines th{background:var(--qb-inset)!important;}
.qbe-document .je-lines td{height:44px;}
.qbe-document .qbe-below{margin:0; padding:11px 12px; border:1px solid var(--qb-border-soft); border-top:0; background:var(--qb-inset);}
.qbe-document .qbe-memo{margin-top:16px; padding:12px 14px; border-left:3px solid var(--qb-accent); background:var(--qb-inset);}
.qbe-document .qbe-footbar{margin:18px -20px -18px; padding:13px 20px; background:var(--qb-inset); border-top:1px solid var(--qb-border-soft);}
/* Journal entry queue: fixed widths, table-local scroll, wrapping description. */
.table-journal-entries{overflow-x:auto; scrollbar-gutter:stable;}
.table-journal-entries .tbl{min-width:1120px; table-layout:fixed;}
.table-journal-entries th,.table-journal-entries td{overflow:hidden;}
.table-journal-entries th:nth-child(1),.table-journal-entries td:nth-child(1),
.table-journal-entries th:nth-child(2),.table-journal-entries td:nth-child(2),
.table-journal-entries th:nth-child(4),.table-journal-entries td:nth-child(4),
.table-journal-entries th:nth-child(6),.table-journal-entries td:nth-child(6),
.table-journal-entries th:nth-child(7),.table-journal-entries td:nth-child(7){white-space:nowrap; word-break:keep-all; text-overflow:ellipsis;}
.table-journal-entries td:nth-child(3),.table-journal-entries td:nth-child(5){display:table-cell; white-space:normal; word-break:normal; overflow-wrap:break-word; line-height:1.35;}

/* ============================ 14. STATEMENTS / GL ======================== */
.stmt{padding:8px 20px; max-width:560px;}
.stmt-wide{max-width:960px; padding:24px 30px;}
.stmt-h{margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--qb-border);
  color:var(--qb-text-strong); font:600 18px/1.3 var(--qb-sans);}
.stmt-sec{margin:16px 0 6px; padding-bottom:5px; border-bottom:1px solid var(--qb-border-alt);
  color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.07em; text-transform:uppercase;}
.stmt-row{display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--qb-divider); min-width:0;}
.stmt-row>span{min-width:0; overflow-wrap:anywhere;}
.stmt-row.tot{font-weight:600; border-bottom:0;}
.stmt-row:hover{background:var(--qb-canvas);}
.stmt-drill-row{cursor:default;}
.report-drill{
  display:inline-flex; align-items:center; justify-content:flex-end; gap:7px; min-width:110px;
  padding:2px 4px; border:0; border-bottom:1px solid transparent; background:transparent;
  color:var(--qb-link); font:inherit; cursor:pointer;
}
.report-drill .num{color:var(--qb-link); font-weight:500;}
.report-drill>span:last-child,.rep-arrow,.drill-caret{opacity:.6; font-size:16px; line-height:1;}
.report-drill:hover{border-bottom-color:var(--qb-link); background:var(--qb-canvas);}
.report-drill:hover>span:last-child{opacity:1;}
.report-drill.total .num{font-weight:700;}
.report-drill-hint,.source-drill,.drill-target{color:var(--qb-text-muted); font-size:12px;}
.report-drill-panel{margin-top:18px; padding:16px 18px; border-left:3px solid var(--qb-accent);}
.report-drill-panel .sec-title{margin-top:0;}
.report-drill-panel .tr-click{cursor:pointer;}
.report-drill-panel .tr-click td:first-child{color:var(--qb-link); font-weight:500;}
.trial-balance-table .tbl,.reports-workbench-table .tbl{min-width:760px;}
.trial-balance-table,.reports-workbench-table{overflow-x:auto;}
/* A table rendered without an explicit wrapper still scrolls inside its own
   region rather than pushing the page sideways. */
.je-lines-scroll,section:has(>table.tbl){overflow-x:auto; max-width:100%; scrollbar-gutter:stable;}
.je-lines-scroll:focus-visible,section:has(>table.tbl):focus-visible{outline:2px solid var(--qb-accent); outline-offset:2px;}
.je-lines-scroll .tbl{min-width:900px;}

/* ============================ 15. EVIDENCE TRACE ========================= */
.trace-panel{margin:0 0 14px; padding:16px 18px; border-left:3px solid var(--qb-accent);}
.trace-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px;}
.trace-chain,.src-chain,.source-doc-trace{display:flex; align-items:center; flex-wrap:wrap; gap:7px;
  margin:10px 0; color:var(--qb-text-muted); font-size:12px;}
.trace-chain i,.src-chain i{color:var(--qb-text-faint); font-style:normal;}
.trace-chain strong{color:var(--qb-accent);}
.trace-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;
  padding:10px 0; border-top:1px solid var(--qb-divider);}
.trace-grid span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;}
.trace-grid i{display:block; margin-bottom:2px; color:var(--qb-text-muted);
  font:600 11px/1.3 var(--qb-sans); font-style:normal; letter-spacing:.06em; text-transform:uppercase;}
.trace-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.src-card{padding:14px 18px; margin:12px 0;}
.source-doc-shell,.source-doc-panel{padding:16px 18px; margin:12px 0;}
.source-doc-hero{align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:12px;}
.source-doc-meta{color:var(--qb-text-muted); font-size:12px;}
.bank-source,.exc-detail{color:var(--qb-text-muted); font-size:13px;}

/* ============================ 16. RECONCILIATION ========================= */
.recon-model{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(200px,240px); gap:16px; margin-bottom:20px; align-items:start;}
.recon-col{padding:16px 18px; min-width:0;}
.recon-title{margin-bottom:10px;}
.recon-diff{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:20px; border-radius:var(--qb-r-card); font-size:14px; text-align:center;}
.recon-diff.ok{background:var(--qb-ok-bg); border:1px solid var(--qb-ok-line); color:var(--qb-ok);}
.recon-diff.bad{background:var(--qb-bad-bg); border:1px solid var(--qb-bad-line); color:var(--qb-bad);}
.recon-diff-n{font:600 24px/1.2 var(--qb-sans); font-variant-numeric:tabular-nums;}

/* ============================ 17. BANK WORKSPACE ========================= */
.bank-workbench{max-width:var(--content-max); min-width:0;}
.bank-health{display:grid; grid-template-columns:30px minmax(0,1fr) auto; align-items:center; gap:12px;
  margin:4px 0 14px; padding:11px 14px; background:var(--qb-warn-bg);
  border:1px solid var(--qb-warn-line); border-radius:var(--qb-r-card); color:var(--qb-text-strong);}
.bank-health p{margin:2px 0 0; color:var(--qb-text-muted); font-size:12px;}
.bank-health-icon{display:grid; place-items:center; width:24px; height:24px; border-radius:50%;
  background:var(--qb-warn); color:#FFF; font-weight:700;}
.bank-account-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; margin-bottom:14px; overflow:visible;}
.acct-cards{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.acct-card,.bank-account-card{
  appearance:none; text-align:left; color:inherit; font:inherit;
  padding:14px; min-width:0; cursor:pointer; border-radius:var(--qb-r-card);
}
.acct-card{min-width:280px;}
.acct-card.acct-on,.bank-account-card.acct-on{border:2px solid var(--qb-accent); box-shadow:none;}
.acct-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:2px; min-width:0;}
.bank-account-card .acct-head span{display:flex; flex-direction:column; gap:3px; min-width:0;}
.acct-card small,.bank-account-card small{color:var(--qb-text-muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.acct-bal{display:flex; gap:18px; margin-top:12px; flex-wrap:wrap;}
.acct-bal span{display:flex; flex-direction:column; font-size:14px; font-variant-numeric:tabular-nums;}
.acct-bal i{color:var(--qb-text-muted); font:500 11px/1.3 var(--qb-sans); font-style:normal; letter-spacing:.05em; text-transform:uppercase;}
.acct-review{margin-top:10px; padding-top:9px; border-top:1px solid var(--qb-divider); color:var(--qb-accent); font-size:12px; font-weight:500;}
.bank-queue-card{overflow:hidden;}
.bank-toolbar{margin:0; padding:12px 14px; background:var(--qb-inset); border:0; border-bottom:1px solid var(--qb-divider); border-radius:0;}
.bank-toolbar select{padding:0 28px 0 10px;}
.bank-search{min-width:260px;}
.bank-account-summary{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; min-width:0;}
.bank-table{overflow-x:auto;}
.bank-table .table-wrap{margin:0; border:0; border-radius:0; box-shadow:none; min-width:880px;}
.bank-table .tbl{width:100%;min-width:880px;table-layout:fixed}
.bank-table .tbl th:nth-child(1){width:104px}
.bank-table .tbl th:nth-child(2){width:21%}
.bank-table .tbl th:nth-child(3){width:124px}
.bank-table .tbl th:nth-child(4){width:27%}
.bank-table .tbl th:nth-child(5){width:190px}
.bank-table .tbl th:nth-child(6){width:112px}
.bank-table .tbl td{vertical-align:top; overflow-wrap:anywhere;}
.bank-row-primary,.bank-amount,.bank-evidence-stack,.bank-status-stack{
  display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0;
}
.bank-row-primary b,.bank-evidence-stack b{font-size:14px; font-weight:600; line-height:1.35; color:var(--qb-text-strong);}
.bank-row-primary span,.bank-evidence-stack span,.bank-amount span,.bank-status-stack span{color:var(--qb-text-muted); font-size:12px; line-height:1.35;}
.bank-row-primary small,.bank-evidence-stack small,.bank-status-stack small{color:var(--qb-text-muted); font-size:11px; line-height:1.35;}
.bank-amount{align-items:flex-end; white-space:nowrap;}
.bank-amount .num{font-size:14px; font-weight:600; color:var(--qb-text-strong);}
.bank-status-stack .badge{max-width:100%; white-space:normal; text-align:left; line-height:1.3;}
.bank-desc,.bank-suggestion{display:flex; flex-direction:column; gap:3px; min-width:0;}
.bank-desc b,.bank-suggestion b{font-size:14px; font-weight:500;}
.bank-desc span,.bank-suggestion span{color:var(--qb-text-muted); font-size:11px;}
.bank-suggestion i{font-style:normal; font-weight:600;}
.confidence-good{color:var(--qb-ok);} .confidence-low{color:var(--qb-warn);}
.bank-party{white-space:nowrap;}
.bank-footer{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:10px 14px; border-top:1px solid var(--qb-divider); color:var(--qb-text-muted); font-size:12px;}
.bank-footer button{border:0; background:transparent; color:var(--qb-link); font-weight:500; cursor:pointer; margin-left:14px;}
.bank-footer button:hover{text-decoration:underline;}
.bank-queue-empty{margin:16px; border-style:dashed;}

/* ============================ 18. REPORTS ================================ */
.reports-library{min-width:0;}
.reports-library .kpi-row{gap:10px; margin-bottom:24px;}
.reports-library .kpi{min-height:98px; padding:15px 17px;}
.reports-library .sec-title{padding-bottom:8px; border-bottom:1px solid var(--qb-divider);}
.report-period-chip{display:flex; flex-direction:column; gap:3px; min-width:190px; padding:10px 13px;}
.report-period-chip span{color:var(--qb-text-muted); font:600 11px/1.3 var(--qb-sans); letter-spacing:.07em; text-transform:uppercase;}
.report-period-chip b{color:var(--qb-text-strong); font-size:14px;}
.rep-grid,.rep-grid-featured{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px;}
.rep-card{display:flex; align-items:center; justify-content:space-between; gap:10px;
  min-width:0; min-height:66px; padding:12px 14px; border-radius:var(--qb-r-card);
  background:var(--qb-surface); border:1px solid var(--qb-border-soft); cursor:pointer;}
.rep-main{display:flex; flex-direction:column; gap:3px; min-width:0;}
.rep-name,.rep-table-name{min-width:0; max-width:100%; color:var(--qb-text-strong); font:500 14px/1.4 var(--qb-sans);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rep-desc{color:var(--qb-text-muted); font-size:12px; overflow-wrap:anywhere;}
.rep-tag{display:flex; align-items:center; gap:5px; flex:0 0 auto; min-width:0;}
.rep-tag .badge{max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rep-card:hover{background:var(--qb-canvas); border-color:var(--qb-border);}
.rep-card.rep-on{background:var(--qb-accent-tint); border:2px solid var(--qb-accent);}
.report-workbench{margin:14px 0; padding:16px;}
.report-workbench-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:12px; min-width:0;}
.report-preview-meta{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; justify-content:flex-end; min-width:0;}
.report-preview-meta span{display:flex; align-items:baseline; gap:5px; padding:6px 10px;
  border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-control); background:var(--qb-inset); white-space:nowrap;}
.report-preview-meta i{font-style:normal; font-size:12px; color:var(--qb-text-muted);}
.report-preview-meta b{font-size:14px; font-variant-numeric:tabular-nums;}
.report-preview-head{margin-bottom:12px; flex-wrap:wrap; gap:12px;}
.report-preview-titlewrap{min-width:0; flex:1 1 320px;}
.report-preview-crumb{color:var(--qb-text-muted); font-size:12px; margin-bottom:4px;}
.report-open-link{color:var(--qb-link); font-weight:500;}
.report-shelf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;}
.report-shelf-spacer{flex:1 1 20px;}
.report-shelf-note{color:var(--qb-text-muted); font-size:12px;}
.qbo-report-centerbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;}
.qbo-report-search{display:flex; align-items:center; min-width:220px; flex:1 1 260px;}
.qbo-report-search input{width:100%;}
.qbo-report-centerbar>button{min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong); font:500 14px/1 var(--qb-sans); cursor:pointer;}
.qbo-report-centerbar>button:hover{border-color:var(--qb-accent);}
.qbo-report-promo{display:flex;flex-direction:column;gap:7px;padding:16px;margin:12px 0;}
.qbo-report-promo>span{color:var(--qb-text-muted); font:600 12px/1.3 var(--qb-sans); letter-spacing:.06em;}
.qbo-report-promo>p{margin:0; color:var(--qb-text-muted);}
.qbo-report-promo>button{align-self:flex-start;}
.qbo-report-promo .qbo-toolgrid{margin:0;}
.qbo-report-builder{display:flex; flex-direction:column; gap:12px; margin-bottom:14px; min-width:0;}
.qbo-report-controls{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; padding:14px; align-items:end;}
.qbo-report-controls>label{display:flex; flex-direction:column; gap:5px; min-width:0;
  color:var(--qb-text-muted); font:500 12px/1.3 var(--qb-sans);}
.qbo-report-controls select,.qbo-report-controls>button,.qbo-report-controls .qbo-segment{width:100%; min-width:0; min-height:var(--qb-control-h);}
.qbo-report-controls>button{align-self:end; padding:0 10px; border:1px solid var(--qb-border);
  border-radius:var(--qb-r-control); background:var(--qb-surface); color:var(--qb-text-strong);
  font:500 14px/1.2 var(--qb-sans); white-space:normal; cursor:pointer;}
.qbo-report-controls .qbo-segment{display:inline-flex; align-self:end;}
.qbo-report-controls .qbo-segment button{flex:1 1 0; min-width:0; padding:0 6px; white-space:normal; font-size:14px;}
.qbo-report-toolpanel{padding:14px;}
.qbo-report-toolpanel>div:first-child{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.qbo-report-toolpanel>div:first-child span{color:var(--qb-text-muted); font-size:13px;}

/* ============================ 19. DASHBOARD ============================== */
.qbo-home-hero{display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  padding:18px 20px; margin:0 0 12px; border-radius:var(--qb-r-panel);}
.qbo-home-hero p{margin:7px 0 0; color:var(--qb-text-muted); max-width:760px;}
.qbo-home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:0 0 300px;align-self:stretch;align-content:end;}
.qbo-home-actions .btn{width:100%;justify-content:center;}
.qbo-home-actions .btn:last-child{grid-column:1/-1;}
.qbo-quicklinks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;}
.qbo-quicklinks button{appearance:none;display:inline-flex;align-items:center;gap:8px;
  min-height:var(--qb-control-h);padding:0 12px;border:1px solid var(--qb-border);
  border-radius:var(--qb-r-control);background:var(--qb-surface);color:var(--qb-text-strong);
  font:500 14px/1.2 var(--qb-sans);cursor:pointer;
  transition:border-color .12s ease,background .12s ease;}
.qbo-quicklinks button:hover{border-color:var(--qb-accent);background:var(--qb-canvas);}
.qbo-quicklinks button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.qbo-quicklinks i{font-style:normal;color:var(--qb-text-muted);font-size:15px;line-height:1;}

/* ============================ 20. EXPENSES =============================== */
.expense-toolbar{gap:10px;}
.expense-toolbar label{flex:0 1 auto; min-width:0;}
.expense-toolbar label>span{color:var(--qb-text-muted); font-size:12px; white-space:nowrap;}
.expense-shell-panel{margin:0 0 12px; padding:14px 16px;}
.expense-shell-panel>div:first-child{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
.expense-shell-panel>div:first-child b{color:var(--qb-text-strong); font-size:14px;}
.expense-shell-panel>div:first-child span{color:var(--qb-text-muted); font-size:13px;}
.expense-filter-evidence{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin-bottom:12px;}
.expense-filter-evidence label{display:flex; align-items:center; gap:8px; min-width:0; color:var(--qb-text-muted); font-size:13px;}
.expense-filter-evidence input[type=date],.expense-filter-evidence select{flex:1 1 auto; min-width:0;}
.expense-shell-actions{display:flex; gap:8px; flex-wrap:wrap;}
.expense-shell-actions>button{min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong); font:500 14px/1 var(--qb-sans); cursor:pointer;}
.expense-shell-actions>button:hover{border-color:var(--qb-accent);}
.ap-aging-head{align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:12px;}
.ap-aging-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; padding:0; border:0; background:transparent;}


/* ===========================================================================
   21. RESPONSIVE - one consolidated ladder: 1440 / 1280 / 1024 / 768 / 430 / 360
   Rule: the page never scrolls sideways. Wide tables scroll inside their own
   container; toolbars reflow into grids; nothing is clipped or unreachable.
   ========================================================================== */
.content>*{min-width:0; max-width:100%;}
@media(min-width:1800px){:root{--content-max:1680px;}}
@media(max-width:1440px){
  .content{padding:24px 28px 56px;}
  .top-right>.muted{display:none;}
  .topbar>.sw:first-of-type{max-width:360px;}
  .cmdk{max-width:200px;}
}
@media(max-width:1280px){
  :root{--nav-w:232px;}
  .content{padding:22px 24px 52px;}
  .cmdk{display:none;}
  .topbar>.sw:first-of-type{flex:1 1 auto; max-width:none;}
  .top-right{gap:8px;}
  .top-right .icon-btn:nth-of-type(1),.top-right .icon-btn:nth-of-type(2){display:none;}
  .user-chip{max-width:190px; min-width:0; overflow:hidden;}
  .user-nm{min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .user-nm .muted{display:none;}
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));}
  .qbo-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .todo-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .recon-model{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .recon-diff{grid-column:1/-1;}
  .split{grid-template-columns:minmax(240px,300px) minmax(0,1fr);}
  .bank-toolbar{flex-wrap:wrap;}
  .bank-search{flex:1 1 300px;}
  .bank-result-count{flex:1 1 100%; margin-left:0;}
  .bank-account-summary{align-items:flex-start;}
  .bank-summary-metrics{flex-wrap:wrap;}
  .bank-footer{align-items:flex-start; flex-direction:column;}
  .bank-table .table-wrap,.bank-table .tbl{min-width:820px}
  .table-journal-entries .tbl{min-width:1020px;}
}
@media(max-width:1024px){
  /* Tablet: the rail goes off-canvas and gains a reachable open/close pair. */
  .sidebar{position:fixed; top:0; left:0; z-index:32; transform:translateX(-100%);
    transition:transform .18s ease; box-shadow:var(--qb-shadow-strong);}
  .sidebar.mobile-open{transform:translateX(0);}
  .mobile-nav-close{
    display:inline-flex; align-items:center; justify-content:center; align-self:flex-end;
    margin:10px 12px 0; min-height:var(--qb-control-h-sm); padding:0 12px;
    border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
    background:var(--qb-surface); color:var(--qb-text-strong); font:500 13px/1 var(--qb-sans); cursor:pointer;
  }
  .mobile-nav-btn{
    display:inline-grid; place-items:center; flex:0 0 auto;
    width:var(--qb-control-h); height:var(--qb-control-h);
    border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
    background:var(--qb-surface); color:var(--qb-text-strong); font-size:17px; cursor:pointer;
  }
  .mobile-nav-scrim{display:block; position:fixed; inset:0; z-index:31; border:0;
    background:rgba(33,38,42,.40); cursor:default;}
  .split,.split.two,.two-col,.recon-model{grid-template-columns:minmax(0,1fr);}
  .recon-diff{grid-column:auto;}
  .sticky-card{position:static;}
  .stmt-wide{max-width:100%; padding:20px;}
  .newmenu{left:16px; right:16px; top:70px;}
}
@media(max-width:768px){
  .topbar{padding:0 14px; gap:8px;}
  .topbar>.sw:first-of-type{min-width:0!important; flex:1 1 auto;}
  .top-right{margin-left:auto; gap:6px;}
  .period-chip,.top-right>.muted,.user-nm{display:none;}
  .content{padding:18px 16px 44px;}
  .page-h{font-size:24px;}
  .page-top,.accounting-page-head,.report-workbench-head,.card-head,.gl-drill-head,
  .source-doc-hero,.ap-aging-head,.report-preview-head,.qbe-head,.trace-head{
    align-items:flex-start; flex-direction:column; gap:12px;
  }
  .accounting-page-head .row-acts{align-self:stretch; flex-wrap:wrap;}
  .report-period-chip{width:100%;}
  .result-count,.bank-result-count{margin-left:0;}
  .accounting-filter-bar,.expense-filter-evidence,.qbo-report-controls{grid-template-columns:minmax(0,1fr);}
  .accounting-filter-bar label,.accounting-filter-bar select{width:100%;}
  .kpi-row,.qbo-grid,.rep-grid,.rep-grid-featured,.todo-grid,.kv-grid,.qbo-toolgrid,
  .qbo-drill-summary,.gl-overview-strip,.detail-grid,.bank-account-strip{grid-template-columns:minmax(0,1fr);}
  .trace-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .trace-grid span{white-space:normal; overflow-wrap:anywhere;}
  .tabs,.seg,.je-queue-chips,.bank-queue-tabs{max-width:100%; overflow-x:auto;}
  .qbo-report-previewbar>button{flex:1 1 auto;}
  .bank-queue-tabs{margin:12px 12px 0;}
  .qbo-home-hero{align-items:flex-start; flex-direction:column; padding:16px;}
  .qbo-home-actions{width:100%; flex-basis:auto; align-self:auto;}
  .drawer{width:100vw!important;}
  .badge{max-width:100%; overflow:hidden; text-overflow:ellipsis;}
  .stmt-row{min-width:0;}
  .stmt-row>span{min-width:0; overflow-wrap:anywhere;}
  .acct-card{min-width:0; width:100%;}
  .acct-cards{flex-direction:column;}
  .filter-bar,.expense-toolbar,.filterbar,.bank-toolbar{align-items:stretch; flex-direction:column;}
  .filter-bar label,.expense-toolbar label,.filterbar label{width:100%;}
  .filter-bar select,.expense-toolbar select,.filterbar select,.filterbar input{width:100%; min-width:0;}
  .expense-search,.je-search,.bank-search,.qbo-report-search{max-width:none; width:100%; flex:1 1 auto;}
  /* Below tablet a header may wrap: an unwrappable header row is the main
     cause of a page-level sideways scroll on a table without a min-width. */
  .tbl th{white-space:normal; word-break:normal;}
  .tbl th,.tbl td{overflow-wrap:anywhere;}
  .table-wrap{max-height:none;}
}
@media(max-width:720px){.report-workbench-head{flex-direction:column;}.report-preview-meta{justify-content:flex-start;}}
@media(max-width:600px){
  .qbo-home-hero{padding:16px;}
  .qbo-home-actions{grid-template-columns:1fr;}
  .qbo-home-actions .btn:last-child{grid-column:auto;}
  .qbo-quicklinks{gap:6px;}
  .qbo-quicklinks button{flex:1 1 100%; justify-content:space-between;}
  .report-shelf-spacer{display:none;}
  .report-shelf-note{width:100%;}
  .qbo-report-centerbar{align-items:stretch;}
  .qbo-report-centerbar>button{flex:1 1 auto;}
}
@media(max-width:430px){
  .content{padding:14px 12px 40px;}
  .page-h{font-size:21px;}
  .page-subtitle{font-size:13px;}
  .topbar{height:54px; padding:0 10px;}
  .topbar .icon-btn:nth-of-type(n+3){display:none;}
  .sidebar{width:min(88vw,300px); flex-basis:min(88vw,300px);}
  .trace-grid{grid-template-columns:minmax(0,1fr);}
  .row-acts,.je-actions,.qbe-actionbar,.drawer-foot,.expense-shell-actions{flex-direction:column; align-items:stretch;}
  .row-acts>.btn,.je-actions>.btn,.qbe-actionbar>.btn,.drawer-foot>.btn,.expense-shell-actions>button{width:100%;}
  .pickup-sum,.acct-bal,.qbe-totals,.tb-tot{gap:10px; flex-direction:column;}
  .login-card{padding:22px 18px;}
  .card,.kpi,.qbo-card,.recon-col,.split-right,.trace-panel,.report-workbench{padding:14px;}
  .stmt-wide{padding:16px 14px;}
  .tbl th,.tbl td{padding:8px 10px;}
  .tbl td:first-child,.tbl th:first-child{padding-left:12px;}
  .tbl td:last-child,.tbl th:last-child{padding-right:12px;}
}
@media(max-width:360px){
  .content{padding:12px 10px 36px;}
  .page-h{font-size:19px;}
  .grid-bar{flex-direction:column; align-items:stretch;}
  .grid-search{width:100%; min-width:0;}
  .grid-count{margin-left:0;}
  .tab,.seg>button,.je-queue-chips>button,.bank-queue-tabs>button{padding:0 10px; font-size:14px;}
  .badge{font-size:10px;}
  .newmenu{gap:16px; padding:14px 16px;}
}

/* ===========================================================================
   22. DARK MODE - the tokens carry it; these rules only repaint the few
   surfaces that need an explicit pairing.
   ========================================================================== */
body.dark{background:var(--qb-canvas); color:var(--qb-text);}
body.dark .topbar,body.dark .sidebar{background:var(--qb-surface); border-color:var(--qb-border-soft);}
body.dark .card,body.dark .kpi,body.dark .qbo-card,body.dark .acct-card,body.dark .recon-col,
body.dark .appr-row,body.dark .filter-bar,body.dark .expense-toolbar,body.dark .filterbar,
body.dark .login-card,body.dark .stmt,body.dark .stmt-wide,body.dark .table-wrap,

body.dark .qbe-document,body.dark .report-drill-panel,body.dark .report-workbench,
body.dark .qbo-home-hero,body.dark .qbo-report-promo,body.dark .qbo-report-controls,
body.dark .qbo-report-toolpanel,body.dark .bank-queue-card,body.dark .expense-shell-panel,
body.dark .source-doc-panel,body.dark .source-doc-shell,body.dark .sticky-card,
body.dark .report-period-chip,body.dark .rep-card,body.dark .todo-card,body.dark .todo-item,
body.dark .drawer,body.dark .pal,body.dark .newmenu{

}

body.dark .topbar select,body.dark .cmdk,body.dark .icon-btn,body.dark .user-chip,
body.dark .period-chip,body.dark .btn,body.dark .grid-tool,body.dark .chip,
body.dark input,body.dark select,body.dark textarea,body.dark .grid-search,
body.dark .step-chip:not(.step-on),body.dark .mo-chip:not(.mo-on),
body.dark .qbo-quicklinks button,body.dark .qbo-report-centerbar>button,
body.dark .qbo-report-controls>button,body.dark .expense-shell-actions>button,
body.dark .crumb,body.dark .qbo-report-back>button{

}
body.dark .btn-primary{background:var(--qb-brand); color:var(--qb-brand-fg); border:0;}

body.dark .tbl th{background:var(--qb-surface); border-color:var(--qb-border-alt); color:var(--qb-text-strong);}
body.dark .tbl td{border-color:var(--qb-border-alt); color:var(--qb-text);}
body.dark .tbl tbody tr:hover,body.dark .tr-hi{background:var(--qb-raised); box-shadow:none;}

body.dark .kv-grid>div,body.dark .qbo-toolgrid>span,body.dark .qbo-toolgrid>div,
body.dark .qbo-drill-summary>span,body.dark .gl-overview-strip>span,body.dark .detail-grid>div,
body.dark .source-doc-kv>div,body.dark .bank-summary-metrics>span,body.dark .src-grid span,
body.dark .report-preview-meta span,body.dark .bank-toolbar,body.dark .qbe-document .qbe-head,
body.dark .qbe-document .qbe-footbar,body.dark .qbe-document .qbe-below,body.dark .qbe-document .qbe-memo,

}

/* Bank queue segmented control, account tile pill, and non-executable action chips.
   Elevation stays tight and hover is a background tint only - no lift. */
.bank-queue-seg-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid #e2e9ed;}
.bank-queue-seg{display:inline-flex;gap:2px;padding:2px;background:#e2e9ed;border-radius:6px;}
.bank-queue-seg-item{appearance:none;border:0;height:32px;padding:0 16px;border-radius:5px;background:transparent;color:#4c555b;font:400 16px/1.2 inherit;cursor:pointer;white-space:nowrap;}
.bank-queue-seg-item:hover{background:rgba(255,255,255,.55);}
.bank-queue-seg-on,.bank-queue-seg-on:hover{background:#fff;color:#21262a;box-shadow:0 1px 4px rgba(76,85,91,.2);}
.bank-queue-seg-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.bank-queue-seg-note{color:var(--text-2);font-size:11px;flex:1 1 220px;min-width:0;}
.bank-account-pill{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;margin-left:auto;border-radius:10px;background:#e2e9ed;color:#21262a;font-size:11px;font-weight:600;}
.bank-pagination-range{color:var(--text-2);font-size:12px;margin-right:auto;font-variant-numeric:tabular-nums;}
.bank-action-availability{padding:12px 14px;border-top:1px solid #e2e9ed;}
.bank-action-availability>b{font-size:12px;}
.bank-action-list{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;padding:0;}
.bank-action-item,.bank-action-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px dashed #c3ced5;border-radius:6px;background:transparent;color:var(--text-2);cursor:default;}
.bank-action-item{flex-direction:column;align-items:flex-start;gap:2px;}
.bank-action-name{font-weight:600;color:var(--text-1);font-size:12px;}
.bank-action-state{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.bank-action-why{font-size:11px;}
.recon-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0;}
