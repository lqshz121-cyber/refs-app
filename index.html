<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>REFS · WanBridge Real Estate Financial System</title>
<style>
/* ===========================================================================
   REFS UI SYSTEM - single authoritative layer
   Primitives measured from a live QuickBooks Online session on 2026-08-05 and
   recorded in docs/QB-DESIGN-TOKENS.md. This is an independent implementation:
   no QuickBooks CSS, markup, icon or font asset is copied, and the proprietary
   "Avenir Next forINTUIT" face is deliberately NOT referenced.
   Every legacy token name below is an alias onto this one system, so no page
   keeps a private palette. Do not append a new override layer - edit here.
   ========================================================================== */
:root{
  /* The user agent renders form controls, scrollbars and the <select> popup
     from system colours. Declaring the scheme is what stops an unclassed
     <button> falling back to the light `buttonface` while the app is dark. */
  color-scheme:light;
  /* The dark palette's two first-paint values live here, not only on body.dark,
     because the `prefers-color-scheme` rule at the end of this section runs
     before the bundle has had a chance to put a class on <body>. One source of
     truth, so the pre-boot frame can never disagree with the booted app. */
  --qb-dark-canvas:#0F1418;
  --qb-dark-text:#D7DDE1;
  /* neutrals */
  --qb-canvas:#F4F5F8;
  --qb-surface:#FFFFFF;
  --qb-raised:#FFFFFF;
  --qb-inset:#F7F8FA;
  --qb-text:#393A3D;
  --qb-text-strong:#21262A;
  --qb-text-muted:#4C555B;
  --qb-text-faint:#676F74;
  /* four distinct borders, as QB uses them */
  --qb-border:#C3CED5;       /* default control border */
  --qb-border-soft:#D4D7DC;  /* card border */
  --qb-border-alt:#DDDDDD;   /* table rules */
  --qb-divider:#E2E9ED;      /* panel dividers + segmented track */
  /* brand: --qb-brand is a fill, --qb-accent is ink/border on canvas */
  --qb-brand:#003E31;
  --qb-brand-fg:#FFFFFF;
  --qb-brand-hover:#002B22;
  --qb-accent:#003E31;
  --qb-accent-tint:#EDF2F0;
  --qb-link:#205EA3;
  --qb-info:#0097E6;
  /* status: text colors meet 4.5:1 on their own tint */
  --qb-ok:#0F6B45;      --qb-ok-bg:#E3F1E9;   --qb-ok-line:#9CC9B4;
  --qb-warn:#7A5200;    --qb-warn-bg:#FBF0D9; --qb-warn-line:#DFC48A;
  --qb-bad:#A82727;     --qb-bad-bg:#FBE8E8;  --qb-bad-line:#E0A9A9;
  /* radii - measured frequency: 6 control / 8 card / 9999 pill / 4 chip / 12 panel */
  --qb-r-control:6px;
  --qb-r-card:8px;
  --qb-r-pill:9999px;
  --qb-r-chip:4px;
  --qb-r-panel:12px;
  /* elevation - tight and low; borders do the separation work */
  --qb-shadow-card:0 1px 4px rgba(76,85,91,.20);
  --qb-shadow-strong:0 1px 4px rgba(33,38,42,.60);
  --qb-scrim:rgba(15,20,24,.32);
  --qb-shadow-stick:-2px 0 2px rgba(0,0,0,.15);
  /* metrics */
  --qb-control-h:36px;
  --qb-control-h-sm:30px;
  --qb-focus-ring:0 0 0 3px rgba(0,62,49,.22);
  --qb-sans:"Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --qb-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  /* ---- round 2: structural tokens (docs/QB-SHELL-STRUCTURE.md) ---- */
  --qb-hair:0.8px;            /* measured hairline; 1px is reserved for controls */
  --qb-rail-bg:#F0F4F6;       /* light icon rail - replaces the legacy dark column */
  --qb-rail-w:74px;
  --qb-rail-item-w:68px;
  --qb-rail-item-h:64px;
  --qb-rail-glyph:44px;
  --qb-navpanel-w:236px;
  --qb-navrow-h:52px;
  --qb-chip-border:#D5DEE3;   /* pill chip / action pill outline */
  --qb-chip-h:48px;
  --qb-pill-h:44px;
  --qb-badge-ink:#04263A;     /* dark circular icon badge behind a light glyph */
  --qb-badge-glyph:#5FE3B0;
  /* Navigation family accents: distinct enough to orient the rail, restrained
     enough that accounting states still own the semantic colours. */
  --nav-0-hover:#E1F2EC; --nav-0-ink:#006B50; --nav-0-active:#006B50; --nav-0-active-fg:#FFFFFF;
  --nav-1-hover:#E5F0FA; --nav-1-ink:#1A5B93; --nav-1-active:#1A5B93; --nav-1-active-fg:#FFFFFF;
  --nav-2-hover:#EEE8F8; --nav-2-ink:#634895; --nav-2-active:#634895; --nav-2-active-fg:#FFFFFF;
  --nav-3-hover:#FFF0DD; --nav-3-ink:#8A5A00; --nav-3-active:#8A5A00; --nav-3-active-fg:#FFFFFF;
  --nav-4-hover:#E1F1F2; --nav-4-ink:#1F6570; --nav-4-active:#1F6570; --nav-4-active-fg:#FFFFFF;
  --nav-5-hover:#F9E6EA; --nav-5-ink:#8F3D4B; --nav-5-active:#8F3D4B; --nav-5-active-fg:#FFFFFF;
  --qb-greet-side:264px;      /* greeting row side columns keep the title centered */
  /* ---- round 3: motion. QB has no lift, no spring and no parallax; the only
     honest motion is a short ease-out on paint properties. Two durations,
     one easing curve, and transform is deliberately absent from the list. ---- */
  --qb-dur-1:120ms;           /* controls, rows, nav - must never outlast a click */
  --qb-dur-2:180ms;           /* meters and progress fills */
  --qb-ease-out:cubic-bezier(.22,.61,.36,1);
  /* ---- round 3: skeletons. A skeleton is the same geometry as the real row,
     so nothing jumps when the data arrives. ---- */
  --qb-skel:#E7ECEF;
  --qb-skel-hi:#F3F6F8;
  --nav-w:calc(var(--qb-rail-w) + var(--qb-navpanel-w));
  --content-max:1560px;
  --gap:16px;

  /* ---- compatibility aliases: legacy names resolve to the system above ---- */
  --bg-canvas:var(--qb-canvas);
  --bg-surface:var(--qb-surface);
  --bg-elev:var(--qb-inset);
  --text-1:var(--qb-text-strong);
  --text-2:var(--qb-text-muted);
  --text-3:var(--qb-text-faint);
  --brand:var(--qb-accent);
  --brand-ink:var(--qb-accent);
  --accent:var(--qb-accent);
  --ok:var(--qb-ok);
  --warn:var(--qb-warn);
  --bad:var(--qb-bad);
  --divider:var(--qb-border-soft);
  --shadow:none;
  --shadow-lg:var(--qb-shadow-card);
  --radius:var(--qb-r-card);
  --sans:var(--qb-sans);
  --mono:var(--qb-mono);
  --focus-ring:var(--qb-focus-ring);
}
/* Dark-mode parity: every token above is redefined, nothing falls through. */
body.dark{
  color-scheme:dark;
  --qb-canvas:var(--qb-dark-canvas);
  --qb-surface:#171D22;
  --qb-raised:#1E252B;
  --qb-inset:#1B2227;
  --qb-text:var(--qb-dark-text);
  --qb-text-strong:#F1F4F6;
  --qb-text-muted:#9EAAB1;
  --qb-text-faint:#8B979E;
  /* WCAG 1.4.11: a control's boundary needs 3:1 against what is behind it.
     The old #404C55 reached 1.93:1 on --qb-surface and 1.76:1 on --qb-raised,
     so every input, select and default button lost its edge in dark mode.
     #74818B clears 3:1 against canvas, surface, raised, inset, rail and the
     segmented track. --qb-border-soft / -alt / --qb-divider stay quiet: they
     rule table rows and split panels, which is decoration, not a boundary. */
  --qb-border:#74818B;
  --qb-border-soft:#36424A;
  --qb-border-alt:#2F3A41;
  --qb-divider:#28323A;
  --qb-brand:#3FA982;
  --qb-brand-fg:#05231A;
  --qb-brand-hover:#4FBE94;
  --qb-accent:#7BD4AF;
  --qb-accent-tint:#14302A;
  --qb-link:#8DBBEC;
  --qb-info:#5FC6F2;
  --qb-ok:#79D3A6;      --qb-ok-bg:#123326;   --qb-ok-line:#2C6449;
  --qb-warn:#E8BE72;    --qb-warn-bg:#3A2C0F; --qb-warn-line:#6E5A28;
  --qb-bad:#F0999C;     --qb-bad-bg:#3B1E20;  --qb-bad-line:#6D3A3D;
  --qb-shadow-card:0 1px 4px rgba(0,0,0,.55);
  --qb-shadow-strong:0 2px 8px rgba(0,0,0,.70);
  --qb-scrim:rgba(0,0,0,.56);
  --qb-shadow-stick:-2px 0 2px rgba(0,0,0,.45);
  --qb-focus-ring:0 0 0 3px rgba(123,212,175,.28);
  /* round 2 structural tokens keep full dark-mode parity */
  --qb-rail-bg:#12181D;
  --qb-chip-border:#6E7B85;   /* 3.57:1 on --qb-raised, 3.91:1 on --qb-surface */
  --qb-badge-ink:#0A2B22;
  --qb-badge-glyph:#6FE0B4;
  --nav-0-hover:#163D32; --nav-0-ink:#8BE2B9; --nav-0-active:#2E9A72; --nav-0-active-fg:#06271C;
  --nav-1-hover:#17334A; --nav-1-ink:#9DCCF4; --nav-1-active:#4C8DCA; --nav-1-active-fg:#071E33;
  --nav-2-hover:#2E2446; --nav-2-ink:#CDBCF0; --nav-2-active:#9878C9; --nav-2-active-fg:#201331;
  --nav-3-hover:#40310E; --nav-3-ink:#F0C978; --nav-3-active:#C99131; --nav-3-active-fg:#2B1A00;
  --nav-4-hover:#14363B; --nav-4-ink:#97D8DF; --nav-4-active:#4B9AA3; --nav-4-active-fg:#08292D;
  --nav-5-hover:#3D2027; --nav-5-ink:#F2ADB8; --nav-5-active:#BD6979; --nav-5-active-fg:#2D1016;
  /* round 3 tokens keep full dark-mode parity; the motion tokens are
     colour-free so they are inherited unchanged. */
  --qb-skel:#232B31;
  --qb-skel-hi:#2E383F;
}
/* ---- Operating-system preference ------------------------------------------
   The app used to ignore `prefers-color-scheme` entirely: a machine set to dark
   got the light build until the user found the moon glyph.
   The whole palette is still switched from one place - the `dark` class that
   src/theme-preference.js puts on <body> at boot from the OS setting, and that
   the ☾ control overrules for good once the user has pressed it. This block
   exists only for the frame before the bundle runs, and it declares just the
   two values that frame can show, both read from the same tokens body.dark
   uses, so a pre-boot frame cannot drift from the booted app.
   `body:not(.light)` is the escape hatch: a user on a dark machine who has
   chosen light gets `class="light"` and this rule stands down. */
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; }
  html{ background:var(--qb-dark-canvas); }
  body:not(.light){ background:var(--qb-dark-canvas); color:var(--qb-dark-text); }
}
/* `inert` is how the off-canvas drawer leaves the tab order and the
   accessibility tree without losing its slide transition. Modern engines
   already suppress pointer events on an inert subtree; this states it so the
   closed drawer can never eat a click on the page behind it. */
[inert]{ pointer-events:none; user-select:none; }


/* ============================ 1. BASE ==================================== */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--qb-sans);
  background:var(--qb-canvas);
  color:var(--qb-text);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,h5{color:var(--qb-text-strong); font-weight:600; margin:0;}
h3{font-size:16px;} h4{font-size:16px; margin:16px 0 6px;} h5{font-size:14px;}
p{margin:0 0 10px;}
a,.link{color:var(--qb-link); font-weight:500; text-decoration:none;}
a:hover,.link:hover{text-decoration:underline;}
code,.mono{font-family:var(--qb-mono); font-size:12px; background:var(--qb-inset);
  padding:1px 5px; border-radius:var(--qb-r-chip); color:var(--qb-text-strong);}
img,svg,canvas{max-width:100%;}
/* ---- The user-agent button, tokenised ---------------------------------------
   An unclassed <button> is painted from system colours: `buttonface`, which is
   #EFEFEF in a light user agent. In dark mode the app then wrote a dark-theme
   colour onto that light chip - --qb-text on #EFEFEF measures 1.19:1, far below
   the 4.5:1 body-text floor. `color-scheme` above fixes the user agent's own
   idea of the scheme; these three declarations make the answer explicit and
   theme-independent instead of leaving it to system colours.
   Only colour, background-colour and border-colour are set, at element
   specificity (0,0,1), so every class rule in this stylesheet still wins and
   any button that deliberately declares `border:0` or a transparent
   background keeps exactly the look it has today. ------------------------- */
button,input[type="button"],input[type="submit"],input[type="reset"]{
  color:var(--qb-text-strong); background-color:var(--qb-inset); border-color:var(--qb-border);
}
/* One visible focus treatment everywhere: 2px brand outline, small offset. */
:focus{outline:none;}
:focus-visible{outline:2px solid var(--qb-accent); outline-offset:1px; border-radius:var(--qb-r-chip);}
::selection{background:var(--qb-accent-tint); color:var(--qb-text-strong);}
*{scrollbar-width:thin; scrollbar-color:var(--qb-border) transparent;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--qb-border); border-radius:5px; border:2px solid transparent; background-clip:content-box;}
/* ---- One motion contract (round 3) ------------------------------------------
   QuickBooks moves almost nothing. What it does move, it moves briefly and only
   in paint: background, border, colour, opacity, box-shadow. `transform` is
   deliberately absent from every transition list below, so no row can slide out
   from under a cursor that is already committed to a click, and nothing springs,
   bounces or parallaxes. 120ms is shorter than the ~150ms a deliberate click
   takes, so the feedback lands before the press does. -------------------------- */
.btn,.grid-tool,.crumb,.icon-btn,.new-btn,.link-btn,.chip,.tab,.seg>button,
.nav-item,.nav-group-h,.rail-glyph,.qbo-quicklinks button,.qb-actionrow .btn,
.card-hover,.todo-item,.qbo-card,.acct-card,.rep-card,.je-item,.stmt-row,
.bank-queue-seg-item,.th-sort,.report-drill,.qbo-report-back>button,
.expense-shell-actions>button,.tbl tbody tr,
input,select,textarea{
  transition:
    background-color var(--qb-dur-1) var(--qb-ease-out),
    border-color var(--qb-dur-1) var(--qb-ease-out),
    color var(--qb-dur-1) var(--qb-ease-out),
    box-shadow var(--qb-dur-1) var(--qb-ease-out),
    opacity var(--qb-dur-1) var(--qb-ease-out);
}
/* The guard from round 2, restated as a hard rule: motion never uses layout or
   transform properties, so a transition can never move a hit target. */
*{transition-property:background-color,border-color,color,box-shadow,opacity,fill,stroke,outline-color,width;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important; animation-iteration-count:1!important;
    transition-duration:.001ms!important; scroll-behavior:auto!important;
  }
  /* A shimmering skeleton is the one animation that must also lose its
     gradient, not just its duration - otherwise it freezes mid-sweep. */
  .skel,.skel-cell{background-image:none!important; background-color:var(--qb-skel)!important;}
}
.muted{color:var(--qb-text-muted);}
.sm{font-size:12px;}
.warn-txt{color:var(--qb-warn); font-weight:600;}
.ok-txt{color:var(--qb-ok); font-weight:600;}
.bad{color:var(--qb-bad);}
.ok{color:var(--qb-ok);}
.cell-main{font-weight:500; color:var(--qb-text-strong); line-height:1.4;}
.num{font-family:var(--qb-sans); font-variant-numeric:tabular-nums lining-nums; white-space:nowrap;}
.num-neg{color:var(--qb-bad);} .num-bold{font-weight:600; color:var(--qb-text-strong);}
/* Three distinct numeric readings, so a reader never has to guess (round 3):
   a value ($1,204.00), a real zero ($0.00, quieter but still a figure), and
   the absence of a figure (an en dash that is never mistaken for a balance). */
.num-zero{color:var(--qb-text-muted);}
/* An emphasised figure stays emphasised even when it is zero - a total of
   exactly $0.00 is a result, not a quiet cell. */
.num-bold.num-zero{color:var(--qb-text-strong);}
.num-nil{color:var(--qb-text-faint); font-weight:400; letter-spacing:.04em;}
.bal{font-weight:600; font-size:13px;} .bal-ok{color:var(--qb-ok);} .bal-bad{color:var(--qb-bad);}
.acct-code{font-variant-numeric:tabular-nums; color:var(--qb-text-muted); font-size:12px; margin-right:4px;}
.row-acts{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.stack{display:flex; flex-direction:column; gap:8px; min-width:0;}

/* ============================ 2. APP SHELL =============================== */
/* The navigation is flush left; everything else sits in a rounded white shell
   inset 6px from the canvas (docs/QB-SHELL-STRUCTURE.md section 1). */
.app{display:flex; min-height:100vh; background:var(--qb-canvas);}
.main{
  flex:1; min-width:0; display:flex; flex-direction:column;
  margin:6px 6px 6px 0; background:var(--qb-surface);
  border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-panel);
}
.content{width:100%; max-width:var(--content-max); margin:0 auto; padding:20px 32px 64px; min-width:0; background:transparent;}
.full-bleed{max-width:none; min-width:0;}
.focused{max-width:1280px; margin:0 auto; min-width:0;}

/* ---- Left navigation: 74px light icon rail + white second-level panel ------
   Structure measured in docs/QB-SHELL-STRUCTURE.md section 1. The rail carries
   the groups; the panel lists the pages of every group that is currently open.
   Several groups may be open at once - that is a REFS behavior contract, so the
   panel stacks them rather than showing only one. ------------------------- */
.sidebar{
  display:flex; flex-direction:row; align-items:stretch;
  width:var(--nav-w); flex:0 0 var(--nav-w);
  position:sticky; top:0; height:100vh; overflow:hidden; padding:0;
  background:var(--qb-surface); border-right:var(--qb-hair) solid var(--qb-divider);
}
.authoritative-nav-status{margin-left:auto; flex:0 0 auto; padding:2px 5px; border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-pill); font-size:10px; font-weight:700; line-height:1.2;}
.authoritative-nav-status-ready{border-color:var(--qb-ok-line); background:var(--qb-ok-bg); color:var(--qb-ok);}
.authoritative-nav-status-blocked{border-color:var(--qb-border-soft); background:var(--qb-inset); color:var(--qb-text-faint);}

/* Production adopts the complete REFS shell's two-panel geometry verbatim:
   a 74px rail and 236px page panel. Data stays API/OIDC-owned. */
.authoritative-app .authoritative-sidebar{flex-direction:row; align-items:stretch;}
.authoritative-app .authoritative-sidebar .nav-rail{display:flex; flex:0 0 var(--qb-rail-w); width:var(--qb-rail-w);}
.authoritative-app .authoritative-sidebar .nav-rail .nav-group-h{
  flex-direction:column; justify-content:flex-start; gap:2px;
  width:var(--qb-rail-item-w); height:var(--qb-rail-item-h); min-height:0;
  margin:0 auto; padding:2px 2px 0; border-radius:var(--qb-r-card); text-align:center;
}
.authoritative-app .authoritative-sidebar .nav-rail .rail-glyph{display:grid; width:var(--qb-rail-glyph); height:var(--qb-rail-glyph);}
.authoritative-app .authoritative-sidebar .nav-rail .rail-label{display:block;}
.authoritative-app .authoritative-sidebar .nav-panel{display:flex; flex:1 1 auto; min-width:0;}
.authoritative-app .authoritative-sidebar .nav-panel nav{width:100%;}
.authoritative-app .authoritative-sidebar .nav-panel .nav-group-items{display:block; width:100%; padding:0 0 4px;}
.authoritative-app .authoritative-sidebar .nav-panel .nav-item{width:100%; min-height:var(--qb-navrow-h); margin:0; padding:0 14px;}
.authoritative-app .authoritative-sidebar .nav-panel .nav-item-label{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.35;}
.authoritative-app .authoritative-sidebar .nav-panel .authoritative-nav-status{margin-left:auto;}
.authoritative-app .authoritative-sidebar .nav-panel .nav-chev{display:block;}
.authoritative-new-disabled{opacity:.6; cursor:not-allowed;}
/* Exact presentation structure from the complete REFS shell: scope control,
   period chip, actions and user chip stay in one topbar.  Move navigation off
   canvas before a narrow desktop can compress accounting evidence. */
.authoritative-demo-topbar .authoritative-shell-scope{display:flex; flex:1 1 340px; min-width:200px; max-width:420px;}
.authoritative-demo-topbar .authoritative-shell-select{display:flex; align-items:center; width:100%; min-width:0; height:var(--qb-control-h); padding:0 34px 0 12px; overflow:hidden; border:1px solid var(--qb-border); border-radius:var(--qb-r-control); background:var(--qb-surface); color:var(--qb-text-strong); font-size:13px; font-weight:500; text-overflow:ellipsis; white-space:nowrap; position:relative;}
.authoritative-demo-topbar .authoritative-shell-select::after{content:'⌄'; position:absolute; right:12px; color:var(--qb-text-muted); font-size:18px;}
.authoritative-demo-topbar .authoritative-top-actions{margin-left:auto;}
@media (max-width:1180px) and (min-width:769px){
  .authoritative-app .sidebar{position:fixed; top:0; left:0; z-index:32; transform:translateX(-100%); transition:transform var(--qb-dur-2) var(--qb-ease-out); box-shadow:var(--qb-shadow-strong);}
  .authoritative-app .sidebar.mobile-open{transform:translateX(0);}
  .authoritative-app .mobile-nav-btn{display:inline-grid; place-items:center; flex:0 0 auto;}
  .authoritative-app .mobile-nav-scrim{display:block; position:fixed; inset:0; z-index:31; border:0; background:var(--qb-scrim);}
  .authoritative-app .main{margin-left:6px;}
}

/* Authoritative page pattern. The parent workspace supplies all figures from
   authenticated API reads; this layer owns presentation only. */
.authoritative-page{min-width:0;}
.authoritative-page-header{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; padding:4px 0 20px; border-bottom:var(--qb-hair) solid var(--qb-divider);}
.authoritative-page-header h1{margin:2px 0 7px;}
.authoritative-eyebrow{margin:0; color:var(--qb-text-muted); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;}
.authoritative-overview-hero{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding:4px 0 22px; border-bottom:var(--qb-hair) solid var(--qb-divider);}
.authoritative-overview-hero h1{margin:2px 0 7px;}
.authoritative-overview-hero-status{display:flex; flex:0 0 auto; flex-direction:column; align-items:flex-end; gap:8px;}
.authoritative-overview-hero-note{color:var(--qb-text-muted); font-size:12px; font-weight:600;}
.authoritative-overview-scope{display:grid; grid-template-columns:auto minmax(120px,.9fr) minmax(120px,.9fr) minmax(220px,1.8fr); align-items:center; gap:16px; margin:18px 0 0; padding:13px 16px; border:var(--qb-hair) solid var(--qb-border-soft); border-radius:var(--qb-r-card); background:var(--qb-surface); box-shadow:var(--qb-shadow-card);}
.authoritative-overview-scope-mark{display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--qb-brand); color:var(--qb-brand-fg); font:800 13px/1 var(--qb-sans);}
.authoritative-overview-scope div{display:grid; gap:2px; min-width:0;}
.authoritative-overview-scope small{color:var(--qb-text-muted); font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;}
.authoritative-overview-scope strong{overflow-wrap:anywhere; color:var(--qb-text-strong); font-size:13px; line-height:1.3;}
.authoritative-overview-scope p{margin:0; color:var(--qb-text-muted); font-size:12px; line-height:1.45;}
.authoritative-overview-summary{display:grid; grid-template-columns:minmax(220px,.8fr) minmax(0,1.6fr); align-items:center; gap:24px; margin:20px 0 30px; padding:20px; border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-card); background:linear-gradient(120deg,var(--qb-accent-tint),var(--qb-surface) 56%); box-shadow:var(--qb-shadow-card);}
.authoritative-overview-summary>div{display:grid; gap:2px;}
.authoritative-overview-summary-kicker{color:var(--qb-text-muted); font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;}
.authoritative-overview-summary strong{color:var(--qb-text-strong); font-size:38px; line-height:1;}
.authoritative-overview-summary span:last-child{color:var(--qb-text-muted); font-size:13px;}
.authoritative-overview-summary p{max-width:620px; margin:0; color:var(--qb-text-muted); font-size:14px; line-height:1.55;}
.authoritative-overview-section-heading{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:4px;}
.authoritative-overview-section-heading h2{margin:3px 0 0; font-size:20px;}
.authoritative-overview-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:16px;}
.authoritative-overview-card{display:flex; flex-direction:column; align-items:flex-start; min-width:0; min-height:154px; padding:18px; text-align:left; border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-card); background:var(--qb-surface); box-shadow:var(--qb-shadow-card); cursor:pointer;}
.authoritative-overview-card:hover{background:var(--qb-accent-tint); border-color:var(--qb-accent);}
.authoritative-overview-card-eyebrow{color:var(--qb-text-muted); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;}
.authoritative-overview-card-label{color:var(--qb-text-strong); font-size:14px; font-weight:700;}
.authoritative-overview-card strong{margin-top:12px; color:var(--qb-text-strong); font-size:34px; line-height:1;}
.authoritative-overview-card-hint{margin-top:auto; color:var(--qb-link); font-size:12px; font-weight:600;}
.authoritative-overview-empty{display:flex; flex-wrap:wrap; align-items:center; gap:7px 12px; margin-top:14px; padding:13px 15px; border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-control); background:var(--qb-surface-subtle); color:var(--qb-text-muted); font-size:13px; line-height:1.45;}
.authoritative-overview-empty strong{color:var(--qb-text-strong);}
.authoritative-overview-workspaces{margin-top:34px;}
.authoritative-overview-actions{display:flex; align-items:center; justify-content:space-between; gap:20px; margin:28px 0 0; padding:18px 20px; border:var(--qb-hair) solid var(--qb-divider); border-radius:var(--qb-r-card); background:var(--qb-inset);}
.authoritative-overview-actions h2{margin:3px 0 0; font-size:18px;}.authoritative-overview-actions p:last-child{margin:5px 0 0; color:var(--qb-text-muted); font-size:13px; line-height:1.45;}
.authoritative-overview-action-list{display:flex; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end; gap:8px;}
.authoritative-overview-workspace-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px;}
.authoritative-overview-workspace{display:flex; align-items:center; justify-content:space-between; gap:16px; min-width:0; padding:16px; text-align:left; border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-card); background:var(--qb-surface); color:var(--qb-text-strong); cursor:pointer;}
.authoritative-overview-workspace:hover{border-color:var(--qb-accent); background:var(--qb-accent-tint);}
.authoritative-overview-workspace>span:first-child{display:grid; min-width:0; gap:4px;}
.authoritative-overview-workspace strong{font-size:14px;}
.authoritative-overview-workspace small{color:var(--qb-text-muted); font-size:12px; line-height:1.35;}
.authoritative-overview-workspace>span:last-child{color:var(--qb-link); font-size:18px;}
.authoritative-overview-state{max-width:780px; margin-top:20px; padding:22px; border:1px solid var(--qb-border-soft); border-radius:var(--qb-r-card); background:var(--qb-surface); box-shadow:var(--qb-shadow-card);}
.authoritative-overview-state h2{margin:0 0 8px; font-size:19px;}.authoritative-overview-state p{margin:0; color:var(--qb-text-muted); line-height:1.55;}
.authoritative-overview-state-loading{border-left:4px solid var(--qb-link);}.authoritative-overview-state-blocked{border-color:var(--qb-warn-line); background:var(--qb-warn-bg);}
.authoritative-page-note{max-width:760px; margin:18px 0 0; color:var(--qb-text-muted); font-size:13px; line-height:1.55;}
.authoritative-unavailable-card{max-width:860px; margin-top:20px; padding:20px; border:1px solid var(--qb-warn-line); border-radius:var(--qb-r-card); background:var(--qb-warn-bg); color:var(--qb-text-strong);}
.authoritative-unavailable-card h2{margin:0 0 8px; font-size:18px;}
.authoritative-unavailable-card p{max-width:760px; margin:0; line-height:1.55;}
.authoritative-unavailable-requirements{max-width:760px; margin-top:18px; padding-top:16px; border-top:1px solid var(--qb-warn-line);}
.authoritative-unavailable-requirements h2{margin:0; font-size:15px;}
.authoritative-unavailable-requirements ul{margin:8px 0 0; padding-left:20px; line-height:1.55;}
.authoritative-unavailable-scope{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:18px 0 0;}
.authoritative-unavailable-scope>div{min-width:0; padding:10px; border:1px solid var(--qb-warn-line); border-radius:var(--qb-r-control); background:var(--qb-surface);}
.authoritative-unavailable-scope dt{color:var(--qb-text-muted); font-size:11px; font-weight:700; text-transform:uppercase;}
.authoritative-unavailable-scope dd{margin:4px 0 0; overflow-wrap:anywhere; font-family:var(--qb-mono); font-size:12px;}
/* --- rail --- */
.nav-rail{
  display:flex; flex-direction:column; align-items:center;
  flex:0 0 var(--qb-rail-w); width:var(--qb-rail-w);
  padding:0 0 8px; background:var(--qb-rail-bg);
  border-right:var(--qb-hair) solid var(--qb-divider);
  /* The rail scrolls when the group list is taller than the viewport. Its
     scrollbar is hidden so the 68px item keeps its full 74px track; the rail
     stays reachable by wheel, keyboard focus, and the mobile drawer. */
  overflow:hidden auto; scrollbar-width:none;
}
.nav-rail::-webkit-scrollbar{width:0; height:0;}
.rail-logo{
  display:grid; place-items:center; flex:0 0 auto;
  width:40px; height:40px; margin:9px 0 6px; border-radius:var(--qb-r-card);
  background:var(--qb-brand); color:var(--qb-brand-fg); font-size:18px; line-height:1;
}
.nav-rail .nav-group{display:flex; flex-direction:column; align-items:center; gap:4px; width:100%; padding:0 0 4px; margin:0;}
.rail-sep{flex:0 0 auto; width:52px; height:0; margin:6px auto; border-top:var(--qb-hair) solid var(--qb-divider);}
.nav-group-t{display:none;}
/* rail item: 68 x 64, 24px icon above an 11/600 label, no lift on hover */
.nav-group-h{
  display:flex; flex:0 0 auto; flex-direction:column; align-items:center; justify-content:flex-start; gap:2px;
  width:var(--qb-rail-item-w); height:var(--qb-rail-item-h); margin:0 auto; padding:2px 2px 0;
  border:0; border-radius:var(--qb-r-card); background:transparent;
  color:var(--qb-text-strong); cursor:pointer; overflow:hidden;
  transition:background-color var(--qb-dur-1) var(--qb-ease-out);
}
.nav-group-h:hover{background:var(--qb-divider);}
.nav-group-h:focus-visible{outline:2px solid var(--qb-accent); outline-offset:-2px;}
.rail-glyph{
  display:grid; place-items:center; flex:0 0 auto;
  width:var(--qb-rail-glyph); height:var(--qb-rail-glyph);
  border-radius:var(--qb-r-panel); background:transparent; color:var(--qb-text-strong);
  transition:background-color var(--qb-dur-1) var(--qb-ease-out),color var(--qb-dur-1) var(--qb-ease-out),transform var(--qb-dur-1) var(--qb-ease-out);
}
.rail-glyph svg{display:block; width:24px; height:24px;
  transition:transform var(--qb-dur-1) var(--qb-ease-out);}
/* The rail changed colour on interaction but never moved, which is what read
   as flat. A 1px lift on hover and a slight settle on the selected glyph give
   the rail a sense of response without animating layout - transform only, so
   nothing reflows, and it is disabled under reduced-motion. */
.nav-group-h:hover .rail-glyph svg{transform:translateY(-1px);}
.nav-group-h:active .rail-glyph svg{transform:translateY(0) scale(.96);}
.nav-group-h.rail-on .rail-glyph svg{transform:scale(1.04);}
@media(prefers-reduced-motion:reduce){
  .rail-glyph svg{transition:none;}
  .nav-group-h:hover .rail-glyph svg,.nav-group-h:active .rail-glyph svg,
  .nav-group-h.rail-on .rail-glyph svg{transform:none;}
}
.rail-label{
  max-width:calc(var(--qb-rail-item-w) - 2px);
  font:600 11px/1.1 var(--qb-sans); color:var(--qb-text-strong); text-align:center;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* Each workspace family has one restrained accent. The rail stays recognisable
   at a glance, while the selected glyph remains high-contrast and professional. */
.nav-group-h.rail-on .rail-glyph{background:var(--qb-brand); color:var(--qb-brand-fg);}
.nav-tone-0 .nav-group-h:hover .rail-glyph{background:var(--nav-0-hover);color:var(--nav-0-ink);}
.nav-tone-1 .nav-group-h:hover .rail-glyph{background:var(--nav-1-hover);color:var(--nav-1-ink);}
.nav-tone-2 .nav-group-h:hover .rail-glyph{background:var(--nav-2-hover);color:var(--nav-2-ink);}
.nav-tone-3 .nav-group-h:hover .rail-glyph{background:var(--nav-3-hover);color:var(--nav-3-ink);}
.nav-tone-4 .nav-group-h:hover .rail-glyph{background:var(--nav-4-hover);color:var(--nav-4-ink);}
.nav-tone-5 .nav-group-h:hover .rail-glyph{background:var(--nav-5-hover);color:var(--nav-5-ink);}
.nav-tone-0 .nav-group-h.rail-on .rail-glyph{background:var(--nav-0-active);color:var(--nav-0-active-fg);}
.nav-tone-1 .nav-group-h.rail-on .rail-glyph{background:var(--nav-1-active);color:var(--nav-1-active-fg);}
.nav-tone-2 .nav-group-h.rail-on .rail-glyph{background:var(--nav-2-active);color:var(--nav-2-active-fg);}
.nav-tone-3 .nav-group-h.rail-on .rail-glyph{background:var(--nav-3-active);color:var(--nav-3-active-fg);}
.nav-tone-4 .nav-group-h.rail-on .rail-glyph{background:var(--nav-4-active);color:var(--nav-4-active-fg);}
.nav-tone-5 .nav-group-h.rail-on .rail-glyph{background:var(--nav-5-active);color:var(--nav-5-active-fg);}
/* an expanded group keeps a background tint so the rail still shows which
   groups are listed in the panel - several may be expanded at once */
.nav-group-h[aria-expanded="true"]{background:var(--qb-divider);}
.nav-caret{display:none;}
/* --- second-level panel --- */
.nav-panel{display:flex; flex-direction:column; flex:1 1 auto; min-width:0; overflow:hidden; background:var(--qb-surface);}
.sidebar .brand{
  display:flex; align-items:center; gap:8px; min-height:58px; flex:0 0 auto;
  padding:0 16px; margin:0; border-bottom:var(--qb-hair) solid var(--qb-divider);
  color:var(--qb-text-strong); font-size:16px; font-weight:600; letter-spacing:-.01em;
}
.brand .logo{color:var(--qb-accent); font-size:18px; line-height:1;}
.sidebar .brand-sub{margin-left:auto; color:var(--qb-text-muted); font-size:11px; font-weight:500;}
.new-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  flex:0 0 auto; width:calc(100% - 32px); margin:12px 16px 6px;
  min-height:var(--qb-control-h); padding:0 14px;
  background:var(--qb-brand); color:var(--qb-brand-fg); border:0;
  border-radius:var(--qb-r-control); font:500 16px/1 var(--qb-sans); cursor:pointer;
}
.new-btn:hover{background:var(--qb-brand-hover);}
.sidebar nav{flex:1 1 auto; min-height:0; overflow:hidden auto; padding:2px 0 20px; scrollbar-gutter:stable;}
.nav-panel-title{
  padding:14px 16px 5px; color:var(--qb-text-muted);
  font:600 11px/1.3 var(--qb-sans); letter-spacing:.06em; text-transform:uppercase;
}
.nav-panel-empty{padding:14px 16px; color:var(--qb-text-muted); font-size:13px; line-height:1.5;}
.nav-group-items{display:block; padding:0 0 4px;}
/* panel row: 24px circular colored badge + 14/400 label + right chevron */
.nav-item{
  display:flex; align-items:center; gap:12px; width:100%; margin:0; padding:0 14px;
  min-height:var(--qb-navrow-h); border:0; border-radius:0;
  background:transparent; color:var(--qb-text); font:400 14px/1.35 var(--qb-sans);
  text-align:left; cursor:pointer; transition:background-color var(--qb-dur-1) var(--qb-ease-out);
}
.nav-item:hover{background:var(--qb-canvas);}
.nav-item:focus-visible{outline:2px solid var(--qb-accent); outline-offset:-2px;}
/* Coloured letter badges distinguish related workspace pages while retaining
   the rail's line icons for primary navigation. */
.nav-badge{display:grid;place-items:center;flex:0 0 auto;width:28px;height:28px;border:1px solid transparent;border-radius:8px;font:700 11px/1 var(--qb-sans);letter-spacing:.02em;background:var(--qb-divider);color:var(--qb-text-muted);transition:transform .16s ease,background-color .16s ease,border-color .16s ease;}
.nav-item:hover .nav-badge{transform:translateY(-1px);}
@media(prefers-reduced-motion:reduce){.nav-badge{transition:none;}.nav-item:hover .nav-badge{transform:none;}}
.nav-item-label{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; letter-spacing:-.012em;}
.nav-chev{flex:0 0 auto; color:var(--qb-text-faint); font-size:15px; line-height:1;}
/* The current page is marked by a 3px accent bar, not only by a fill. The fill
   alone is 1.23:1 against the panel in light and 1.16:1 in dark - below the 3:1
   that WCAG 1.4.11 asks of a state indicator - and it also read the same as a
   hover. The bar is --qb-accent, 12.11:1 in light and 9.62:1 in dark. */
.nav-item.nav-on{background:var(--qb-divider); color:var(--qb-text-strong); font-weight:500;
  box-shadow:inset 3px 0 0 0 var(--qb-accent);}
.nav-item.nav-on .nav-chev{color:var(--qb-text-muted);}
/* One hue per navigation group keeps the familiar letter markers readable. */
.nav-tone-0 .nav-badge{background:#D2F0E4;border-color:#A5DCC6;color:#005A43;}
.nav-tone-1 .nav-badge{background:#D9ECFF;border-color:#AFD0EF;color:#194F83;}
.nav-tone-2 .nav-badge{background:#EAE1FF;border-color:#CBB8EC;color:#563B84;}
.nav-tone-3 .nav-badge{background:#FFEBCF;border-color:#EBC885;color:#805400;}
.nav-tone-4 .nav-badge{background:#D9F0F1;border-color:#A9D7DA;color:#1B5961;}
.nav-tone-5 .nav-badge{background:#F9DFE5;border-color:#E6B7C2;color:#7D3544;}
.mobile-nav-btn,.mobile-nav-scrim,.mobile-nav-close{display:none;}

/* ---- Topbar ---- */
.topbar{
  position:sticky; top:0; z-index:20; flex:0 0 auto;
  display:flex; align-items:center; flex-wrap:nowrap; gap:10px; min-width:0;
  height:58px; padding:0 24px;
  background:var(--qb-surface); border-bottom:var(--qb-hair) solid var(--qb-divider);
  border-radius:var(--qb-r-panel) var(--qb-r-panel) 0 0;
}
.topbar>.sw:first-of-type{flex:1 1 340px; min-width:200px; max-width:420px; overflow:hidden;}
.topbar>.sw:first-of-type select{width:100%; min-width:0; text-overflow:ellipsis;}
.sw{display:flex; align-items:center; gap:6px; min-width:0; color:var(--qb-text-muted); font-size:12px;}
.topbar select,.cmdk,.icon-btn,.user-chip,.period-chip{
  background:var(--qb-surface); border:1px solid var(--qb-border); color:var(--qb-text);
}
.topbar select{height:var(--qb-control-h); padding:0 10px; border-radius:var(--qb-r-control); font-size:13px; font-weight:500;}
.authoritative-topbar{gap:12px;}
/* Same compact workbench hierarchy as the complete REFS shell.  These are
   deliberately scope displays, not browser-owned selectors: the entity and
   period come from the configured authoritative API scope. */
.authoritative-entity-chip{
  display:flex; align-items:center; gap:8px; flex:1 1 340px; min-width:190px; max-width:440px;
  height:var(--qb-control-h); padding:0 12px; border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong); overflow:hidden;
}
.authoritative-entity-chip strong{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;}
.authoritative-entity-chip>span:last-child{margin-left:auto; color:var(--qb-text-muted); font-size:16px; line-height:1;}
.authoritative-top-label{flex:0 0 auto; color:var(--qb-text-muted); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;}
.authoritative-period-chip{border-color:var(--qb-border);}
.authoritative-mode-chip{
  display:inline-flex; align-items:center; gap:6px; flex:0 1 auto; min-width:0; height:var(--qb-control-h);
  padding:0 10px; border-radius:var(--qb-r-pill); background:var(--qb-accent-tint); color:var(--qb-accent);
  font-size:12px; font-weight:700; white-space:nowrap;
}
.authoritative-mode-chip>span{color:var(--qb-ok); font-size:11px;}
.authoritative-user-chip{flex:0 1 auto;}
.authoritative-signout{flex:0 0 auto;}
.cmdk{
  flex:0 1 240px; min-width:150px; height:var(--qb-control-h);
  padding:0 12px; border-radius:var(--qb-r-control); text-align:left;
  color:var(--qb-text-muted); font-size:13px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cmdk:hover{border-color:var(--qb-accent); color:var(--qb-text);}
/* `flex:0 1 auto`, not `0 0 auto`. The left cluster is `flex:1 1 auto`, so a
   non-shrinking right cluster cannot give ground and simply overflows the bar.
   Measured on the deployed build at a 1142px viewport: the cluster demanded
   630.9px, document scrollWidth exceeded clientWidth by 7px. Allowing it to
   shrink brings it to 501.9px and the overflow to 0. The chip ellipsises rather
   than clipping, so nothing becomes unreadable. */
.top-right{margin-left:auto; flex:0 1 auto; display:flex; align-items:center; gap:10px; min-width:0; white-space:nowrap;}
.top-right>.sw{display:inline-flex; flex:0 0 auto; align-items:center; white-space:nowrap; word-break:keep-all;}
/* The right cluster shrinks as a whole, but its icon buttons do not, so the
   only shrinkable child - the user chip - absorbed all of it and the 28px
   avatar was squeezed until the initial was clipped in half. The avatar is now
   a fixed track, and the longest label in the cluster (the demonstration-data
   badge) is the one that gives way, with an ellipsis. Identity stays legible;
   nothing overflows the viewport. */
.top-right>.badge{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.demo-label-short,.demo-label-xs,.user-name-short{display:none;}
.user-av{flex:0 0 28px;}
.user-nm{min-width:0; overflow:hidden; text-overflow:ellipsis;}
.icon-btn{
  display:inline-grid; place-items:center; flex:0 0 auto;
  width:var(--qb-control-h); height:var(--qb-control-h);
  border-radius:var(--qb-r-pill); cursor:pointer; font-size:14px; line-height:1;
}
.icon-btn:hover{background:var(--qb-canvas);}
.period-chip{
  display:inline-flex; align-items:center; flex:0 0 auto; gap:7px;
  height:var(--qb-control-h); padding:0 10px; border-radius:var(--qb-r-pill);
  white-space:nowrap; word-break:keep-all;
}
.period-label{color:var(--qb-text-muted); font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;}
.period-chip b{color:var(--qb-text-strong); font-size:12px; white-space:nowrap;}
.period-chip .badge{padding:2px 7px;}
.user-chip{
  /* Shrinkable with the cluster above; `.user-nm` ellipsises so the name
     degrades gracefully instead of pushing the bar past the viewport. */
  display:flex; align-items:center; flex:0 1 auto; min-width:0; gap:8px;
  height:var(--qb-control-h); padding:0 10px 0 3px; border-radius:var(--qb-r-pill); white-space:nowrap;
}
.user-av{
  display:grid; place-items:center; width:28px; height:28px; border-radius:var(--qb-r-pill);
  background:var(--qb-brand); color:var(--qb-brand-fg); font-weight:600; font-size:13px;
}
.user-nm{font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis;}
.user-nm,.brand,.new-btn,.nav-item,.nav-group-h,.btn,.grid-tool,.badge{white-space:nowrap; word-break:keep-all;}

/* ============================ 3. PAGE HIERARCHY ========================== */
/* Measured against QuickBooks Online's report surface (P&L, 1568px): QBO
   spends no vertical budget on a page-level title - a small back link, one
   filter row, then the report. REFS keeps its title for orientation and
   accessibility but at a weight that does not push the figures below the
   fold. 28px/16 -> 22px/10 recovers ~24px on every page. */
.page-h{
  margin:0 0 10px; color:var(--qb-text-strong); background:none; -webkit-text-fill-color:currentColor;
  font-size:22px; line-height:1.25; font-weight:500; letter-spacing:-.012em;
}
.page-eyebrow,.eyebrow,.qbo-eyebrow,.trace-eyebrow{
  margin:0 0 5px; color:var(--qb-text-muted);
  font:600 12px/1.2 var(--qb-sans); letter-spacing:.09em; text-transform:uppercase;
}
.page-subtitle{margin:6px 0 0; color:var(--qb-text-muted); font-size:14px; line-height:1.5; max-width:78ch;}
.page-top,.accounting-page-head{
  display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
  margin:0 0 18px; padding-bottom:16px; border-bottom:var(--qb-hair) solid var(--qb-divider);
}
.page-top{padding-bottom:0; border-bottom:0;}
.accounting-page-head>div{min-width:0;}
.accounting-page-head .row-acts{align-self:center; flex:0 0 auto;}
.reports-head{align-items:center;} .reports-head .page-h{margin:0;}
/* Section headings are deliberately modest: the measured hierarchy is
   greeting (34/500) >> page title (28/400) >> section heading (16/600). */
.sec-title{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:28px 0 12px;}
.sec-title h3,.qb-sec{font-size:16px; line-height:1.4; font-weight:600; margin:0; color:var(--qb-text-strong);}
/* Centered greeting - the home page's only large type. */
.qb-greeting{
  margin:0; color:var(--qb-text-strong); background:none; -webkit-text-fill-color:currentColor;
  font:500 34px/44px var(--qb-sans); letter-spacing:-.01em; text-align:center; overflow-wrap:anywhere;
}
.card-h,.card-head,.recon-title,.bank-summary-title,.split-head,.drawer-title{
  color:var(--qb-text-strong); font:600 14px/1.4 var(--qb-sans);
}
.card-head,.split-head,.gl-drill-head,.source-doc-hero,.ap-aging-head,.report-preview-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px; min-width:0;
}
.card-h{margin-bottom:8px;}
.gl-drill-head{margin:0 0 14px; padding-bottom:14px; border-bottom:var(--qb-hair) solid var(--qb-divider); align-items:center;}
.gl-drill-head>div{min-width:0;}
.gl-drill-crumb{color:var(--qb-text-muted); font-size:12px; font-weight:500; margin-bottom:2px;}
.gl-drill-account{color:var(--qb-text-muted); font-size:12px; margin-top:3px;}
.gl-drill-count{color:var(--qb-text-muted); font-size:12px;}
.gl-drill-actions,.src-actions,.qbe-action-buttons,.qbo-report-row-actions,.source-doc-hero-actions{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0;
}
/* Full-page Back: one affordance, one look, everywhere. */
.crumb,.qbo-report-back>button,.report-preview-crumb{min-width:0;}
.crumb{
  display:inline-flex; align-items:center; gap:7px; min-height:var(--qb-control-h);
  margin:0 0 12px; padding:0 12px 0 8px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-accent);
  font:500 14px/1 var(--qb-sans); text-decoration:none!important; cursor:pointer;
}
.crumb:hover{background:var(--qb-canvas); border-color:var(--qb-accent);}
.crumb-icon{
  display:inline-grid; place-items:center; width:20px; height:20px; flex:0 0 auto;
  border-radius:var(--qb-r-pill); background:var(--qb-accent-tint); color:var(--qb-accent);
  font:400 19px/1 Arial,sans-serif;
}
.qbo-report-back{display:flex; align-items:center; gap:10px; min-width:0; margin-bottom:4px;}
.qbo-report-back>button{
  flex:0 0 auto; min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-accent); font:500 14px/1 var(--qb-sans); cursor:pointer;
}
.qbo-report-back>button:hover{background:var(--qb-canvas); border-color:var(--qb-accent);}
.qbo-report-back>span{min-width:0; color:var(--qb-text-muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}


/* ============================ 4. BUTTONS ================================= */
/* Measured: 36px tall, 16px/500 type, radius 6. Primary is a filled brand
   surface reserved for true primary actions; secondary is a 2px outline. */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong);
  font:500 16px/1 var(--qb-sans); cursor:pointer; box-shadow:none;
  transition:background-color var(--qb-dur-1) var(--qb-ease-out),border-color var(--qb-dur-1) var(--qb-ease-out),color var(--qb-dur-1) var(--qb-ease-out);
}
.btn:hover{background:var(--qb-canvas); border-color:var(--qb-accent);}
.btn:focus-visible{outline:2px solid var(--qb-accent); outline-offset:1px;}
/* `.btn-default` names the neutral variant explicitly. It used to be a phantom
   class - written in the markup, defined nowhere - so it inherited .btn in
   light and had no dark pairing at all, leaving --qb-text-strong on a white
   surface at 1.10:1. It is now a real declaration in both themes. */
.btn-default{background:var(--qb-surface); color:var(--qb-text-strong); border:1px solid var(--qb-border);}
.btn-default:hover{background:var(--qb-canvas); border-color:var(--qb-accent);}
.btn-primary{background:var(--qb-brand); color:var(--qb-brand-fg); border:0; padding:0 14px;}
.btn-primary:hover{background:var(--qb-brand-hover); color:var(--qb-brand-fg); filter:none;}
.btn-secondary{background:transparent; color:var(--qb-accent); border:2px solid var(--qb-accent); padding:0 10px;}
.btn-secondary:hover{background:var(--qb-accent-tint); color:var(--qb-accent);}
.btn-ghost{background:transparent; color:var(--qb-accent); border-color:var(--qb-border);}
.btn-ghost:hover{background:var(--qb-accent-tint);}
.btn-danger{background:var(--qb-bad); color:#FFF; border-color:var(--qb-bad);}
.btn-danger:hover{background:var(--qb-bad); filter:brightness(.92);}
/* Dense in-row action: still a 30px target, but does not out-shout 14px cells. */
.btn-sm{min-height:var(--qb-control-h-sm); padding:0 9px; font-size:13px; font-weight:500;}
.link-btn,.text-btn,.x-sm{
  border:0; background:transparent; padding:0; cursor:pointer;
  color:var(--qb-link); font:500 13px/1.4 var(--qb-sans);
}
.link-btn:hover,.text-btn:hover{text-decoration:underline;}
.x-sm{color:var(--qb-bad); font-size:16px;}
/* One read-only/disabled treatment: reduced contrast, no hover, not-allowed. */
.btn:disabled,.btn[aria-disabled="true"],
button:disabled,[aria-disabled="true"],
.grid-tool:disabled,.qbo-quicklinks button:disabled,
.qbo-report-controls>button:disabled,.qbo-report-previewbar>button:disabled,
.bank-queue-tabs button:disabled,.seg button:disabled{
  background:var(--qb-inset); color:var(--qb-text-faint); border-color:var(--qb-border-soft);
  cursor:not-allowed; box-shadow:none; opacity:1; filter:none;
}
.btn-primary:disabled,.btn-primary[aria-disabled="true"]{background:var(--qb-inset); color:var(--qb-text-faint); border:1px solid var(--qb-border-soft);}
.btn-secondary:disabled,.btn-secondary[aria-disabled="true"]{border:2px solid var(--qb-border-soft); background:transparent;}
button:disabled:hover,[aria-disabled="true"]:hover{background:var(--qb-inset); border-color:var(--qb-border-soft); text-decoration:none;}
input:disabled,select:disabled,textarea:disabled,input[readonly],textarea[readonly],.ro-box{
  background:var(--qb-inset); color:var(--qb-text-muted); cursor:not-allowed;
}
.ro-box{cursor:default;}

/* ---- Segmented control: white item on an #E2E9ED track ---- */
/* Used for queue/tab switching. Counts render inside the label: "Pending (12)". */
.tabs,.seg,.je-queue-chips,.bank-queue-tabs,.qbo-report-tabs,.qbo-segment{
  display:inline-flex; align-items:center; gap:2px; min-width:0; max-width:100%;
  padding:2px; margin:0 0 16px; border:0;
  background:var(--qb-divider); border-radius:var(--qb-r-control);
  overflow:auto hidden; scrollbar-width:none;
}
.tabs::-webkit-scrollbar,.seg::-webkit-scrollbar,.je-queue-chips::-webkit-scrollbar,
.bank-queue-tabs::-webkit-scrollbar{height:0;}
.tab,.seg>button,.je-queue-chips>button,.bank-queue-tabs>button,
.qbo-report-tabs>button,.qbo-segment>button{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  flex:0 0 auto; min-height:32px; padding:0 16px; border:0;
  background:transparent; color:var(--qb-text-muted);
  font:400 16px/1 var(--qb-sans); border-radius:5px; cursor:pointer; white-space:nowrap;
  transition:background-color var(--qb-dur-1) var(--qb-ease-out),color var(--qb-dur-1) var(--qb-ease-out);
}
.tab:hover,.seg>button:hover,.je-queue-chips>button:hover,.bank-queue-tabs>button:hover,
.qbo-report-tabs>button:hover{color:var(--qb-text-strong);}
.tab.tab-on,.tab-on,.seg>button[aria-selected="true"],.seg>button.on,
.je-queue-chips>button.on,.bank-queue-tabs>button.active,
.qbo-report-tabs>button.on,.qbo-segment>button.on{
  background:var(--qb-surface); color:var(--qb-text-strong); border:0;
  box-shadow:var(--qb-shadow-card);
}
/* On a segmented track a disabled item must stay flat: a raised white item
   reads as "selected", which would make an unavailable option look chosen. */
.tab:disabled,.seg>button:disabled,.je-queue-chips>button:disabled,
.bank-queue-tabs>button:disabled,.qbo-report-tabs>button:disabled,.qbo-segment>button:disabled{
  background:transparent; color:var(--qb-text-faint); border:0; box-shadow:none; cursor:not-allowed;
}
/* Report preview bar is an action toolbar, not a queue switcher. */
.qbo-report-previewbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; min-width:0;}
.qbo-report-previewbar>button{
  min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-strong);
  font:500 14px/1 var(--qb-sans); cursor:pointer; white-space:nowrap;
}
.qbo-report-previewbar>button:hover:not(:disabled){border-color:var(--qb-accent);}
.qbo-report-previewbar>button.on{border:2px solid var(--qb-accent); background:var(--qb-accent-tint); color:var(--qb-accent);}
.bank-queue-tabs{padding:2px; margin:14px 16px 0;}
/* Count pill */
.badge-count,.bank-queue-tabs button span,.je-queue-chips button span{
  display:inline-grid; place-items:center; min-width:20px; height:18px; padding:0 7px;
  border-radius:var(--qb-r-pill); background:var(--qb-divider); color:var(--qb-text-muted);
  font:500 11px/1 var(--qb-sans);
}
.bank-queue-tabs button.active span,.je-queue-chips button.on span{background:var(--qb-accent-tint); color:var(--qb-accent);}
/* Legacy chip filters keep a single calm look rather than a filled brand pill. */
.chips{display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px;}
.chip,.step-chip,.mo-chip,.report-shelf-chip,.grid-tool,.ck{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:var(--qb-control-h-sm); padding:0 10px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text-muted);
  font:500 13px/1 var(--qb-sans); cursor:pointer; white-space:nowrap;
}
.chip:hover,.step-chip:hover,.mo-chip:hover,.grid-tool:hover{border-color:var(--qb-accent); color:var(--qb-text-strong);}
.chip-on,.step-chip.step-on,.mo-chip.mo-on,.report-shelf-chip-on{
  background:var(--qb-accent-tint); border:2px solid var(--qb-accent); color:var(--qb-accent); font-weight:600;
}
.step-chip.step-done{color:var(--qb-ok); border-color:var(--qb-ok-line); background:var(--qb-ok-bg);}
.ck{cursor:default; min-height:auto; padding:6px 12px; font-size:12px;}
.ck.ok{color:var(--qb-ok); border-color:var(--qb-ok-line); background:var(--qb-ok-bg);}
.ck.warn{color:var(--qb-warn); border-color:var(--qb-warn-line); background:var(--qb-warn-bg);}
.ck.bad{color:var(--qb-bad); border-color:var(--qb-bad-line); background:var(--qb-bad-bg);}
.check-band{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.stepper{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.mo-chips{display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap;}
.mo-chip{position:relative; width:36px; padding:0; justify-content:center;}
.mo-dot{position:absolute; top:3px; right:3px; width:5px; height:5px; border-radius:50%; background:var(--qb-ok);}

/* ============================ 5. FORM CONTROLS =========================== */
input,select,textarea{font-family:inherit;}
select,input[type=text],input[type=search],input[type=date],input[type=number],input:not([type]),
.grid-search,.field input,.field select,.desc-in,.desc-line,.date-in,.input,
.filter-bar select,.bank-search,.expense-search,.je-search,.qbo-report-search input,
.qbo-report-controls select,.filterbar input,.filterbar select{
  min-height:var(--qb-control-h); padding:0 12px;
  border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text); font-size:14px; line-height:1.4;
}
textarea,.input[rows],.field textarea,.ro-box{
  padding:9px 12px; border:1px solid var(--qb-border); border-radius:var(--qb-r-control);
  background:var(--qb-surface); color:var(--qb-text); font:400 14px/1.5 var(--qb-sans); width:100%;
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--qb-accent); outline-offset:0; border-color:var(--qb-accent);
}
select{padding-right:28px; cursor:pointer;}
.field{margin:14px 0; min-width:0;}
.field label{display:block; margin-bottom:5px; color:var(--qb-text-muted); font:500 12px/1.4 var(--qb-sans);}
.field input,.field select,.field textarea{width:100%;}
.req{color:var(--qb-bad); margin-left:3px;}
.field-msg{margin-top:4px; color:var(--qb-text-muted); font-size:12px;}
.field-msg.err,.err{color:var(--qb-bad);}
.field-err input,.field-err select{border-color:var(--qb-bad);}
.ro-box{min-height:var(--qb-control-h);}
.num-in{text-align:right; font-variant-numeric:tabular-nums;}
.desc-in,.desc-line{width:100%; max-width:420px;}
.date-in{max-width:150px;}
.dim-picks{display:flex; gap:6px; flex-wrap:wrap;}
.dim-picks select{min-height:var(--qb-control-h-sm); font-size:12px; padding:0 6px; max-width:120px;}
/* Search fields carry a trailing glyph, matching the measured pattern. */
.expense-search,.je-search,.bank-search{
  display:inline-flex; flex-direction:row-reverse; align-items:center; gap:8px;
  min-width:220px; flex:1 1 260px; max-width:420px; padding:0 12px;
}
.expense-search input,.je-search input,.bank-search input{
  flex:1 1 auto; min-width:0; width:100%; border:0; outline:0; background:transparent;
  font:inherit; color:inherit; min-height:auto; padding:0;
}
.expense-search>span,.je-search>span,.bank-search>span,.bank-search-glyph{
  flex:0 0 auto; color:var(--qb-text-muted); font-size:15px; line-height:1;
}

/* ---- Filter / toolbar rows: responsive grids, never a wrapping mess ---- */
.filter-bar,.expense-toolbar,.filterbar,.je-filter-bar,.bank-toolbar,
.fixed-assets-filter,.loan-select,.filter-row,.pickup-bar,.ap-aging-kpis{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:0;
  margin:0 0 16px; padding:14px 16px;
  background:var(--qb-surface); border:var(--qb-hair) solid var(--qb-divider);
  border-radius:var(--qb-r-card); box-sizing:border-box;
}
.authoritative-scope-bar{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 16px;padding:10px 14px;border:var(--qb-hair) solid var(--qb-border);border-radius:8px;background:var(--qb-surface-subtle);font-size:12px;color:var(--qb-text-muted);}
.authoritative-scope-bar span{min-width:0;overflow-wrap:anywhere;}
.authoritative-scope-bar b{color:var(--qb-text-strong);margin-right:4px;}
.authoritative-list-filters{margin-bottom:16px;}
.authoritative-list-filters label{display:flex;align-items:center;gap:6px;}
.authoritative-list-filters input,.authoritative-list-filters select{min-width:0;}
.authoritative-list-filters .result-count{margin-left:auto;color:var(--qb-text-muted);font-size:12px;}

/* Shared authoritative workbench frame.  It adopts the demonstrated product
   hierarchy (a clear page deck, numbered reading path, and full-page detail)
   without bringing any demonstration data, local persistence, or commands
   into the authenticated runtime. */
.authoritative-workbench-shell{min-width:0;}
.authoritative-workbench-shell>.accounting-page-head,.authoritative-workbench-shell>.authoritative-page-header{position:relative;overflow:hidden;margin-bottom:10px;padding:20px;border:var(--qb-hair) solid var(--qb-divider);border-radius:var(--qb-r-card);background:linear-gradient(135deg,var(--qb-surface) 0%,var(--qb-inset) 100%);box-shadow:var(--qb-shadow-card);}
.authoritative-workbench-shell>.accounting-page-head::after,.authoritative-workbench-shell>.authoritative-page-header::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--qb-accent);}
.authoritative-workbench-shell>.accounting-page-head>*,.authoritative-workbench-shell>.authoritative-page-header>*{position:relative;}
.authoritative-workbench-rail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px;color:var(--qb-text-muted);font-size:12px;}
.authoritative-workbench-rail span{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 10px;border:var(--qb-hair) solid var(--qb-divider);border-radius:var(--qb-r-pill);background:var(--qb-surface);}
.authoritative-workbench-rail b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--qb-accent-tint);color:var(--qb-accent);font-size:11px;}
.authoritative-evidence-page{padding-top:4px;}
.authoritative-evidence-page>.qbo-report-back{position:sticky;top:0;z-index:1;margin:0 -2px 14px;padding:8px 2px;background:color-mix(in srgb,var(--qb-canvas) 94%,transparent);border-bottom:var(--qb-hair) solid var(--qb-divider);}

/* WBS transition evidence is a formal signed-contract reader. Its visual
   hierarchy mirrors the authoritative workbench while preserving a strict
   evidence-only boundary: these cards report what is required or verified,
   never provide WBS or accounting commands. */
.authoritative-wbs-transition-workspace{min-width:0;}
.authoritative-wbs-transition-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;}
.authoritative-wbs-transition-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.authoritative-wbs-transition-scope{display:grid;grid-template-columns:auto minmax(150px,.9fr) minmax(150px,.9fr) minmax(240px,1.6fr);gap:12px;align-items:center;margin:0 0 16px;padding:14px 16px;border:var(--qb-hair) solid var(--qb-divider);border-radius:var(--qb-r-card);background:var(--qb-surface);box-shadow:var(--qb-shadow-card);}
.authoritative-wbs-transition-scope-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--qb-brand);color:var(--qb-brand-fg);font-size:17px;font-weight:800;}
.authoritative-wbs-transition-scope div{min-width:0;display:flex;flex-direction:column;gap:3px;}
.authoritative-wbs-transition-scope small{color:var(--qb-text-muted);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
.authoritative-wbs-transition-scope strong{overflow-wrap:anywhere;color:var(--qb-text-strong);font-size:13px;}
.authoritative-wbs-transition-scope p{margin:0;color:var(--qb-text-muted);font-size:12px;line-height:1.45;}
.authoritative-wbs-transition-boundaries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px;}

/* ============================ 7. BADGES ================================== */
.badge{
  display:inline-flex; align-items:center; gap:6px; max-width:100%;
  padding:2px 8px; border-radius:var(--qb-r-pill);
  font:500 11px/1.5 var(--qb-sans); letter-spacing:.01em; text-transform:none;
  overflow:hidden; text-overflow:ellipsis; border:0; outline:0; box-shadow:none;
}
.badge::before{content:''; flex:0 0 auto; width:6px; height:6px; border-radius:50%; background:currentColor;}
.badge-muted{background:var(--qb-divider); color:var(--qb-text-muted);}
.badge-ok{background:var(--qb-ok-bg); color:var(--qb-ok);}
.badge-warn{background:var(--qb-warn-bg); color:var(--qb-warn);}
.badge-bad{background:var(--qb-bad-bg); color:var(--qb-bad);}
/* ---- Workflow shape alphabet (round 3) --------------------------------------
   Colour alone cannot carry Draft / Pending review / Approved / Posted /
   Reversed for a reader with a colour vision deficiency, and tone is only a
   three-way split (muted / warn / ok+bad) while the workflow has five states.
   Each stage therefore also has its own MARK GEOMETRY, readable in greyscale:

     Draft            hollow ring        nothing committed yet
     Pending review   half-filled ring   committed, awaiting a second pair of eyes
     Approved         filled circle      complete
     Posted           filled square      immutable - a different shape entirely
     Reversed / void  horizontal bar     struck through

   The mark is decorative (`::before` on an aria-hidden pseudo-element); the
   status word itself remains the accessible name, so nothing depends on shape
   alone either. A badge is a statement of state, never a control. ------------- */
.badge-s-draft::before{background:transparent; box-shadow:inset 0 0 0 1.5px currentColor;}
.badge-s-progress::before{
  background:linear-gradient(90deg,currentColor 0 50%,transparent 50% 100%);
  box-shadow:inset 0 0 0 1.5px currentColor;
}
.badge-s-approved::before{background:currentColor;}
.badge-s-posted::before{width:7px; height:7px; border-radius:1px; background:currentColor;}
.badge-s-posted{font-weight:600;}
.badge-s-reversed::before{width:8px; height:2px; border-radius:1px; background:currentColor;}

.authoritative-coa-table th:nth-child(4),.authoritative-coa-table td:nth-child(4){width:7%;}
.authoritative-coa-table th:nth-child(5),.authoritative-coa-table td:nth-child(5){width:8%;}
.authoritative-coa-table th:nth-child(6),.authoritative-coa-table td:nth-child(6),.authoritative-coa-table th:nth-child(7),.authoritative-coa-table td:nth-child(7),.authoritative-coa-table th:nth-child(8),.authoritative-coa-table td:nth-child(8),.authoritative-coa-table th:nth-child(9),.authoritative-coa-table td:nth-child(9){width:9%;}
.authoritative-coa-table th:nth-child(10),.authoritative-coa-table td:nth-child(10){width:8%;}
